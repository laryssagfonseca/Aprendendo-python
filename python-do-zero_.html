/* ===================================================================
   Módulo 6: Funções como valores
   =================================================================== */
MODS.push({
  id: 'm6', icon: '🧰', title: 'Funções como valores', sub: 'Guardar, passar e devolver funções',
  lead: 'Até agora, funções eram só chamadas: <code>nome(argumentos)</code>. Mas em Python, uma função também é um <b>valor</b> — como um número ou um texto. Dá pra guardar numa variável, passar como argumento para outra função, e até devolver de dentro de uma função. Esse é o último degrau antes de ferramentas como orientação a objetos.',
  blocks: [
    H2('Uma função também é um valor'),
    CODE('Sem os parênteses, o <b>nome</b> de uma função é só um valor — que aponta para ela', 'def cumprimentar(nome):\n    return "Oi, " + nome\n\nsaudacao = cumprimentar\nprint(saudacao("Ana"))', {
      lines: [[[1, 2], 'Uma função comum.'], [4, 'Sem parênteses, <code>cumprimentar</code> não é <b>chamada</b> — é só guardada, como se fosse um número, numa nova variável.'], [5, '<code>saudacao</code> agora é "a mesma função com outro nome". Chamá-la com <code>()</code> funciona igual.']],
      why: 'Os parênteses são o que <b>chama</b> a função. Sem eles, você está falando da função em si — o mesmo "objeto" que fica guardado na memória, não importa quantos nomes apontem para ele.',
    }),
    H2('Passando função como argumento'),
    CODE('Uma função pode receber outra função como parâmetro', 'def aplicar(f, valor):\n    return f(valor)\n\ndef dobro(x):\n    return x * 2\n\ndef quadrado(x):\n    return x * x\n\nprint(aplicar(dobro, 5))\nprint(aplicar(quadrado, 5))', {
      lines: [[[1, 2], '<code>aplicar</code> recebe uma função (<code>f</code>) e um valor, e chama <code>f(valor)</code> por dentro.'], [[9, 10], 'A <b>mesma</b> função <code>aplicar</code> se comporta diferente dependendo de qual função você passa para ela.']],
      why: 'Isso evita repetir o mesmo "molde" de código várias vezes só trocando qual operação é feita — a operação em si vira um parâmetro.',
    }),
    H2('Função que devolve função'),
    CODE('Uma "fábrica" de funções: <code>criar_multiplicador</code> devolve uma função nova, ajustada', 'def criar_multiplicador(fator):\n    def multiplicar(x):\n        return x * fator\n    return multiplicar\n\nvezes3 = criar_multiplicador(3)\nvezes10 = criar_multiplicador(10)\nprint(vezes3(4))\nprint(vezes10(4))', {
      lines: [[[1, 3], '<code>criar_multiplicador</code> define uma função <b>por dentro</b> (<code>multiplicar</code>) e a devolve — sem chamá-la.'], [[6, 7], 'Cada chamada de <code>criar_multiplicador</code> cria uma função "sob medida", que <b>lembra</b> do <code>fator</code> que recebeu.'], [[8, 9], '<code>vezes3</code> e <code>vezes10</code> são funções diferentes, cada uma com seu próprio "fator" guardado.']],
      why: 'Isso se chama <b>closure</b> (fechamento): a função de dentro "leva junto" as variáveis que existiam ao seu redor no momento em que foi criada, mesmo depois que <code>criar_multiplicador</code> já terminou de rodar.',
    }),
    H2('Guardando estado com uma caixinha'),
    P('E se a função "de dentro" precisar <b>alterar</b> uma variável de fora, tipo um contador? Em Python de verdade existe a palavra <code>nonlocal</code> para isso — mas ela não está disponível neste curso. A solução: guardar o valor dentro de um <b>dicionário</b>, e alterar uma <b>chave</b> dele (o que não conta como "reatribuir a variável").'),
    CODE('Um contador que lembra seu valor entre chamadas', 'def criar_contador():\n    estado = {"valor": 0}\n    def incrementar():\n        estado["valor"] = estado["valor"] + 1\n        return estado["valor"]\n    return incrementar\n\ncontar = criar_contador()\nprint(contar())\nprint(contar())\nprint(contar())', {
      lines: [[2, 'A "caixinha": um dicionário com uma única chave, <code>"valor"</code>.'], [[3, 5], '<code>incrementar</code> não recria a variável <code>estado</code> — só <b>altera uma chave de dentro dela</b>. Por isso funciona sem <code>nonlocal</code>.'], [[8, 10], 'Cada chamada de <code>contar()</code> lembra do valor da chamada anterior: 1, 2, 3…']],
      why: 'Reatribuir <code>estado = outra_coisa</code> criaria uma variável local nova (e daria erro sem <code>nonlocal</code>). Mas <code>estado["valor"] = ...</code> não reatribui <code>estado</code> — só muda o que tem <b>dentro</b> dele, e isso é sempre permitido.',
      wi: [['Chamar <code>criar_contador()</code> de novo numa variável diferente', 'Cria um contador <b>novo e independente</b>, com seu próprio <code>estado</code>, começando do zero.']],
    }),
    H2('Funções guardadas num dicionário'),
    CODE('Um "menu" de operações, escolhida por nome — sem uma corrente enorme de <code>if/elif</code>', 'def somar(a, b):\n    return a + b\n\ndef subtrair(a, b):\n    return a - b\n\noperacoes = {"soma": somar, "sub": subtrair}\nnome_op = "soma"\nprint(operacoes[nome_op](5, 3))', {
      lines: [[[1, 4], 'Duas funções normais.'], [6, 'O dicionário guarda as <b>funções em si</b> como valores, não os resultados delas.'], [8, '<code>operacoes[nome_op]</code> busca a função certa pelo nome; o <code>(5, 3)</code> logo depois <b>chama</b> ela.']],
      why: 'Esse padrão (chamado de "tabela de despacho") é uma alternativa elegante a uma longa cadeia de <code>if nome_op == "soma": ... elif nome_op == "sub": ...</code> — útil quando o conjunto de operações pode crescer.',
    }),
  ],
  ex: [
    { id: 'm6-1', lvl: 1, k: 'pr', t: 'Função guardada com outro nome', q: '<p>O que aparece na tela?</p>', code: 'def cumprimentar(nome):\n    return "Oi, " + nome\n\nfuncao_nova = cumprimentar\nprint(funcao_nova("Ana"))\nprint(cumprimentar("Bruno"))', h: ['<code>funcao_nova</code> não é uma função diferente — é <b>a mesma</b> função <code>cumprimentar</code>, só com outra etiqueta.'], x: '<p>Como <code>funcao_nova = cumprimentar</code> (sem parênteses) só cria um segundo nome para a mesma função, chamar qualquer um dos dois nomes dá o mesmo resultado: <b>Oi, Ana</b> e <b>Oi, Bruno</b>.</p>' },
    { id: 'm6-2', lvl: 2, t: 'Aplicando uma função escolhida', q: '<p>Crie <code>aplicar_duas_vezes(f, valor)</code>: aplica a função <code>f</code> no <code>valor</code> <b>duas vezes seguidas</b> e devolve o resultado. Ex.: com <code>dobro</code>, <code>aplicar_duas_vezes(dobro, 3)</code> devolve 12 (3 → 6 → 12).</p>', start: 'def dobro(x):\n    return x * 2\n\ndef aplicar_duas_vezes(f, valor):\n    pass\n', h: ['Chame <code>f</code> uma vez, guarde o resultado, e chame <code>f</code> de novo nesse resultado.'], s: 'def dobro(x):\n    return x * 2\n\ndef aplicar_duas_vezes(f, valor):\n    primeiro = f(valor)\n    return f(primeiro)', tests: [{ c: 'print(aplicar_duas_vezes(dobro, 3))' }, { c: 'print(aplicar_duas_vezes(dobro, 1))' }], x: '<p><code>f</code> é só um nome apontando pra uma função — chamá-la duas vezes seguidas (<code>f(f(valor))</code>, ou em dois passos como aqui) funciona qualquer que seja a função passada.</p>' },
    { id: 'm6-3', lvl: 2, t: 'Fábrica de saudações', q: '<p>Crie <code>criar_saudador(saudacao)</code>: devolve uma função que recebe um <code>nome</code> e devolve <code>"{saudacao}, {nome}!"</code>. Ex.: <code>criar_saudador("Olá")("Ana")</code> devolve <code>"Olá, Ana!"</code>.</p>', start: 'def criar_saudador(saudacao):\n    pass\n', h: ['Defina uma função por dentro: <code>def saudar(nome): ...</code>, que usa a variável <code>saudacao</code> de fora.', 'No fim de <code>criar_saudador</code>, devolva <code>saudar</code> (sem chamar).'], s: 'def criar_saudador(saudacao):\n    def saudar(nome):\n        return f"{saudacao}, {nome}!"\n    return saudar', tests: [{ c: 'ola = criar_saudador("Olá")\nprint(ola("Ana"))' }, { c: 'tchau = criar_saudador("Tchau")\nprint(tchau("Bruno"))' }], x: '<p>A função <code>saudar</code>, definida por dentro, "leva junto" o valor de <code>saudacao</code> que existia no momento em que foi criada — mesmo sendo chamada bem depois, já fora de <code>criar_saudador</code>.</p>' },
    { id: 'm6-4', lvl: 3, t: 'Fábrica de multiplicadores', q: '<p>Crie <code>criar_multiplicador(fator)</code>: devolve uma função que multiplica qualquer número recebido por <code>fator</code>. Ex.: <code>criar_multiplicador(3)(4)</code> devolve 12.</p>', start: 'def criar_multiplicador(fator):\n    pass\n', h: ['Igual ao exemplo da lição: uma função por dentro que usa <code>fator</code>, devolvida sem ser chamada.'], s: 'def criar_multiplicador(fator):\n    def multiplicar(x):\n        return x * fator\n    return multiplicar', tests: [{ c: 'vezes5 = criar_multiplicador(5)\nprint(vezes5(3))\nprint(vezes5(10))' }, { c: 'vezes0 = criar_multiplicador(0)\nprint(vezes0(100))' }], x: '<p>Cada chamada de <code>criar_multiplicador</code> gera uma função nova e independente, cada uma "lembrando" do seu próprio <code>fator</code>.</p>' },
    { id: 'm6-5', lvl: 3, t: 'Contador regressivo', q: '<p>Crie <code>criar_contador_regressivo(inicio)</code>: devolve uma função que, a cada chamada, devolve o próximo número, começando em <code>inicio</code> e diminuindo 1 por vez. Ex.: começando em 3: primeira chamada devolve 3, segunda devolve 2, terceira devolve 1.</p>', start: 'def criar_contador_regressivo(inicio):\n    pass\n', h: ['Use a "caixinha" (dicionário) como no exemplo do contador: <code>estado = {"valor": inicio}</code>.', 'A função de dentro devolve o valor atual e <b>depois</b> diminui: <code>atual = estado["valor"]</code>, <code>estado["valor"] = estado["valor"] - 1</code>, <code>return atual</code>.'], s: 'def criar_contador_regressivo(inicio):\n    estado = {"valor": inicio}\n    def proximo():\n        atual = estado["valor"]\n        estado["valor"] = estado["valor"] - 1\n        return atual\n    return proximo', tests: [{ c: 'c = criar_contador_regressivo(3)\nprint(c())\nprint(c())\nprint(c())' }, { c: 'c = criar_contador_regressivo(1)\nprint(c())' }], x: '<p>A chave <code>"valor"</code> dentro do dicionário <code>estado</code> é alterada a cada chamada, sem precisar recriar a variável <code>estado</code> em si — por isso a função "lembra" onde parou.</p>' },
    { id: 'm6-6', lvl: 3, t: 'Menu de operações', q: '<p>Dadas as funções <code>somar</code> e <code>subtrair</code>, crie o dicionário <code>operacoes</code> ligando <code>"soma"</code> e <code>"sub"</code> às funções correspondentes. Depois, peça ao usuário o nome de uma operação e mostre o resultado dela aplicada a 10 e 4, no formato <code>Resultado: 14</code>.</p>', start: 'def somar(a, b):\n    return a + b\n\ndef subtrair(a, b):\n    return a - b\n\n# crie o dicionario "operacoes" aqui\n', h: ['<code>operacoes = {"soma": somar, "sub": subtrair}</code>.', 'Peça a operação com <code>input()</code> e chame: <code>operacoes[escolha](10, 4)</code>.'], s: 'def somar(a, b):\n    return a + b\n\ndef subtrair(a, b):\n    return a - b\n\noperacoes = {"soma": somar, "sub": subtrair}\nescolha = input("Operação (soma/sub): ")\nresultado = operacoes[escolha](10, 4)\nprint(f"Resultado: {resultado}")', tests: [{ i: ['soma'] }, { i: ['sub'] }], x: '<p>Guardar as próprias funções no dicionário (não os resultados) permite escolher <b>qual</b> executar só na hora de chamar, usando o nome digitado como chave.</p>' },
    { id: 'm6-7', lvl: 4, proj: true, t: 'Desafio: calculadora por despacho', q: '<p>Monte uma calculadora usando um dicionário de operações (<code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>). Peça dois números e o símbolo da operação. Se o símbolo existir no dicionário, mostre <code>Resultado: 14.0</code>; se não existir, mostre <code>Operação inválida</code>. Trate também a divisão por zero com <code>try/except</code>, mostrando <code>Não é possível dividir por zero</code>.</p>', plan: ['Quatro funções pequenas: <code>somar</code>, <code>subtrair</code>, <code>multiplicar</code>, <code>dividir</code>.', 'Um dicionário <code>operacoes</code> ligando os símbolos a essas funções.', 'Use <code>in</code> para checar se o símbolo existe no dicionário antes de chamar; um <code>try/except ZeroDivisionError</code> em volta da chamada.'], start: 'def somar(a, b):\n    return a + b\n\ndef subtrair(a, b):\n    return a - b\n\ndef multiplicar(a, b):\n    return a * b\n\ndef dividir(a, b):\n    return a / b\n\noperacoes = {"+": somar, "-": subtrair, "*": multiplicar, "/": dividir}\n', h: ['<code>if simbolo in operacoes:</code> decide se a operação existe.', 'Dentro do <code>if</code>, use <code>try/except ZeroDivisionError</code> em volta de <code>operacoes[simbolo](n1, n2)</code>.'], s: 'def somar(a, b):\n    return a + b\n\ndef subtrair(a, b):\n    return a - b\n\ndef multiplicar(a, b):\n    return a * b\n\ndef dividir(a, b):\n    return a / b\n\noperacoes = {"+": somar, "-": subtrair, "*": multiplicar, "/": dividir}\n\nn1 = float(input("Primeiro número: "))\nn2 = float(input("Segundo número: "))\nsimbolo = input("Operação (+, -, *, /): ")\n\nif simbolo in operacoes:\n    try:\n        resultado = operacoes[simbolo](n1, n2)\n        print(f"Resultado: {resultado}")\n    except ZeroDivisionError:\n        print("Não é possível dividir por zero")\nelse:\n    print("Operação inválida")', tests: [{ i: ['10', '4', '+'] }, { i: ['10', '0', '/'] }, { i: ['10', '4', 'x'] }, { i: ['3', '4', '*'] }], x: '<p>É o mesmo problema do módulo de erros — mas agora, em vez de uma corrente de <code>if/elif</code> para escolher a operação, usamos o dicionário de funções: adicionar uma operação nova é só acrescentar uma linha no dicionário, sem mexer no resto do código.</p>' },
    { id: 'm6-b1', lvl: 3, bug: true, k: 'mc', t: 'Alterando a variável de fora sem a caixinha', q: '<p>Este contador deveria funcionar, mas dispara <i>UnboundLocalError</i> na primeira chamada. Por quê?</p>', code: 'def criar_contador():\n    valor = 0\n    def incrementar():\n        valor = valor + 1\n        return valor\n    return incrementar\n\ncontar = criar_contador()\nprint(contar())', o: ['<code>incrementar</code> tenta <b>reatribuir</b> a variável <code>valor</code> de fora (<code>valor = valor + 1</code>), o que a torna uma variável <b>local nova</b> — e Python não permite usá-la (no lado direito) antes de criá-la', 'Faltou <code>return</code> na função <code>criar_contador</code>', 'O nome <code>incrementar</code> está em conflito com uma palavra reservada', 'Falta declarar <code>valor</code> como número antes'], a: 0, h: ['Compare com o exemplo do contador da lição, que usa um dicionário em vez de uma variável solta.'], x: '<p>Assim que o Python vê <code>valor = ...</code> dentro de <code>incrementar</code>, ele trata <code>valor</code> como uma variável <b>local</b> daquela função — e uma local não pode ser lida (<code>valor + 1</code>) antes de ser criada. Em Python "de verdade" isso se resolve com <code>nonlocal valor</code>, mas esse curso não suporta essa palavra-chave — por isso usamos a "caixinha" (dicionário), que não reatribui a variável de fora, só muda o que tem dentro dela.</p>', fix: 'def criar_contador():\n    estado = {"valor": 0}\n    def incrementar():\n        estado["valor"] = estado["valor"] + 1\n        return estado["valor"]\n    return incrementar\n\ncontar = criar_contador()\nprint(contar())' },
    { id: 'm6-b2', lvl: 2, bug: true, k: 'mc', t: 'Chamar em vez de guardar', q: '<p>O código deveria guardar a <b>função</b> <code>cumprimentar</code> numa nova variável, mas dispara <i>TypeError</i>. Por quê?</p>', code: 'def cumprimentar(nome):\n    return "Oi, " + nome\n\nsaudacao = cumprimentar()\nprint(saudacao)', o: ['Os parênteses em <code>cumprimentar()</code> <b>chamam</b> a função na hora — e ela precisa de um argumento (<code>nome</code>) que não foi dado', 'Falta <code>return</code> na função', 'O nome <code>saudacao</code> já existe em outro lugar', 'Funções não podem ser guardadas em variáveis'], a: 0, h: ['Compare <code>saudacao = cumprimentar</code> com <code>saudacao = cumprimentar()</code> — qual dos dois chama a função?'], x: '<p><code>cumprimentar()</code>, com parênteses, <b>chama</b> a função imediatamente — e como ela exige um parâmetro <code>nome</code> que não foi passado, o Python reclama: <i>cumprimentar() missing 1 required positional argument: \'nome\'</i>. Para só <b>guardar</b> a função sem chamá-la, os parênteses não entram.</p>', fix: 'def cumprimentar(nome):\n    return "Oi, " + nome\n\nsaudacao = cumprimentar\nprint(saudacao("Ana"))' },
  ],
  quiz: [
    { q: 'O que <code>outra_variavel = minha_funcao</code> (sem parênteses) faz?', o: ['Chama <code>minha_funcao</code> e guarda o resultado', 'Guarda a <b>própria função</b> em <code>outra_variavel</code>, sem chamá-la', 'Dá erro de sintaxe', 'Cria uma cópia independente da função'], a: 1, x: 'Sem parênteses, o nome de uma função é só um valor — igual um número ou texto. <code>outra_variavel</code> passa a apontar para a mesma função.' },
    { q: 'Por que uma função pode receber outra função como argumento?', o: ['Porque funções em Python também são valores, como qualquer outro', 'Isso não é possível em Python', 'Só é possível com o módulo <code>functools</code>', 'Só funciona com funções sem parâmetros'], a: 0, x: 'Em Python, funções são valores de primeira classe: podem ser guardadas, passadas como argumento e devolvidas de dentro de outras funções.' },
    { q: 'O que é uma closure?', o: ['Um erro de sintaxe', 'Uma função de dentro que "leva junto" as variáveis do ambiente onde foi criada', 'Um tipo de laço', 'Um dicionário especial'], a: 1, x: 'Quando uma função definida dentro de outra usa uma variável de fora, ela guarda uma referência a esse ambiente — mesmo depois que a função externa já terminou. Isso é uma closure.' },
    { q: 'Por que este curso usa um dicionário para guardar estado num contador, em vez de reatribuir uma variável direto?', o: ['Porque dicionários são mais rápidos', 'Porque a palavra-chave <code>nonlocal</code>, que permitiria reatribuir a variável de fora, não está disponível neste curso', 'Porque números não podem ser guardados em closures', 'Não há motivo, é só estilo'], a: 1, x: 'Reatribuir uma variável de fora dentro de uma função aninhada exige <code>nonlocal</code> em Python — como esse curso não suporta essa palavra-chave, o truque é alterar uma <b>chave</b> de um dicionário, o que não conta como reatribuição da variável em si.' },
    { q: 'Qual a vantagem de um dicionário de funções (tabela de despacho) sobre uma cadeia de <code>if/elif</code>?', o: ['É sempre mais rápido de executar', 'Adicionar uma nova opção é só acrescentar uma entrada no dicionário, sem alterar a lógica existente', 'Só funciona com números', 'Não tem vantagem nenhuma'], a: 1, x: 'Com um dicionário de funções, estender o comportamento (uma operação nova, por exemplo) não exige tocar no código que já funciona — só adicionar uma nova entrada.' },
  ],
});;

    { id: 'm7-2', lvl: 1, k: 'pr', t: 'O range começa no zero', q: '<p>O que vai aparecer na tela?</p>', code: 'for i in range(3):\n    print(i)', h: ['<code>range(3)</code> não começa em 1.'], x: '<p><code>range(3)</code> gera 0, 1 e 2: três voltas, começando do zero.</p>' },

    { id: 'm7-5', lvl: 2, k: 'pr', t: 'Lista e posições', q: '<p>O que aparece? (2 linhas)</p>', code: 'notas = [7, 8, 9]\nnotas.append(10)\nprint(len(notas))\nprint(notas[1])', h: ['Depois do append, quantos itens há?', 'A posição 1 é o <b>segundo</b> item.'], x: '<p>A lista ficou <code>[7, 8, 9, 10]</code>: <code>len</code> = <b>4</b>. <code>notas[1]</code> é o segundo item: <b>8</b>.</p>' },
    { id: 'm7-6', lvl: 3, t: 'Contagem regressiva', q: '<p>Peça um número N e mostre a contagem regressiva de N até 1 (um por linha), terminando com <code>Fogo!</code>. Use <code>while</code>.</p>', h: ['<code>while n &gt;= 1:</code>', 'Dentro do laço: mostre e diminua: <code>n = n - 1</code>.'], s: 'n = int(input("N: "))\nwhile n >= 1:\n    print(n)\n    n = n - 1\nprint("Fogo!")', tests: [{ i: ['3'] }, { i: ['1'] }], x: '<p>A condição fica verdadeira enquanto <code>n</code> for pelo menos 1. Diminuir <code>n</code> a cada volta garante que o laço termine.</p>' },
    { id: 'm7-7', lvl: 3, t: 'Média de uma lista', q: '<p>Dada a lista <code>notas = [7, 8.5, 6, 9.5]</code>, calcule a média usando um <code>for</code> e mostre <code>Média: 7.75</code>.</p>', start: 'notas = [7, 8.5, 6, 9.5]\n', h: ['Some tudo num acumulador e divida por <code>len(notas)</code>.'], s: 'notas = [7, 8.5, 6, 9.5]\ntotal = 0\nfor nota in notas:\n    total = total + nota\nmedia = total / len(notas)\nprint(f"Média: {media:.2f}")', x: '<p>Acumulamos a soma percorrendo a lista e dividimos pela quantidade de itens (<code>len</code>).</p>' },
    { id: 'm7-8', lvl: 3, t: 'Contando pares', q: '<p>Conte quantos números <b>pares</b> existem de 1 a 20 e mostre <code>Pares: 10</code>.</p>', h: ['Um contador e um <code>if numero % 2 == 0</code> dentro do <code>for</code>.'], s: 'pares = 0\nfor numero in range(1, 21):\n    if numero % 2 == 0:\n        pares = pares + 1\nprint(f"Pares: {pares}")', x: '<p>Um contador (acumulador que soma 1) + uma condição dentro do laço: é o padrão “conte os itens que atendem a uma regra”.</p>' },
    { id: 'm7-9', lvl: 4, proj: true, t: 'Projeto: lista de compras', q: `<p>Peça <b>3 itens</b> (um por vez), guarde numa lista e depois mostre:</p>${BOXPRE('Lista de compras:\n- arroz\n- feijão\n- café')}`, plan: ['Crie uma lista vazia: <code>itens = []</code>.', 'Repita 3 vezes: pergunte um item e faça <code>append</code>.', 'Percorra a lista mostrando cada item com um hífen.'], h: ['<code>for _ in range(3):</code> — repete 3 vezes; <code>itens.append(input(...))</code>.', 'Depois: <code>for item in itens: print(f"- {item}")</code>.'], s: 'itens = []\nfor i in range(3):\n    item = input("Item: ")\n    itens.append(item)\n\nprint("Lista de compras:")\nfor item in itens:\n    print(f"- {item}")', tests: [{ i: ['arroz', 'feijão', 'café'] }, { i: ['pão', 'leite', 'ovos'] }], x: '<p>Primeiro laço: <b>coleta</b> (entrada). Segundo laço: <b>mostra</b> (saída). A lista é a ponte entre os dois.</p>' },
    { id: 'm7-10', lvl: 4, proj: true, t: 'Projeto: adivinhe o número', q: `<p>O número secreto é <b>7</b>. Repita perguntando palpites (inteiros) até a pessoa acertar. Para cada palpite mostre <code>Muito baixo</code> ou <code>Muito alto</code>; ao acertar, mostre <code>Acertou! Tentativas: 3</code> (quantidade de palpites).</p>`, plan: ['Variáveis: <code>secreto = 7</code> e <code>tentativas = 0</code>.', 'Laço que repete até acertar (<code>while True</code> + <code>break</code>).', 'A cada volta: ler, contar, comparar (<code>if / elif / else</code>).'], h: ['<code>while True:</code>; some 1 em <code>tentativas</code> a cada palpite.', 'No <code>else</code> (acertou): mostre a mensagem e use <code>break</code>.'], s: 'secreto = 7\ntentativas = 0\nwhile True:\n    palpite = int(input("Palpite: "))\n    tentativas = tentativas + 1\n    if palpite < secreto:\n        print("Muito baixo")\n    elif palpite > secreto:\n        print("Muito alto")\n    else:\n        print(f"Acertou! Tentativas: {tentativas}")\n        break', tests: [{ i: ['3', '9', '7'] }, { i: ['7'] }, { i: ['1', '2', '8', '6', '7'] }], x: '<p>O <code>while True</code> só para com o <code>break</code>, que fica no caminho do acerto. O contador cresce a cada palpite, certo ou errado.</p>' },
    { id: 'm7-b1', lvl: 2, bug: true, k: 'mc', t: 'O laço que nunca acaba', q: '<p>Este programa deveria mostrar 1, 2, 3 e parar, mas fica rodando. Por quê?</p>', code: 'contador = 1\nwhile contador <= 3:\n    print(contador)', norun: true, o: ['A variável <code>contador</code> <b>nunca é atualizada</b>: a condição fica sempre verdadeira', 'O <code>print</code> está errado', 'Falta o <code>else</code>', 'O 3 deveria ser texto'], a: 0, h: ['O que faz a condição deixar de ser verdadeira?'], x: '<p>Falta <code>contador = contador + 1</code> dentro do laço. Sem isso, o contador fica em 1 para sempre. (Não rodamos este código aqui: ele imprimiria 1 sem parar!)</p>', fix: 'contador = 1\nwhile contador <= 3:\n    print(contador)\n    contador = contador + 1' },
    { id: 'm7-b2', lvl: 2, bug: true, k: 'mc', t: 'O 5 que não apareceu', q: '<p>Queremos mostrar de 1 a 5, mas o 5 não aparece. Por quê?</p>', code: '# Quero mostrar os números de 1 a 5\nfor i in range(1, 5):\n    print(i)', o: ['O <code>print</code> está fora do laço', 'O <b>fim do range não entra</b>: para incluir o 5, use <code>range(1, 6)</code>', '<code>i</code> deveria começar em zero', 'Falta o <code>while</code>'], a: 1, h: ['Lembre da tabela do range.'], x: '<p>O segundo número do <code>range</code> é o limite <b>exclusivo</b>. <code>range(1, 5)</code> vai de 1 a 4. Sem erro, mas com resposta errada.</p>', fix: '# Quero mostrar os números de 1 a 5\nfor i in range(1, 6):\n    print(i)' },
    { id: 'm7-b3', lvl: 2, bug: true, k: 'mc', t: 'Posição que não existe', q: '<p>O que acontece ao rodar?</p>', code: 'frutas = ["maçã", "banana", "uva"]\nprint(frutas[3])', o: ['Mostra uva', 'Mostra None', '<i>IndexError</i>: a lista só tem posições 0, 1 e 2', 'Mostra banana'], a: 2, h: ['A contagem das posições começa em zero.'], x: '<p>Com 3 itens, as posições válidas são 0, 1 e 2. O último item é <code>frutas[2]</code> ou <code>frutas[-1]</code>.</p>', fix: 'frutas = ["maçã", "banana", "uva"]\nprint(frutas[2])' },
    { id: 'm7-b4', lvl: 2, bug: true, k: 'mc', t: 'For sem dois-pontos', q: '<p>Qual é o problema?</p>', code: 'for i in range(3)\n    print(i)', o: ['Falta o <b>dois-pontos</b> no fim da linha do <code>for</code>', 'O range está errado', 'Falta o recuo do print', 'Falta o <code>while</code>'], a: 0, h: ['Cabeçalhos de bloco terminam com…'], x: '<p>Assim como <code>if</code> e <code>def</code>, o <code>for</code> exige <code>:</code> no fim da linha.</p>', fix: 'for i in range(3):\n    print(i)' },
    { id: 'm7-11', lvl: 3, k: 'pr', t: 'Duas etiquetas, uma caixa só', q: '<p>O que vai aparecer na tela?</p>', code: 'lista_a = [1, 2, 3]\nlista_b = lista_a\nlista_b.append(4)\nprint(lista_a)', h: ['<code>lista_b = lista_a</code> <b>não</b> cria uma lista nova — as duas etiquetas passam a apontar para a <b>mesma</b> caixa.', 'Então mexer em <code>lista_b</code> também aparece em <code>lista_a</code>.'], x: '<p>Diferente de números e textos, listas são <b>compartilhadas</b> quando você faz <code>lista_b = lista_a</code>: não existem duas listas, existe uma só com dois nomes. Por isso <code>lista_a</code> também ganha o 4. Para ter uma cópia de verdade, independente, use <code>lista_b = lista_a.copy()</code>.</p>' },
    { id: 'm7-12', lvl: 4, k: 'pr', t: 'Desafio: a lista que "resistiu" à limpeza', q: '<p>A intenção era remover <b>todos</b> os números pares da lista. O que realmente aparece no final?</p>', code: 'numeros = [2, 4, 6, 8]\nfor n in numeros:\n    if n % 2 == 0:\n        numeros.remove(n)\nprint(numeros)', h: ['Tente simular à mão, posição por posição: toda vez que você remove um item, os itens seguintes “andam” uma posição para trás — mas o <code>for</code> já vai para a <b>próxima</b> posição, não repete a atual.', 'Depois de remover o primeiro 2 (posição 0), quem passa a ocupar a posição 1? É essa posição que o <code>for</code> visita a seguir — o item que estava lá antes é pulado.'], x: '<p>Este é um dos bugs mais traiçoeiros de listas: <b>nunca remova itens de uma lista enquanto percorre ela com <code>for</code></b>. Cada remoção desloca os itens seguintes uma posição para trás, mas o laço continua contando posições como se nada tivesse mudado — então ele "pula" itens sem querer. O resultado não é uma lista vazia, é <code>[4, 8]</code>: o 4 e o 8 escapam da varredura. A forma segura é construir uma <b>lista nova</b> só com o que você quer manter, percorrendo a lista original e dando <code>append</code> numa lista vazia à parte.</p>' },
    { id: 'm7-13', lvl: 3, k: 'pr', t: 'A contagem regressiva que não conta nada', q: '<p>O plano era mostrar de 10 até 1. O que realmente aparece na tela?</p>', code: 'for i in range(10, 0):\n    print(i)', h: ['Por padrão, <code>range(a, b)</code> anda <b>para cima</b>, de 1 em 1 — ele nunca sai sozinho contando para baixo.', 'Se o início (10) já é maior que o fim (0) e o passo é <code>+1</code>, o Python nunca encontra um número que satisfaça a condição. A lista de números gerada fica vazia.'], x: '<p>Nada aparece: a tela fica em branco. <code>range(10, 0)</code> tenta ir de 10 até 0 andando <code>+1</code> por vez — como isso nunca "chega" em lugar nenhum, o <code>range</code> simplesmente não gera nenhum número, e o <code>for</code> roda zero vezes (sem erro nenhum, o que torna esse bug mais difícil de perceber). Para contar para baixo é preciso avisar o passo negativo: <code>range(10, 0, -1)</code>.</p>' },
    { id: 'm7-b5', lvl: 3, bug: true, k: 'mc', t: 'Índice ou valor?', q: '<p>Este código deveria mostrar cada fruta da lista, mas dá erro já na primeira volta. Por quê?</p>', code: 'frutas = ["maçã", "banana", "uva"]\nfor fruta in frutas:\n    print(frutas[fruta])', o: ['<code>frutas</code> deveria se chamar <code>lista</code>', '<code>fruta</code> já <b>é</b> o próprio item da lista (um texto) — usar <code>frutas[fruta]</code> tenta indexar com um texto em vez de um número', 'Falta <code>len(frutas)</code> na primeira linha', 'O <code>for</code> não funciona com listas de texto'], a: 1, h: ['Quando você escreve <code>for fruta in frutas:</code>, o que a variável <code>fruta</code> recebe a cada volta: a <b>posição</b> ou o <b>valor</b> que está naquela posição?'], x: '<p><i>TypeError: list indices must be integers or slices, not str</i>. É um dos enganos mais comuns de quem está começando: <code>for item in lista:</code> já entrega o <b>valor</b> de cada item, não a posição dele. Não existe necessidade (nem sentido) de usar <code>lista[item]</code> depois. O código correto é simplesmente <code>print(fruta)</code>. Se um dia você precisar da <b>posição</b> junto com o valor, o jeito é percorrer os índices com <code>for i in range(len(frutas)):</code> e usar <code>frutas[i]</code>.</p>', fix: 'frutas = ["maçã", "banana", "uva"]\nfor fruta in frutas:\n    print(fruta)' },
  ],
  quiz: [
    { q: 'O que <code>range(1, 4)</code> gera?', o: ['1, 2, 3, 4', '1, 2, 3', '0, 1, 2, 3', '2, 3, 4'], a: 1, x: 'Começa no primeiro número e para <b>antes</b> do segundo.' },
    { q: 'Qual o índice do <b>primeiro</b> item de uma lista?', o: ['1', '0', '-1', 'Depende'], a: 1, x: 'Listas começam em 0, como o térreo de um prédio.' },
    { q: 'Como acrescentar um item ao final de uma lista?', o: ['<code>lista.add("x")</code>', '<code>lista.append("x")</code>', '<code>lista + "x"</code>', '<code>lista.push("x")</code>'], a: 1, x: 'O método é <code>append</code>.' },
    { q: 'Qual comando interrompe um laço imediatamente?', o: ['<code>stop</code>', '<code>exit</code>', '<code>break</code>', '<code>end</code>'], a: 2, x: '<code>break</code> sai do laço na hora.' },
    { q: 'Por que um <code>while</code> pode virar um laço infinito?', o: ['Porque usa muita memória', 'Porque a condição nunca deixa de ser verdadeira', 'Porque não tem for', 'Porque tem recuo'], a: 1, x: 'Se nada dentro do laço altera a condição, ela nunca fica falsa.' },
  ],
});;

MODS.push({
  id: 'm8', icon: '🗂️', title: 'Dicionários', sub: 'Pares chave → valor',
  lead: 'Listas guardam itens por <b>posição</b>. Dicionários guardam por <b>nome</b>: cada valor tem uma etiqueta (a chave), como os campos de uma ficha de cadastro. É a estrutura mais usada para representar “coisas” reais: alunos, produtos, contatos.',
  blocks: [
    H2('Por que dicionários existem?'),

      lines: [[1, 'Uma lista com nome, idade e cidade… mas quem garante essa ordem?'], [2, 'Mostra 20. Só sabemos que é a idade porque lembramos que a posição 1 é a idade.']],
      why: 'Se alguém trocar a ordem, ou se a lista tiver 30 campos, ninguém mais entende. Seria bem melhor pedir “a idade” pelo nome, não por um número.',
    }),
    TIP('Analogia: a ficha de cadastro e a agenda', ['Uma <b>agenda de telefones</b> não é organizada por “posição 17”, e sim por <b>nome</b>: você procura “Ana” e encontra o telefone.', 'Um dicionário funciona igual: você procura pela <b>chave</b> e recebe o <b>valor</b>. Cada linha é um par <b>chave → valor</b>.']),
    W('dicio'),
    H2('Criando e lendo um dicionário'),
    CODE('Chaves e valores ficam entre <b>chaves { }</b>, com <code>:</code> entre eles e vírgula entre os pares:', 'aluno = {"nome": "Maria", "idade": 20, "curso": "Python"}\nprint(aluno["nome"])\nprint(aluno["idade"])\nprint(len(aluno))\nprint(aluno)', {
      lines: [[1, 'Cria o dicionário com 3 pares. Cada chave (<code>"nome"</code>, <code>"idade"</code>…) é a etiqueta e o que vem depois do <code>:</code> é o valor.'], [2, '<code>aluno["nome"]</code> — abre o dicionário pela chave <code>"nome"</code> e devolve <b>Maria</b>.'], [3, 'Pede a chave <code>"idade"</code>: <b>20</b>.'], [4, '<code>len()</code> conta os <b>pares</b>: 3.'], [5, 'Mostra o dicionário inteiro no formato do Python: <code>{\'nome\': \'Maria\', …}</code>.']],
      why: 'Repare que a chave vai <b>entre aspas</b> (é um texto). Sem aspas, o Python acharia que é o nome de uma variável.',
      wi: [['Pedir <code>aluno["email"]</code>', 'Erro <i>KeyError: \'email\'</i>: essa chave não existe no dicionário.'], ['Pedir <code>aluno["Nome"]</code> (N maiúsculo)', 'Também <i>KeyError</i>: maiúsculas contam.'], ['Escrever <code>aluno[nome]</code> sem aspas', 'Erro <i>NameError</i>: o Python procura uma variável chamada <code>nome</code>.']],
    }),
    H2('Alterando, adicionando e removendo'),
    CODE('A mesma sintaxe de leitura serve para <b>escrever</b>:', 'aluno = {"nome": "Maria", "idade": 20}\naluno["idade"] = 21\naluno["cidade"] = "Recife"\ndel aluno["nome"]\nprint(aluno)', {
      lines: [[1, 'Começa com dois pares.'], [2, 'A chave <code>"idade"</code> <b>já existe</b>: o valor é trocado (20 vira 21).'], [3, 'A chave <code>"cidade"</code> <b>não existe</b>: um novo par é criado.'], [4, '<code>del</code> (de “delete”) apaga o par da chave <code>"nome"</code>.'], [5, 'Mostra <code>{\'idade\': 21, \'cidade\': \'Recife\'}</code>.']],
      why: 'Uma única forma de escrever, <code>dicionario[chave] = valor</code>, faz duas coisas: atualiza se a chave existir e cria se não existir.',
    }),
    H2('Perguntando antes de pegar: in e get'),
    CODE('Para evitar o <i>KeyError</i>, você pode <b>perguntar</b> se a chave existe:', 'aluno = {"nome": "Maria", "idade": 20}\nprint("nome" in aluno)\nprint("email" in aluno)\nprint(aluno.get("email"))\nprint(aluno.get("email", "não informado"))', {
      lines: [[2, '<code>in</code> pergunta: “esta <b>chave</b> existe?” → True.'], [3, 'Não existe → False.'], [4, '<code>.get(chave)</code> devolve o valor, ou <code>None</code> (“nada”) se a chave não existir — <b>sem dar erro</b>.'], [5, 'O segundo argumento do <code>.get</code> é o <b>valor padrão</b>: devolvido quando a chave não existe.']],
      why: 'Use <code>dicionario[chave]</code> quando tem certeza de que a chave existe, e <code>.get()</code> quando ela pode não existir.',
    }),
    WARN('O in olha as chaves, não os valores', '<code>"Maria" in aluno</code> dá <code>False</code>, porque “Maria” é um <b>valor</b>. Só <code>"nome" in aluno</code> dá True.'),
    H2('Percorrendo um dicionário'),
    CODE('Com <code>for</code>, dá para visitar chaves, valores ou os dois ao mesmo tempo:', 'precos = {"arroz": 5.5, "feijão": 8.0, "café": 12.0}\nfor produto in precos:\n    print(produto)\nfor produto, preco in precos.items():\n    print(f"{produto}: R$ {preco:.2f}")\nprint(list(precos.keys()))\nprint(sum(precos.values()))', {
      lines: [[1, 'Um dicionário de preços.'], [[2, 3], 'Sozinho, o <code>for</code> percorre as <b>chaves</b>: arroz, feijão, café.'], [[4, 5], '<code>.items()</code> entrega cada par de uma vez. Por isso o <code>for</code> tem <b>duas variáveis</b>: <code>produto</code> (a chave) e <code>preco</code> (o valor).'], [6, '<code>.keys()</code> devolve todas as chaves; <code>list()</code> as transforma em lista.'], [7, '<code>.values()</code> devolve todos os valores; <code>sum()</code> soma: 25.5.']],
      why: 'Guarde estes três: <code>.keys()</code> (chaves), <code>.values()</code> (valores) e <code>.items()</code> (pares). O <code>.items()</code> é o mais usado.',
      wi: [['Trocar <code>.items()</code> por nada: <code>for produto, preco in precos:</code>', 'Erro <i>too many values to unpack</i>: sem <code>.items()</code> cada volta entrega só a chave.']],
    }),
    TBL(['Operação', 'Como escrever', 'O que faz'], [
      ['Criar', '<code>d = {"a": 1, "b": 2}</code>', 'cria com dois pares'],
      ['Criar vazio', '<code>d = {}</code>', 'dicionário sem nenhum par'],
      ['Ler', '<code>d["a"]</code>', 'valor da chave (KeyError se não existir)'],
      ['Ler com segurança', '<code>d.get("a", 0)</code>', 'valor ou o padrão informado'],
      ['Guardar', '<code>d["c"] = 3</code>', 'atualiza ou cria'],

      ['Existe?', '<code>"a" in d</code>', 'True ou False'],
      ['Tamanho', '<code>len(d)</code>', 'número de pares'],
    ]),
    H2('Um padrão poderoso: contar coisas'),
    CODE('Quantas vezes cada letra aparece? O dicionário guarda a contagem de cada uma:', 'frase = "banana"\ncontagem = {}\nfor letra in frase:\n    contagem[letra] = contagem.get(letra, 0) + 1\nprint(contagem)', {
      lines: [[2, 'Começa com um dicionário <b>vazio</b>.'], [3, 'Para cada letra da palavra…'], [4, '…pega a contagem atual (ou 0, se a letra ainda não apareceu), soma 1 e guarda de volta.'], [5, 'Resultado: <code>{\'b\': 1, \'a\': 3, \'n\': 2}</code>.']],
      why: 'O <code>.get(letra, 0)</code> resolve o problema da primeira vez: sem ele, a primeira letra causaria <i>KeyError</i>, pois ainda não tem contagem.',

    H2('Dicionários dentro de listas: um cadastro'),
    CODE('Combinando as duas estruturas você representa uma tabela inteira:', 'alunos = [\n    {"nome": "Ana", "nota": 8.5},\n    {"nome": "Bruno", "nota": 6.0},\n]\nfor aluno in alunos:\n    print(f"{aluno[\'nome\']} tirou {aluno[\'nota\']}")', {
      lines: [[[1, 4], 'Uma <b>lista</b> onde cada item é um <b>dicionário</b> (uma ficha de aluno). Dentro de colchetes ou chaves, o Python aceita quebrar a linha.'], [5, 'Para cada ficha da lista…'], [6, '…lê os campos pelo nome. Na f-string, usamos aspas <b>simples</b> por dentro, porque as duplas já fecham a f-string.']],
      why: 'Lista = “vários”; dicionário = “detalhes de cada um”. É assim que quase todos os sistemas guardam dados: lista de alunos, lista de produtos, lista de pedidos.',
    }),
    NOTE('Regras das chaves', ['Chaves são <b>únicas</b>: se repetir uma, a última vence.', 'Chaves costumam ser textos ou números. Listas não podem ser chaves.', 'Valores podem ser qualquer coisa: número, texto, lista… até outro dicionário.']),
  ],
  ex: [
    { id: 'm8-1', lvl: 1, t: 'Meu primeiro dicionário', q: '<p>Crie um dicionário <code>pessoa</code> com as chaves <code>"nome"</code> (valor <code>"Ana"</code>) e <code>"idade"</code> (valor <code>30</code>). Depois mostre o <b>nome</b> usando a chave.</p><p>A tela deve mostrar: <code>Ana</code></p>', h: ['Chaves <code>{ }</code>, pares <code>"chave": valor</code> separados por vírgula.', 'Para mostrar: <code>print(pessoa["nome"])</code>'], s: 'pessoa = {"nome": "Ana", "idade": 30}\nprint(pessoa["nome"])', sl: [[1, 'Cria o dicionário com dois pares.'], [2, 'Lê o valor da chave <code>"nome"</code> e mostra.']], x: '<p>O dicionário guarda dois pares. <code>pessoa["nome"]</code> abre a “gaveta” chamada nome e devolve <b>Ana</b>.</p>' },
    { id: 'm8-2', lvl: 1, k: 'pr', t: 'Lendo por chave', q: '<p>O que aparece na tela? (2 linhas)</p>', code: 'd = {"a": 1, "b": 2, "c": 3}\nprint(d["b"])\nprint(len(d))', h: ['Procure a chave <code>"b"</code>.', '<code>len</code> conta pares.'], x: '<p><code>d["b"]</code> devolve o valor da chave b: <b>2</b>. O dicionário tem 3 pares, então <code>len(d)</code> é <b>3</b>.</p>' },
    { id: 'm8-3', lvl: 1, k: 'mc', t: 'Qual acessa a cor?', q: '<p>Dado <code>carro = {"marca": "Fiat", "cor": "azul"}</code>, qual linha mostra <b>azul</b>?</p>', o: ['<code>print(carro["cor"])</code>', '<code>print(carro[cor])</code>', '<code>print(carro.cor)</code>', '<code>print(carro(cor))</code>'], a: 0, h: ['A chave é um texto, então precisa de aspas.'], x: '<p>A chave <code>"cor"</code> é texto e vai entre aspas dentro de colchetes. Sem aspas (<code>carro[cor]</code>) o Python procuraria uma variável chamada <code>cor</code>.</p>' },
    { id: 'm8-4', lvl: 2, t: 'Adicionando um par', q: '<p>O estoque começa com maçã e pera. <b>Adicione</b> a chave <code>"uva"</code> com o valor <code>7</code> e depois mostre o dicionário inteiro.</p><p>Resultado esperado: <code>{\'maçã\': 10, \'pera\': 4, \'uva\': 7}</code></p>', start: 'estoque = {"maçã": 10, "pera": 4}\n\n# adicione a chave "uva" com valor 7 aqui\n\nprint(estoque)', h: ['Como você guarda um valor numa chave? <code>dicionario[chave] = valor</code>.'], s: 'estoque = {"maçã": 10, "pera": 4}\n\nestoque["uva"] = 7\n\nprint(estoque)', sl: [[3, 'A chave <code>"uva"</code> não existe: um novo par é criado.'], [5, 'Mostra o dicionário completo.']], x: '<p>Atribuir a uma chave que ainda não existe cria o par. Novos pares entram no final, na ordem em que foram criados.</p>' },
    { id: 'm8-5', lvl: 2, k: 'pr', t: 'Trocando e criando', q: '<p>O que aparece na tela? (escreva o dicionário exatamente como o Python mostra: chaves com aspas simples)</p>', code: 'd = {"nome": "Ana"}\nd["nome"] = "Bia"\nd["idade"] = 20\nprint(d)', h: ['Linha 2: a chave já existe → troca. Linha 3: a chave é nova → cria.', 'O Python mostra textos com aspas simples: <code>{\'chave\': valor}</code>.'], x: '<p>“Ana” foi substituída por “Bia” e o par <code>idade</code> foi acrescentado no final: <code>{\'nome\': \'Bia\', \'idade\': 20}</code>.</p>' },
    { id: 'm8-6', lvl: 2, t: 'Capitais com get', q: '<p>Peça um país. Mostre a capital dele; se o país não estiver no dicionário, mostre <code>País não cadastrado</code>. Use <code>.get()</code>.</p>', start: 'capitais = {"Brasil": "Brasília", "Argentina": "Buenos Aires", "Chile": "Santiago"}\npais = input("País: ")\n\n# mostre a capital ou "País não cadastrado"\n', h: ['<code>capitais.get(pais)</code> devolve <code>None</code> se não existir. O segundo argumento é o valor padrão.'], s: 'capitais = {"Brasil": "Brasília", "Argentina": "Buenos Aires", "Chile": "Santiago"}\npais = input("País: ")\n\nprint(capitais.get(pais, "País não cadastrado"))', tests: [{ i: ['Brasil'] }, { i: ['Chile'] }, { i: ['Peru'] }], x: '<p>Com <code>capitais.get(pais, "País não cadastrado")</code>, o Python devolve a capital ou a mensagem padrão, sem dar <i>KeyError</i> e sem precisar de <code>if</code>.</p>' },
    { id: 'm8-7', lvl: 2, k: 'pr', t: 'in e get', q: '<p>O que aparece na tela? (4 linhas)</p>', code: 'd = {"x": 10}\nprint("x" in d)\nprint(10 in d)\nprint(d.get("y"))\nprint(d.get("y", 0))', h: ['O <code>in</code> olha só as <b>chaves</b>.', 'Sem valor padrão, <code>.get</code> devolve <code>None</code>.'], x: '<p><code>"x" in d</code> → <b>True</b>. <code>10 in d</code> → <b>False</b> (10 é valor, não chave). <code>d.get("y")</code> → <b>None</b>. <code>d.get("y", 0)</code> → <b>0</b>.</p>' },
    { id: 'm8-8', lvl: 3, t: 'Lista de preços', q: '<p>Percorra o dicionário e mostre cada produto e preço, um por linha, assim: <code>arroz: R$ 5.50</code> (duas casas decimais).</p>', start: 'precos = {"arroz": 5.5, "feijão": 8.0, "café": 12.0}\n', h: ['<code>for produto, preco in precos.items():</code>', 'f-string com <code>{preco:.2f}</code>.'], s: 'precos = {"arroz": 5.5, "feijão": 8.0, "café": 12.0}\nfor produto, preco in precos.items():\n    print(f"{produto}: R$ {preco:.2f}")', x: '<p><code>.items()</code> entrega pares; o <code>for</code> separa cada par em duas variáveis. A f-string monta a linha de cada produto.</p>' },
    { id: 'm8-9', lvl: 3, t: 'Total do estoque', q: '<p>O dicionário guarda o preço de cada produto. Mostre o <b>total</b> somando todos os valores: <code>Total: R$ 25.50</code>.</p>', start: 'precos = {"arroz": 5.5, "feijão": 8.0, "café": 12.0}\n', h: ['Duas opções: um acumulador com <code>for</code>, ou <code>sum(precos.values())</code>.'], s: 'precos = {"arroz": 5.5, "feijão": 8.0, "café": 12.0}\ntotal = sum(precos.values())\nprint(f"Total: R$ {total:.2f}")', x: '<p><code>.values()</code> devolve só os valores e <code>sum()</code> os soma. (Um <code>for</code> com acumulador também funciona.)</p>' },
    { id: 'm8-10', lvl: 3, t: 'Contando letras', q: '<p>Conte quantas vezes cada letra aparece em <code>"abacaxi"</code> e mostre o dicionário. Resultado esperado: <code>{\'a\': 3, \'b\': 1, \'c\': 1, \'x\': 1, \'i\': 1}</code></p>', start: 'palavra = "abacaxi"\n', h: ['Comece com <code>contagem = {}</code> e percorra as letras com <code>for</code>.', '<code>contagem[letra] = contagem.get(letra, 0) + 1</code>'], s: 'palavra = "abacaxi"\ncontagem = {}\nfor letra in palavra:\n    contagem[letra] = contagem.get(letra, 0) + 1\nprint(contagem)', x: '<p>Cada letra nova entra com 0 (graças ao <code>.get</code>) e ganha +1; se já existia, soma 1 à contagem atual.</p>' },
    { id: 'm8-11', lvl: 3, t: 'Placar de jogo', q: '<p>O placar guarda os pontos de cada jogador. Peça o <b>nome</b> e os <b>pontos ganhos</b> (inteiro) e some ao jogador. Se o jogador ainda não existe, ele entra com esses pontos. Mostre os pontos totais dele.</p><p>Ex.: Ana ganha 5 → mostra <code>15</code>.</p>', start: 'placar = {"Ana": 10, "Bruno": 7}\nnome = input("Jogador: ")\npontos = int(input("Pontos ganhos: "))\n', h: ['Duas situações: o jogador já está em <code>placar</code> (<code>in</code>) ou não.', 'Ou de uma vez só: <code>placar[nome] = placar.get(nome, 0) + pontos</code>.'], s: 'placar = {"Ana": 10, "Bruno": 7}\nnome = input("Jogador: ")\npontos = int(input("Pontos ganhos: "))\n\nplacar[nome] = placar.get(nome, 0) + pontos\nprint(placar[nome])', tests: [{ i: ['Ana', '5'] }, { i: ['Carla', '3'] }], x: '<p>O <code>.get(nome, 0)</code> devolve os pontos atuais ou 0 para jogadores novos; somamos e guardamos de volta na mesma chave.</p>' },
    { id: 'm8-12', lvl: 3, t: 'Média das notas', q: '<p>Calcule a média de todas as notas do dicionário e mostre <code>Média: 8.0</code>.</p>', start: 'notas = {"Ana": 8, "Bruno": 6, "Carla": 10}\n', h: ['Some os valores e divida pela quantidade de pares.', '<code>sum(notas.values()) / len(notas)</code>'], s: 'notas = {"Ana": 8, "Bruno": 6, "Carla": 10}\nmedia = sum(notas.values()) / len(notas)\nprint(f"Média: {media}")', x: '<p>(8 + 6 + 10) ÷ 3 = 8.0. <code>len(notas)</code> conta os pares (alunos).</p>' },
    { id: 'm8-13', lvl: 4, t: 'Desafio: quem tem a maior nota?', q: '<p>Descubra o aluno com a <b>maior nota</b> e mostre <code>Melhor aluno: Carla (10)</code>.</p>', start: 'notas = {"Ana": 8, "Bruno": 6, "Carla": 10}\n', h: ['Guarde o “campeão até agora” em duas variáveis (nome e nota) e atualize quando encontrar uma nota maior.', 'Comece com <code>maior = -1</code> e percorra com <code>for nome, nota in notas.items():</code>.'], s: 'notas = {"Ana": 8, "Bruno": 6, "Carla": 10}\nmelhor = ""\nmaior = -1\nfor nome, nota in notas.items():\n    if nota > maior:\n        maior = nota\n        melhor = nome\nprint(f"Melhor aluno: {melhor} ({maior})")', x: '<p>Padrão “busque o maior”: começamos com um valor menor que qualquer nota e atualizamos o campeão sempre que uma nota o supera. Guardamos também o nome, para mostrar no fim.</p>' },
    { id: 'm8-p1', lvl: 4, proj: true, t: 'Projeto 1 — Agenda de contatos', q: `<p>A agenda já tem a Ana. Peça um <b>nome</b>. Se ele estiver na agenda, mostre <code>Telefone de Ana: 9999-1111</code>. Se não estiver, peça o telefone, salve na agenda e mostre <code>Contato salvo!</code>. Nos dois casos, termine com <code>Total de contatos: N</code>.</p>`, plan: ['Como sei se o contato existe? (<code>in</code>)', 'Como cadastro um contato novo? (<code>agenda[nome] = telefone</code>)', 'Qual informação mostro no final? (<code>len(agenda)</code>)'], start: 'agenda = {"Ana": "9999-1111"}\nnome = input("Nome: ")\n', h: ['<code>if nome in agenda:</code> … <code>else:</code> …', 'No else: <code>telefone = input("Telefone: ")</code>, depois guarde na agenda.'], s: 'agenda = {"Ana": "9999-1111"}\nnome = input("Nome: ")\n\nif nome in agenda:\n    print(f"Telefone de {nome}: {agenda[nome]}")\nelse:\n    telefone = input("Telefone: ")\n    agenda[nome] = telefone\n    print("Contato salvo!")\n\nprint(f"Total de contatos: {len(agenda)}")', tests: [{ i: ['Ana'] }, { i: ['Bia', '8888-2222'] }], x: '<p>O <code>in</code> decide entre consultar e cadastrar. Depois do if/else, <code>len(agenda)</code> mostra quantos contatos existem — já contando o novo, se houver.</p>' },
    { id: 'm8-p2', lvl: 4, proj: true, t: 'Projeto 2 — Mercadinho com estoque', q: `<p>O estoque é um dicionário. Peça o <b>produto</b> e a <b>quantidade</b> (inteiro) a vender. Regras:</p><ul><li>Produto que não existe: <code>Produto não existe</code></li><li>Quantidade maior que o estoque: <code>Estoque insuficiente</code></li><li>Venda válida: diminua o estoque e mostre <code>Venda ok! Restam 7</code></li></ul>`, plan: ['Primeiro: o produto existe? (<code>in</code>)', 'Depois: tem quantidade suficiente? (<code>&gt;</code>)', 'Só então: atualizar o dicionário e mostrar.'], start: 'estoque = {"arroz": 10, "feijão": 5, "café": 0}\nproduto = input("Produto: ")\nquantidade = int(input("Quantidade: "))\n', h: ['Ordem dos testes: existe → quantidade suficiente → venda.', 'Venda: <code>estoque[produto] = estoque[produto] - quantidade</code>.'], s: 'estoque = {"arroz": 10, "feijão": 5, "café": 0}\nproduto = input("Produto: ")\nquantidade = int(input("Quantidade: "))\n\nif produto not in estoque:\n    print("Produto não existe")\nelif quantidade > estoque[produto]:\n    print("Estoque insuficiente")\nelse:\n    estoque[produto] = estoque[produto] - quantidade\n    print(f"Venda ok! Restam {estoque[produto]}")', tests: [{ i: ['arroz', '3'] }, { i: ['café', '1'] }, { i: ['suco', '1'] }, { i: ['feijão', '5'] }], x: '<p>A ordem dos testes importa: só depois de saber que o produto existe podemos ler <code>estoque[produto]</code> sem correr o risco de <i>KeyError</i>. O <code>not in</code> é o contrário do <code>in</code>.</p>' },
    { id: 'm8-p3', lvl: 4, proj: true, t: 'Projeto 3 — Ficha do aluno com funções', q: `<p>Cada aluno é um dicionário como <code>{"nome": "Ana", "notas": [8, 7, 9]}</code> (as notas ficam numa <b>lista</b> dentro do dicionário). Crie:</p><ul><li><code>media_aluno(aluno)</code> → devolve a média das notas</li><li><code>situacao_aluno(aluno)</code> → devolve <code>"Aprovado"</code> (média ≥ 7), <code>"Recuperação"</code> (≥ 5) ou <code>"Reprovado"</code></li></ul>`, plan: ['Como pego as notas? (<code>aluno["notas"]</code>)', 'Média = soma ÷ quantidade (<code>sum</code> e <code>len</code>).', '<code>situacao_aluno</code> pode chamar <code>media_aluno</code>.'], start: 'def media_aluno(aluno):\n    pass\n\ndef situacao_aluno(aluno):\n    pass\n', h: ['<code>notas = aluno["notas"]</code> e depois <code>sum(notas) / len(notas)</code>.', 'Em <code>situacao_aluno</code>: <code>media = media_aluno(aluno)</code> e um <code>if / elif / else</code> com <code>return</code>.'], s: 'def media_aluno(aluno):\n    notas = aluno["notas"]\n    return sum(notas) / len(notas)\n\ndef situacao_aluno(aluno):\n    media = media_aluno(aluno)\n    if media >= 7:\n        return "Aprovado"\n    elif media >= 5:\n        return "Recuperação"\n    else:\n        return "Reprovado"', tests: [{ c: 'print(media_aluno({"nome": "Ana", "notas": [8, 7, 9]}))' }, { c: 'print(media_aluno({"nome": "Bia", "notas": [4, 5, 6]}))' }, { c: 'print(situacao_aluno({"nome": "Ana", "notas": [8, 7, 9]}))' }, { c: 'print(situacao_aluno({"nome": "Bia", "notas": [4, 5, 6]}))' }, { c: 'print(situacao_aluno({"nome": "Caio", "notas": [2, 3, 4]}))' }], x: '<p>Juntamos tudo: dicionário (a ficha), lista (as notas dentro dela), funções e decisões. Funções recebem dicionários como qualquer outro valor.</p>' },
    { id: 'm8-b1', lvl: 2, bug: true, k: 'mc', t: 'A chave que não existe', q: '<p>O programa quebra na linha 2. Por quê?</p>', code: 'aluno = {"nome": "Ana"}\nprint(aluno["idade"])', o: ['A chave <code>"idade"</code> <b>não existe</b> no dicionário (KeyError)', 'Falta aspas em <code>aluno</code>', 'Dicionários só aceitam números', '<code>print</code> não lê dicionários'], a: 0, h: ['Quais chaves o dicionário tem?'], x: '<p>O dicionário só tem a chave <code>"nome"</code>. Pedir uma chave inexistente gera <i>KeyError: \'idade\'</i>. Soluções: cadastrar a chave, usar <code>.get("idade")</code> ou verificar com <code>in</code>.</p>', fix: 'aluno = {"nome": "Ana"}\nprint(aluno.get("idade", "não informada"))' },
    { id: 'm8-b2', lvl: 2, bug: true, k: 'mc', t: 'A chave sem aspas', q: '<p>Por que aparece <i>NameError</i>?</p>', code: 'carro = {"cor": "azul"}\nprint(carro[cor])', o: ['<code>cor</code> está <b>sem aspas</b>: o Python procura uma variável chamada cor', 'O dicionário está vazio', 'Falta um <code>return</code>', 'A chave deveria ser número'], a: 0, h: ['Chaves de texto precisam de…'], x: '<p>Sem aspas, <code>cor</code> vira o nome de uma variável — e ela não existe. Com aspas, <code>carro["cor"]</code>, é o texto usado como chave.</p>', fix: 'carro = {"cor": "azul"}\nprint(carro["cor"])' },
    { id: 'm8-b3', lvl: 2, bug: true, k: 'mc', t: 'A vírgula esquecida', q: '<p>O Python nem executa este código. Qual é o problema?</p>', code: 'aluno = {"nome": "Ana", "idade": 20 "cidade": "Recife"}\nprint(aluno)', o: ['Falta uma <b>vírgula</b> entre os pares (depois do 20)', 'Falta <code>return</code>', 'Dicionários não aceitam textos como valores', 'A chave <code>"cidade"</code> é reservada'], a: 0, h: ['O que separa um par do outro?'], x: '<p>Os pares são separados por vírgula. O Python até sugere: <i>Perhaps you forgot a comma?</i> (“talvez você esqueceu uma vírgula”).</p>', fix: 'aluno = {"nome": "Ana", "idade": 20, "cidade": "Recife"}\nprint(aluno)' },
    { id: 'm8-b4', lvl: 3, bug: true, k: 'mc', t: 'For sem items()', q: '<p>Ao percorrer o dicionário, aparece <i>too many values to unpack</i>. Por quê?</p>', code: 'precos = {"arroz": 5.5, "feijão": 8.0}\nfor produto, preco in precos:\n    print(produto, preco)', o: ['Sem <code>.items()</code>, cada volta entrega só a <b>chave</b> (um texto), que não dá para separar em duas variáveis', 'Falta o <code>else</code>', 'Os preços deveriam ser texto', 'O <code>for</code> não funciona com dicionários'], a: 0, h: ['Quem o <code>for</code> entrega quando percorre um dicionário sozinho?'], x: '<p>Sozinho, o <code>for</code> percorre as chaves. Para receber chave <b>e</b> valor juntos, use <code>.items()</code>.</p>', fix: 'precos = {"arroz": 5.5, "feijão": 8.0}\nfor produto, preco in precos.items():\n    print(produto, preco)' },
    { id: 'm8-b5', lvl: 3, bug: true, k: 'mc', t: 'Chave repetida', q: '<p>O dicionário tem 3 pares escritos, mas <code>len</code> mostra 2 e o arroz vale 7. Por quê?</p>', code: 'precos = {"arroz": 5, "feijão": 8, "arroz": 7}\nprint(precos["arroz"])\nprint(len(precos))', o: ['<code>len</code> conta só números', 'Chaves são <b>únicas</b>: a repetida sobrescreve a anterior', 'O feijão foi apagado', 'O Python ignora o último par'], a: 1, h: ['Pode existir duas “gavetas” com o mesmo rótulo?'], x: '<p>Em um dicionário cada chave aparece uma só vez. Ao repetir <code>"arroz"</code>, o valor 7 substitui o 5. Sem erro, só um resultado inesperado.</p>', fix: 'precos = {"arroz": 5, "feijão": 8, "arroz integral": 7}\nprint(precos["arroz"])\nprint(len(precos))' },
    { id: 'm8-b6', lvl: 3, bug: true, k: 'mc', t: 'Append em dicionário', q: '<p>O que há de errado?</p>', code: 'agenda = {}\nagenda.append("Ana")', o: ['Dicionários não têm <code>.append</code> (isso é de lista): guarde com <code>agenda[chave] = valor</code>', 'Falta o <code>del</code>', 'O dicionário precisa de pelo menos um par', 'O texto Ana precisa de f-string'], a: 0, h: ['Como se adiciona um par a um dicionário?'], x: '<p><i>AttributeError: \'dict\' object has no attribute \'append\'</i>. O <code>.append</code> pertence às listas. No dicionário, você atribui: <code>agenda["Ana"] = "9999-1111"</code>.</p>', fix: 'agenda = {}\nagenda["Ana"] = "9999-1111"\nprint(agenda)' },
  ],
  projTitle: '🎯 Projetos com dicionários', projSub: 'Sistemas de cadastro e estoque: exatamente o tipo de problema em que dicionários brilham.',
  quiz: [
    { q: 'Como ler o valor da chave <code>"nome"</code> do dicionário <code>aluno</code>?', o: ['<code>aluno.nome</code>', '<code>aluno["nome"]</code>', '<code>aluno(nome)</code>', '<code>aluno[0]</code>'], a: 1, x: 'Chave entre colchetes e entre aspas (se for texto): <code>aluno["nome"]</code>.' },
    { q: 'O que acontece com <code>d["z"]</code> se a chave <code>"z"</code> não existe?', o: ['Devolve None', 'Devolve 0', 'Erro <i>KeyError</i>', 'Cria a chave'], a: 2, x: 'Ler uma chave inexistente com colchetes gera KeyError. Já <code>d.get("z")</code> devolve None sem erro.' },
    { q: 'O que <code>"Maria" in aluno</code> verifica, sendo <code>aluno = {"nome": "Maria"}</code>?', o: ['Se “Maria” é um valor', 'Se “Maria” é uma <b>chave</b>', 'Se o dicionário tem texto', 'Se o dicionário está vazio'], a: 1, x: 'O <code>in</code> procura entre as chaves. Aqui a chave é <code>"nome"</code>, então o resultado é False.' },
    { q: 'Qual é o resultado de <code>{"a": 1}.get("b", 0)</code>?', o: ['None', '1', '0', 'KeyError'], a: 2, x: 'O segundo argumento do <code>.get</code> é o valor padrão devolvido quando a chave não existe.' },
    { q: 'Como percorrer chave e valor ao mesmo tempo?', o: ['<code>for k, v in d:</code>', '<code>for k, v in d.items():</code>', '<code>for k, v in d.keys():</code>', '<code>for k, v in d.values():</code>'], a: 1, x: '<code>.items()</code> entrega pares (chave, valor).' },
    { q: 'O que acontece se você escrever a mesma chave duas vezes no dicionário?', o: ['Dá erro', 'Os dois valores são guardados', 'A última substitui a anterior', 'A primeira vence'], a: 2, x: 'Chaves são únicas: repetir uma sobrescreve o valor anterior.' },
  ],
});;

MODS.push({
  id: 'm9', icon: '🧱', title: 'Estruturas de dados aninhadas', sub: 'Listas de dicionários, dicionários de listas',
  lead: 'Dados de verdade raramente são simples. Um catálogo de produtos, uma turma de alunos com suas notas, uma agenda com vários telefones por contato — tudo isso é uma <b>lista dentro de dicionário</b> ou um <b>dicionário dentro de lista</b>. Você já conhece listas e dicionários: agora vai combiná-los.',

      lines: [[1, '<code>try:</code> = “tente”. Tudo que está recuado abaixo é o código <b>arriscado</b>.'], [2, 'Se a pessoa digitar <code>abc</code>, o <code>int()</code> falha aqui, com <i>ValueError</i>.'], [3, 'Se houve erro na linha 2, o Python <b>pula</b> o resto do <code>try</code>: esta linha nem executa.'], [4, '<code>except ValueError:</code> = “se acontecer um ValueError, faça isto”. É a rede de proteção.'], [5, 'O que fazer quando o erro acontece: mostrar uma mensagem amigável.'], [6, 'Fora do try/except: roda sempre. O programa <b>não quebrou</b>.']],
