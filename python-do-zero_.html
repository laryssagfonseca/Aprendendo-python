MODS.push({
  id: 'm4', icon: '🔀', title: 'Condições', sub: 'if, elif, else, and, or',
  lead: 'Até agora seus programas faziam sempre a mesma coisa. Com condições, eles passam a <b>decidir</b>: se algo acontecer, faça isto; senão, faça aquilo. É aqui que a programação fica interessante.',
  blocks: [
    H2('Programas que decidem'),
    P('Você toma decisões o tempo todo, quase sem perceber. Um programa também pode:'),
    TIP('Analogia: guarda-chuva', ['<b>SE</b> estiver chovendo, levo o guarda-chuva.', '<b>SENÃO</b>, deixo em casa.', 'Repare que existe uma <b>pergunta</b> (“está chovendo?”) cuja resposta é sim ou não. No Python essa pergunta é uma <b>comparação</b> do módulo anterior, e a resposta é <code>True</code> ou <code>False</code>.']),
    STEPS(['O Python avalia a <b>condição</b> (a pergunta) e obtém <code>True</code> ou <code>False</code>.', 'Se for <code>True</code>, executa as linhas que estão <b>dentro</b> do <code>if</code>.', 'Se for <code>False</code>, <b>pula</b> essas linhas (e vai para o <code>else</code>, se existir).', 'Depois segue lendo o resto do programa normalmente.']),
    H2('if — “SE”'),
    CODE('O bloco dentro do <code>if</code> só roda quando a condição é verdadeira:', 'idade = 20\n\nif idade >= 18:\n    print("Maior de idade")\n\nprint("Fim do programa")', {
      lines: [[1, 'Guarda 20 na caixa <code>idade</code>.'], [3, '<code>if</code> = “se”. Depois vem a <b>condição</b> (<code>idade &gt;= 18</code>, que dá True) e o <b>dois-pontos</b> <code>:</code>, que anuncia “vem um bloco aí”.'], [4, 'Esta linha tem <b>4 espaços</b> de recuo: isso significa “pertenço ao if”. Só executa se a condição for True.'], [6, 'Sem recuo: está <b>fora</b> do if e roda sempre.']],
      why: 'O recuo (indentação) é o jeito do Python saber quais linhas pertencem ao <code>if</code>. Outras linguagens usam chaves; o Python usa espaços — e é por isso que o código dele é tão limpo.',
      wi: [['Trocar <code>idade = 20</code> por <code>15</code>', 'Só aparece “Fim do programa”: a condição deu False e o bloco foi pulado.'], ['Tirar os 4 espaços da linha 4', 'Erro: <i>IndentationError: expected an indented block</i> (faltou o recuo).'], ['Esquecer o <code>:</code> no fim da linha 3', 'Erro: <i>SyntaxError: expected \':\'</i>.']],
    }),
    WARN('Três detalhes que quebram tudo', ['1) O <b>dois-pontos</b> <code>:</code> no fim da linha do <code>if</code>.', '2) O <b>recuo de 4 espaços</b> nas linhas de dentro.', '3) Usar <code>==</code> (dois iguais) para comparar, nunca um só.']),
    H2('if / else — “SE… SENÃO…”'),
    CODE('Dois caminhos: um para quando a condição é True, outro para quando é False:', 'idade = int(input("Digite sua idade: "))\n\nif idade >= 18:\n    print("Maior de idade")\nelse:\n    print("Menor de idade")', {
      lines: [[1, 'Lê a idade e converte para inteiro (lembra que o <code>input</code> devolve texto?).'], [3, 'Pergunta: a idade é maior ou igual a 18?'], [4, 'Caminho do <b>SIM</b> (True).'], [5, '<code>else</code> = “senão”. <b>Não leva condição</b>: é o que sobra quando todas as anteriores deram False. Também termina com <code>:</code>.'], [6, 'Caminho do <b>NÃO</b> (False).']],
      why: 'Com <code>if/else</code>, <b>exatamente um</b> dos dois blocos roda — nunca os dois, nunca nenhum. É como uma bifurcação numa estrada.',
      wi: [['Digitar exatamente 18', 'Maior de idade: o <code>&gt;=</code> inclui o 18.'], ['Trocar <code>&gt;=</code> por <code>&gt;</code>', 'Agora quem tem 18 vira “menor”! Atenção aos limites.'], ['Escrever <code>else idade &lt; 18:</code>', 'Erro: o <code>else</code> não recebe condição.']],
    }),
    H2('if / elif / else — vários caminhos'),
    TIP('Analogia: fila do hospital', ['<b>SE</b> for emergência → atendimento imediato.', '<b>SENÃO, SE</b> for idoso → prioridade.', '<b>SENÃO</b> → fila normal.', 'O <code>elif</code> (de “else if”, “senão se”) permite encadear quantas perguntas você precisar.']),
    CODE('Classificando uma nota em três faixas:', 'nota = 6.5\n\nif nota >= 7:\n    print("Aprovado")\nelif nota >= 5:\n    print("Recuperação")\nelse:\n    print("Reprovado")', {
      lines: [[1, 'A nota do aluno.'], [3, '1ª pergunta: nota ≥ 7? Com 6.5 → False, então pula o bloco.'], [5, '2ª pergunta (<code>elif</code> = “senão, se”): nota ≥ 5? → <b>True</b>.'], [6, 'Executa este bloco: mostra “Recuperação”.'], [[7, 8], 'O <code>else</code> não é nem avaliado: o Python <b>para</b> no primeiro True.']],
      why: 'O Python testa de <b>cima para baixo</b> e para na primeira condição verdadeira. Por isso a ordem importa: começamos pela faixa mais alta (≥ 7) e depois as menores.',
      wi: [['Trocar a nota por <code>8</code>', 'Aprovado.'], ['Trocar a nota por <code>3</code>', 'Reprovado (nenhuma condição foi True, sobrou o else).'], ['Inverter: testar <code>nota &gt;= 5</code> antes de <code>nota &gt;= 7</code>', 'Quem tirou 8 cairia em “Recuperação”! O primeiro True vence.'], ['Remover o <code>else</code> e usar nota 3', 'Nada aparece: sem else, não há caminho para “nenhuma das anteriores”.']],
    }),
    W('decisao'),
    TBL(['Estrutura', 'Quando usar', 'Quantos blocos podem rodar?'], [
      ['<code>if</code>', 'Fazer algo só em um caso; senão, nada', '0 ou 1'],
      ['<code>if / else</code>', 'Duas opções (sim ou não)', 'Exatamente 1'],
      ['<code>if / elif / else</code>', 'Três ou mais opções excludentes', 'Exatamente 1 (com else)'],
    ]),
    H2('Comparando textos digitados'),
    CODE('Um verificador de senha — repare no <code>==</code> comparando texto:', 'senha = input("Digite a senha: ")\n\nif senha == "python123":\n    print("Acesso liberado!")\nelse:\n    print("Senha incorreta.")', {
      lines: [[1, 'Guarda o que a pessoa digitou (texto, e aqui texto é o que queremos).'], [3, '<code>==</code> pergunta: “o que foi digitado é <b>igual</b> a python123?”. Precisa ser idêntico, letra por letra.'], [4, 'Senha certa.'], [6, 'Qualquer outra coisa.']],
      why: 'Como a comparação é feita caractere a caractere, <code>Python123</code> (com P maiúsculo) é diferente de <code>python123</code>.',
      wi: [['Digitar <code>Python123</code>', 'Senha incorreta: maiúscula conta.'], ['Escrever <code>if senha = "python123":</code>', 'Erro: <i>invalid syntax. Maybe you meant \'==\'…</i>. Um igual só guarda; para comparar são dois.']],
    }),
    CODE('Para ignorar maiúsculas, transforme o texto em minúsculas com <code>.lower()</code>:', 'resposta = input("Você gosta de Python? (sim/nao) ")\n\nif resposta.lower() == "sim":\n    print("Que bom!")\nelse:\n    print("Vamos mudar isso!")', {
      lines: [[3, '<code>resposta.lower()</code> devolve a resposta toda em minúsculas: “SIM”, “Sim” e “sim” viram “sim”. Só depois comparamos.']],
      why: 'Pessoas digitam de jeitos diferentes. Normalizar a entrada (deixar tudo minúsculo) evita que uma resposta certa seja recusada por causa de uma letra maiúscula.',
    }),
    H2('and, or e not: combinando perguntas'),
    P('Às vezes uma pergunta só não basta. Podemos combinar várias:'),
    TIP('Analogia: a porta do show', ['<b>and</b> (E): para entrar, precisa ter ingresso <b>E</b> ser maior de idade. Se faltar um, não entra.', '<b>or</b> (OU): para ganhar desconto, basta ser estudante <b>OU</b> idoso. Um já resolve.', '<b>not</b> (NÃO): inverte a resposta. “Não tenho ingresso.”']),
    W('andor'),
    CODE('<code>and</code>: as <b>duas</b> condições precisam ser verdadeiras.', 'idade = 20\ntem_ingresso = True\n\nif idade >= 18 and tem_ingresso:\n    print("Pode entrar no show")\nelse:\n    print("Não pode entrar")', {
      lines: [[1, 'Idade 20.'], [2, 'Uma variável bool: a pessoa tem ingresso.'], [4, '<code>idade &gt;= 18</code> → True e <code>tem_ingresso</code> → True. True <b>and</b> True = True.'], [5, 'Roda este bloco.'], [7, 'Rodaria se pelo menos uma das condições fosse False.']],
      why: 'Com <code>and</code>, basta uma condição falsa para o conjunto ser falso.',
      wi: [['<code>idade = 16</code>', 'Não pode entrar (uma das condições virou False).'], ['<code>tem_ingresso = False</code>', 'Não pode entrar.'], ['Trocar <code>and</code> por <code>or</code>', 'Agora entra se tiver ingresso <b>ou</b> for maior — basta um.']],
    }),
    CODE('<code>or</code>: basta <b>uma</b> condição verdadeira.', 'dia = "sábado"\n\nif dia == "sábado" or dia == "domingo":\n    print("Fim de semana!")\nelse:\n    print("Dia útil")', {
      lines: [[3, 'Pergunta 1: dia é “sábado”? True. Como é <code>or</code>, o Python já sabe que o resultado é True.'], [4, 'Roda este bloco.'], [6, 'Só rodaria se <b>nenhuma</b> das duas fosse verdadeira.']],
      why: 'Repare que escrevemos <code>dia == ...</code> <b>duas vezes</b>. Cada lado do <code>or</code> (e do <code>and</code>) precisa ser uma pergunta completa.',
      wi: [['<code>dia = "domingo"</code>', 'Também é fim de semana.'], ['<code>dia = "segunda"</code>', 'Dia útil: as duas perguntas deram False.']],
    }),
    BUGB('A armadilha clássica do or', ['Quem pensa em português escreve: <code>dia == "sábado" or "domingo"</code> (“dia igual a sábado ou domingo”). Parece certo, mas <b>o Python não lê assim</b>.', 'Rode o exemplo abaixo com <code>dia = "segunda"</code>. Surpresa!']),
    CODE('Este código está <b>errado</b> de propósito. Rode e veja:', 'dia = "segunda"\n\nif dia == "sábado" or "domingo":\n    print("Fim de semana!")\nelse:\n    print("Dia útil")', {
      lines: [[3, 'O Python enxerga duas perguntas: (1) <code>dia == "sábado"</code> → False; (2) <code>"domingo"</code> sozinho. Um texto que não está vazio conta como “verdadeiro” para o <code>if</code>. Resultado: sempre True!']],
      why: 'Solução: cada lado do <code>or</code> precisa ser uma comparação completa: <code>dia == "sábado" or dia == "domingo"</code>.',
    }),
    CODE('Um intervalo (“entre 18 e 65 anos”) usa <code>and</code> com duas comparações:', 'idade = 30\n\nif idade >= 18 and idade <= 65:\n    print("Faixa de trabalho")\nelse:\n    print("Fora da faixa")\n\nif not idade >= 18:\n    print("Menor de idade")', {
      lines: [[3, 'As duas comparações completas, ligadas por <code>and</code>: 30 ≥ 18 e 30 ≤ 65 → True.'], [8, '<code>not</code> inverte: <code>idade &gt;= 18</code> é True, então <code>not</code> vira False e o bloco é pulado.']],
      why: 'O Python também aceita a forma matemática <code>18 &lt;= idade &lt;= 65</code>, mas usar <code>and</code> deixa a intenção mais explícita.',
    }),
    TBL(['A', 'B', '<code>A and B</code>', '<code>A or B</code>'], [
      ['True', 'True', 'True', 'True'], ['True', 'False', 'False', 'True'], ['False', 'True', 'False', 'True'], ['False', 'False', 'False', 'False'],
    ]),
    H2('if dentro de if'),
    CODE('Você pode colocar uma decisão dentro de outra (mais um nível de recuo):', 'idade = 20\ntem_documento = True\n\nif idade >= 18:\n    if tem_documento:\n        print("Entrada liberada")\n    else:\n        print("Traga um documento")\nelse:\n    print("Menor de idade")', {
      lines: [[4, 'Primeira pergunta: é maior de idade? True → entra no bloco.'], [5, 'Segunda pergunta, <b>dentro</b> do primeiro bloco (8 espaços de recuo no total): tem documento?'], [6, 'Só chega aqui se as duas perguntas deram True.'], [[7, 8], 'Maior de idade, mas sem documento.'], [[9, 10], 'Nem chegou a perguntar pelo documento: já é menor.']],
      why: 'Cada nível de recuo indica “dentro de quem” a linha está. Uma alternativa é usar <code>and</code>, mas o aninhamento permite mensagens diferentes para cada situação.',
    }),
    H2('Bônus útil: o operador in'),
    CODE('<code>in</code> pergunta: “isto está dentro daquilo?”', 'letra = "e"\n\nif letra in "aeiou":\n    print("É vogal")\nelse:\n    print("Não é vogal")', {
      lines: [[3, '“A letra está dentro do texto <code>aeiou</code>?” → True.']],
      why: 'Sem o <code>in</code>, teríamos que escrever <code>letra == "a" or letra == "e" or …</code> cinco vezes.',
    }),
    H2('Checklist para escrever um if'),
    STEPS(['Qual é a <b>pergunta</b>? (uma comparação: <code>&gt;=</code>, <code>==</code>…)', 'A linha termina com <b>dois-pontos</b> <code>:</code>?', 'As linhas de dentro têm <b>4 espaços</b> de recuo?', 'Usei <code>==</code> (dois iguais) para comparar e não <code>=</code>?', 'Se usei <code>elif</code>, testei da faixa mais específica para a mais geral?']),
  ],
  ex: [
    { id: 'm4-1', lvl: 1, k: 'pr', t: 'O if pulou?', q: '<p>O que vai aparecer na tela?</p>', code: 'idade = 20\nif idade >= 18:\n    print("Maior")\nprint("Fim")', h: ['20 é maior ou igual a 18? O que isso faz com o bloco do if?'], x: '<p>A condição é True, então o bloco roda e mostra <b>Maior</b>. A última linha está fora do if e roda sempre: <b>Fim</b>.</p>' },
    { id: 'm4-2', lvl: 1, t: 'Meu primeiro if', q: '<p>Crie <code>idade = 25</code>. Se a idade for maior ou igual a 18, mostre <code>Maior de idade</code>.</p>', h: ['<code>if idade &gt;= 18:</code> e o <code>print</code> com 4 espaços de recuo.'], s: 'idade = 25\nif idade >= 18:\n    print("Maior de idade")', sl: [[1, 'Cria a variável.'], [2, 'Pergunta se idade ≥ 18 (termina com <code>:</code>).'], [3, 'Bloco do if (recuo de 4 espaços).']], x: '<p>25 ≥ 18 é True, então o print do bloco roda.</p>' },
    { id: 'm4-3', lvl: 1, k: 'mc', t: 'Qual linha está correta?', q: '<p>Qual é a forma <b>correta</b> de começar um if?</p>', o: ['<code>if idade &gt;= 18</code>', '<code>if idade &gt;= 18:</code>', '<code>if (idade &gt;= 18)</code>', '<code>se idade &gt;= 18:</code>'], a: 1, h: ['Falta algo no fim da linha das outras opções.'], x: '<p>A palavra é <code>if</code> (não “se”) e a linha termina com <code>:</code>. A opção A não tem o dois-pontos; a C também não; a D usa palavra em português.</p>' },
    { id: 'm4-4', lvl: 2, t: 'Maior ou menor de idade', q: '<p>Pergunte a idade (inteiro). Mostre <code>Maior de idade</code> se for 18 ou mais; senão, <code>Menor de idade</code>.</p>', h: ['Use <code>if / else</code>.', 'Cuidado com o 18: deve ser <b>maior ou igual</b>.'], s: 'idade = int(input("Sua idade: "))\nif idade >= 18:\n    print("Maior de idade")\nelse:\n    print("Menor de idade")', sl: [[1, 'Lê e converte a idade.'], [2, 'Pergunta se é ≥ 18.'], [3, 'Se sim.'], [4, 'Senão…'], [5, '…mostra menor de idade.']], tests: [{ i: ['20'] }, { i: ['17'] }, { i: ['18'] }], x: '<p>Um <code>if/else</code> escolhe exatamente um caminho. O teste com 18 confere se você usou <code>&gt;=</code> em vez de <code>&gt;</code>.</p>' },
    { id: 'm4-5', lvl: 2, t: 'Positivo, negativo ou zero', q: '<p>Peça um número inteiro e mostre <code>Positivo</code>, <code>Negativo</code> ou <code>Zero</code>.</p>', h: ['Três caminhos: <code>if / elif / else</code>.'], s: 'n = int(input("Número: "))\nif n > 0:\n    print("Positivo")\nelif n < 0:\n    print("Negativo")\nelse:\n    print("Zero")', tests: [{ i: ['5'] }, { i: ['-3'] }, { i: ['0'] }], x: '<p>Primeiro testamos se é maior que zero, depois se é menor. O que sobrar só pode ser zero, então cabe ao <code>else</code>.</p>' },
    { id: 'm4-6', lvl: 2, t: 'Par ou ímpar', q: '<p>Peça um número inteiro e mostre <code>Par</code> ou <code>Ímpar</code>.</p>', h: ['Par: resto da divisão por 2 igual a zero.', '<code>if n % 2 == 0:</code>'], s: 'n = int(input("Número: "))\nif n % 2 == 0:\n    print("Par")\nelse:\n    print("Ímpar")', tests: [{ i: ['4'] }, { i: ['7'] }, { i: ['0'] }], x: '<p>Usamos o resto (<code>%</code>) como no módulo anterior, agora dentro de um <code>if</code> para decidir o que mostrar.</p>' },
    { id: 'm4-7', lvl: 2, t: 'Verificador de senha', q: '<p>Peça uma senha. Se for exatamente <code>python123</code>, mostre <code>Acesso liberado!</code>; senão, <code>Senha incorreta.</code></p>', h: ['Compare texto com <code>==</code> (dois iguais).'], s: 'senha = input("Senha: ")\nif senha == "python123":\n    print("Acesso liberado!")\nelse:\n    print("Senha incorreta.")', tests: [{ i: ['python123'] }, { i: ['errada'] }, { i: ['Python123'] }], x: '<p>A comparação com <code>==</code> é letra por letra, então <code>Python123</code> é rejeitada.</p>' },
    { id: 'm4-8', lvl: 3, t: 'Situação da nota', q: '<p>Peça uma nota (decimal). Mostre <code>Aprovado</code> se for ≥ 7, <code>Recuperação</code> se for ≥ 5 (e menor que 7), ou <code>Reprovado</code> caso contrário.</p>', h: ['<code>if / elif / else</code>.', 'Comece pela faixa mais alta: nota &gt;= 7.'], s: 'nota = float(input("Nota: "))\nif nota >= 7:\n    print("Aprovado")\nelif nota >= 5:\n    print("Recuperação")\nelse:\n    print("Reprovado")', tests: [{ i: ['8'] }, { i: ['7'] }, { i: ['6.5'] }, { i: ['5'] }, { i: ['4.9'] }], x: '<p>Como o Python para no primeiro True, o <code>elif nota &gt;= 5</code> só é testado quando a nota é menor que 7. Isso já garante “entre 5 e 7”.</p>' },
    { id: 'm4-9', lvl: 3, t: 'Semáforo', q: '<p>Peça a cor do semáforo (<code>verde</code>, <code>amarelo</code> ou <code>vermelho</code>). Mostre <code>Pode passar</code>, <code>Atenção</code> ou <code>Pare</code>. Para qualquer outra cor, mostre <code>Cor inválida</code>.</p>', h: ['Compare textos com <code>==</code>.', 'Use vários <code>elif</code> e um <code>else</code> final.'], s: 'cor = input("Cor do semáforo: ")\nif cor == "verde":\n    print("Pode passar")\nelif cor == "amarelo":\n    print("Atenção")\nelif cor == "vermelho":\n    print("Pare")\nelse:\n    print("Cor inválida")', tests: [{ i: ['verde'] }, { i: ['amarelo'] }, { i: ['vermelho'] }, { i: ['azul'] }], x: '<p>Um <code>elif</code> para cada cor válida. O <code>else</code> captura tudo o que não foi previsto — ótimo para tratar entradas inesperadas.</p>' },
    { id: 'm4-10', lvl: 3, t: 'Porta do show (and)', q: '<p>Peça a idade (inteiro) e se a pessoa tem ingresso (<code>s</code> ou <code>n</code>). Mostre <code>Entrada liberada</code> se for maior de idade <b>e</b> tiver ingresso; senão, <code>Entrada negada</code>.</p>', h: ['As duas condições precisam ser verdadeiras: <code>and</code>.', '<code>if idade &gt;= 18 and ingresso == "s":</code>'], s: 'idade = int(input("Idade: "))\ningresso = input("Tem ingresso? (s/n) ")\nif idade >= 18 and ingresso == "s":\n    print("Entrada liberada")\nelse:\n    print("Entrada negada")', tests: [{ i: ['20', 's'] }, { i: ['20', 'n'] }, { i: ['16', 's'] }], x: '<p>O <code>and</code> exige as duas condições. Falhando qualquer uma (idade ou ingresso), cai no <code>else</code>.</p>' },
    { id: 'm4-11', lvl: 3, t: 'Fim de semana (or)', q: '<p>Peça o dia da semana em minúsculas. Mostre <code>Fim de semana</code> se for <code>sábado</code> <b>ou</b> <code>domingo</code>; senão, <code>Dia útil</code>.</p>', h: ['Use <code>or</code> e lembre: cada lado é uma comparação completa.', '<code>dia == "sábado" or dia == "domingo"</code>'], s: 'dia = input("Dia da semana: ")\nif dia == "sábado" or dia == "domingo":\n    print("Fim de semana")\nelse:\n    print("Dia útil")', tests: [{ i: ['sábado'] }, { i: ['domingo'] }, { i: ['segunda'] }], x: '<p>Basta um dos dois lados ser verdadeiro. Escrevemos <code>dia ==</code> nos dois lados — a armadilha do <code>or "domingo"</code> foi evitada.</p>' },
    { id: 'm4-12', lvl: 3, t: 'Faixa etária', q: '<p>Peça a idade e mostre: <code>Criança</code> (até 11 anos), <code>Adolescente</code> (12 a 17), <code>Adulto</code> (18 a 59) ou <code>Idoso</code> (60 ou mais).</p>', h: ['Vá da menor faixa para a maior: <code>idade &lt; 12</code>, <code>idade &lt; 18</code>, <code>idade &lt; 60</code>.', 'Como o Python para no primeiro True, você não precisa do limite inferior em cada elif.'], s: 'idade = int(input("Idade: "))\nif idade < 12:\n    print("Criança")\nelif idade < 18:\n    print("Adolescente")\nelif idade < 60:\n    print("Adulto")\nelse:\n    print("Idoso")', tests: [{ i: ['5'] }, { i: ['12'] }, { i: ['17'] }, { i: ['18'] }, { i: ['59'] }, { i: ['60'] }], x: '<p>Cada <code>elif</code> só é testado se os anteriores deram False. Assim, <code>idade &lt; 18</code> já significa “entre 12 e 17”. Os testes de fronteira (12, 18, 60) verificam se você acertou os sinais.</p>' },
    { id: 'm4-13', lvl: 3, t: 'O maior de três', q: '<p>Peça três números inteiros e mostre o maior no formato <code>Maior: 9</code>.</p>', h: ['O primeiro é o maior se for ≥ que os outros dois: <code>a &gt;= b and a &gt;= c</code>.', 'Depois teste o segundo; o que sobrar é o terceiro.'], s: 'a = int(input("A: "))\nb = int(input("B: "))\nc = int(input("C: "))\nif a >= b and a >= c:\n    maior = a\nelif b >= a and b >= c:\n    maior = b\nelse:\n    maior = c\nprint(f"Maior: {maior}")', tests: [{ i: ['3', '9', '5'] }, { i: ['10', '2', '7'] }, { i: ['1', '2', '3'] }, { i: ['4', '4', '4'] }], x: '<p>Guardamos o vencedor em <code>maior</code> e só no final mostramos. O <code>and</code> compara um número contra os dois outros ao mesmo tempo.</p>' },
    { id: 'm4-14', lvl: 3, t: 'Login com dois dados', q: '<p>Peça <b>usuário</b> e <b>senha</b>. Se o usuário for <code>admin</code> <b>e</b> a senha <code>1234</code>, mostre <code>Bem-vindo!</code>. Se o usuário for <code>admin</code> mas a senha estiver errada, mostre <code>Senha incorreta</code>. Em qualquer outro caso, <code>Usuário não encontrado</code>.</p>', h: ['O caso mais específico (os dois certos) vem primeiro.', 'Depois: só o usuário certo. Por último, o <code>else</code>.'], s: 'usuario = input("Usuário: ")\nsenha = input("Senha: ")\nif usuario == "admin" and senha == "1234":\n    print("Bem-vindo!")\nelif usuario == "admin":\n    print("Senha incorreta")\nelse:\n    print("Usuário não encontrado")', tests: [{ i: ['admin', '1234'] }, { i: ['admin', '0000'] }, { i: ['root', '1234'] }], x: '<p>Ordem do mais específico ao mais geral. Se o <code>elif usuario == "admin"</code> vier antes do <code>and</code>, ninguém consegue logar!</p>' },
    { id: 'm4-15', lvl: 4, t: 'Desafio: ano bissexto', q: '<p>Um ano é <b>bissexto</b> se for divisível por 4 <b>e não</b> por 100 — <b>ou</b> se for divisível por 400. Peça um ano e mostre <code>Bissexto</code> ou <code>Não bissexto</code>.</p><p>Teste mentalmente: 2024 → bissexto; 1900 → não; 2000 → bissexto; 2023 → não.</p>', h: ['Um número é divisível por 4 quando <code>ano % 4 == 0</code>.', 'Use parênteses para agrupar: <code>(A and B) or C</code>.'], s: 'ano = int(input("Ano: "))\nif (ano % 4 == 0 and ano % 100 != 0) or ano % 400 == 0:\n    print("Bissexto")\nelse:\n    print("Não bissexto")', sl: [[2, 'Combina <code>and</code> e <code>or</code>: (divisível por 4 <b>e</b> não por 100) <b>ou</b> divisível por 400.']], tests: [{ i: ['2024'] }, { i: ['1900'] }, { i: ['2000'] }, { i: ['2023'] }], x: '<p>1900: divisível por 4 e por 100 → primeira parte False; não divisível por 400 → Não bissexto. 2000: divisível por 400 → a segunda parte salva. Os parênteses deixam clara a prioridade.</p>' },
    /* --- Projetos --- */
    { id: 'm4-p1', lvl: 4, proj: true, t: 'Projeto 1 — Calculadora', q: `<p>O usuário informa <b>dois números</b> (decimais) e escolhe a operação (<code>+</code>, <code>-</code>, <code>*</code> ou <code>/</code>). Mostre <code>Resultado: 14.0</code> (por exemplo, para 10 + 4).</p><ul><li>Divisão por zero: mostre <code>Não é possível dividir por zero</code>.</li><li>Operação diferente das quatro: <code>Operação inválida</code>.</li></ul>`, plan: ['Entradas: dois números (<code>float</code>) e a operação (texto).', 'Decisão: qual operação foi escolhida? (<code>if / elif</code>)', 'Caso especial: na divisão, o segundo número pode ser zero? (um <code>if</code> dentro do <code>elif</code>)', 'Saída: uma f-string com o resultado.'], h: ['Um <code>elif</code> por operação e um <code>else</code> para “inválida”.', 'Dentro do bloco da divisão, antes de dividir: <code>if n2 == 0:</code>.'], s: 'n1 = float(input("Primeiro número: "))\nn2 = float(input("Segundo número: "))\nop = input("Operação (+, -, *, /): ")\n\nif op == "+":\n    print(f"Resultado: {n1 + n2}")\nelif op == "-":\n    print(f"Resultado: {n1 - n2}")\nelif op == "*":\n    print(f"Resultado: {n1 * n2}")\nelif op == "/":\n    if n2 == 0:\n        print("Não é possível dividir por zero")\n    else:\n        print(f"Resultado: {n1 / n2}")\nelse:\n    print("Operação inválida")', tests: [{ i: ['10', '4', '+'] }, { i: ['10', '4', '-'] }, { i: ['10', '4', '*'] }, { i: ['10', '4', '/'] }, { i: ['10', '0', '/'] }, { i: ['10', '4', '%'] }], x: '<p>O <code>if/elif</code> escolhe a operação. Dentro da divisão há um segundo <code>if</code> (aninhado) que protege contra dividir por zero — exatamente o erro que você viu no módulo 3.</p>' },
    { id: 'm4-p2', lvl: 4, proj: true, t: 'Projeto 2 — Verificador de idade', q: `<p>Peça <b>nome</b> e <b>idade</b>. Se for maior de idade, mostre <code>Ana, você é maior de idade.</code>; senão, <code>Bruno, você é menor de idade. Faltam 3 anos para os 18.</code> (calculando quantos anos faltam).</p>`, plan: ['Entradas: nome (texto) e idade (inteiro).', 'Decisão: idade ≥ 18?', 'No caminho do “menor”, calcular <code>18 - idade</code>.'], h: ['Guarde <code>faltam = 18 - idade</code> dentro do <code>else</code>.'], s: 'nome = input("Nome: ")\nidade = int(input("Idade: "))\n\nif idade >= 18:\n    print(f"{nome}, você é maior de idade.")\nelse:\n    faltam = 18 - idade\n    print(f"{nome}, você é menor de idade. Faltam {faltam} anos para os 18.")', tests: [{ i: ['Ana', '20'] }, { i: ['Bruno', '15'] }, { i: ['Carla', '18'] }], x: '<p>Variáveis criadas dentro de um bloco (<code>faltam</code>) podem ser usadas nele. O cálculo só acontece quando é realmente necessário.</p>' },
    { id: 'm4-p3', lvl: 4, proj: true, t: 'Projeto 3 — Média do aluno', q: `<p>Peça <b>três notas</b> (decimais). Mostre a média com uma casa decimal e a situação:</p>${BOXPRE('Média: 8.0\nSituação: Aprovado')}<p>Média ≥ 7: Aprovado · ≥ 5: Recuperação · abaixo de 5: Reprovado.</p>`, plan: ['Entradas: 3 notas (<code>float</code>).', 'Cálculo: média = soma ÷ 3.', 'Decisão em três faixas (<code>if / elif / else</code>).', 'Saída: duas linhas.'], h: ['Mostre a média <b>antes</b> de decidir a situação.', 'Comece pela faixa mais alta (média &gt;= 7).'], s: 'n1 = float(input("Nota 1: "))\nn2 = float(input("Nota 2: "))\nn3 = float(input("Nota 3: "))\nmedia = (n1 + n2 + n3) / 3\nprint(f"Média: {media:.1f}")\n\nif media >= 7:\n    print("Situação: Aprovado")\nelif media >= 5:\n    print("Situação: Recuperação")\nelse:\n    print("Situação: Reprovado")', tests: [{ i: ['8', '7', '9'] }, { i: ['6', '5', '6'] }, { i: ['2', '3', '4'] }, { i: ['7', '7', '7'] }], x: '<p>Juntamos módulos 1 a 4: entrada, conversão, cálculo com parênteses, formatação e decisão. Note que a média é calculada uma vez e reaproveitada.</p>' },
    { id: 'm4-p4', lvl: 4, proj: true, t: 'Projeto 4 — Caixa eletrônico', q: `<p>O saldo inicial é <b>R$ 1000</b>. Peça a <b>operação</b> (<code>saque</code> ou <code>deposito</code>) e o <b>valor</b> (decimal). Regras:</p><ul><li>Valor menor ou igual a zero: <code>Valor inválido</code></li><li>Saque maior que o saldo: <code>Saldo insuficiente</code></li><li>Saque válido: <code>Saque realizado! Novo saldo: R$ 700.00</code></li><li>Depósito válido: <code>Depósito realizado! Novo saldo: R$ 1500.00</code></li><li>Outra operação: <code>Operação inválida</code></li></ul>`, plan: ['Comece definindo <code>saldo = 1000.0</code>.', 'Primeiro trate o valor inválido (≤ 0).', 'Depois: é saque ou depósito?', 'No saque, ainda há uma decisão: tem saldo suficiente? (if aninhado)'], h: ['Ordem: <code>if valor &lt;= 0</code> → <code>elif operacao == "saque"</code> → <code>elif operacao == "deposito"</code> → <code>else</code>.', 'Dentro do saque: <code>if valor &gt; saldo</code> / <code>else</code> (subtraia e mostre).'], s: 'saldo = 1000.0\noperacao = input("Operação (saque/deposito): ")\nvalor = float(input("Valor: "))\n\nif valor <= 0:\n    print("Valor inválido")\nelif operacao == "saque":\n    if valor > saldo:\n        print("Saldo insuficiente")\n    else:\n        saldo = saldo - valor\n        print(f"Saque realizado! Novo saldo: R$ {saldo:.2f}")\nelif operacao == "deposito":\n    saldo = saldo + valor\n    print(f"Depósito realizado! Novo saldo: R$ {saldo:.2f}")\nelse:\n    print("Operação inválida")', tests: [{ i: ['saque', '300'] }, { i: ['saque', '2000'] }, { i: ['deposito', '500'] }, { i: ['deposito', '-5'] }, { i: ['transferir', '10'] }], x: '<p>Validamos primeiro o que é inválido para todos (valor ≤ 0) e depois separamos por operação. O saque tem uma decisão extra (saldo suficiente?), por isso há um <code>if</code> dentro do <code>elif</code>.</p>' },
    { id: 'm4-p5', lvl: 4, proj: true, t: 'Projeto 5 — Sistema de desconto', q: `<p>Peça o <b>valor da compra</b>. O desconto depende do valor: a partir de <b>500</b> → 20%; de <b>200</b> → 10%; de <b>100</b> → 5%; abaixo de 100 → sem desconto. Mostre:</p>${BOXPRE('Desconto: R$ 25.00\nTotal a pagar: R$ 225.00')}<p>(exemplo para compra de 250)</p>`, plan: ['Entrada: valor da compra (<code>float</code>).', 'Decisão: qual percentual? (comece pelo maior valor)', 'Cálculo: desconto = compra × percentual ÷ 100.', 'Saída: desconto e total.'], h: ['Guarde o percentual numa variável (<code>pct</code>) dentro do <code>if/elif/else</code>.', 'Depois do if: <code>desconto = compra * pct / 100</code>.'], s: 'compra = float(input("Valor da compra: "))\n\nif compra >= 500:\n    pct = 20\nelif compra >= 200:\n    pct = 10\nelif compra >= 100:\n    pct = 5\nelse:\n    pct = 0\n\ndesconto = compra * pct / 100\ntotal = compra - desconto\nprint(f"Desconto: R$ {desconto:.2f}")\nprint(f"Total a pagar: R$ {total:.2f}")', tests: [{ i: ['500'] }, { i: ['250'] }, { i: ['120'] }, { i: ['50'] }], x: '<p>O <code>if/elif/else</code> só decide o <b>percentual</b>; o cálculo do desconto fica fora, escrito uma única vez. Separar “decidir” de “calcular” deixa o código curto e fácil de mudar.</p>' },
    /* --- Encontre o erro --- */
    { id: 'm4-b1', lvl: 2, bug: true, k: 'mc', t: 'O if que compara texto com número', q: '<p>O programa quebra quando a pessoa digita a idade. Qual é o problema?</p>', code: 'idade = input("Digite sua idade: ")\n\nif idade >= 18:\n    print("Maior de idade")', i: ['20'], o: ['Falta o <code>else</code>', '<code>input()</code> retorna <b>texto</b>: precisamos converter para número com <code>int()</code>', 'O <code>print</code> precisa de f-string', 'A condição deveria usar <code>==</code>'], a: 1, h: ['Compare o tipo de <code>idade</code> com o tipo de 18.'], x: '<p><code>input()</code> retorna texto, então precisamos converter para número: <code>idade = int(input("Digite sua idade: "))</code>. Sem isso, o Python não sabe comparar texto com número e dá <i>TypeError</i>.</p>', fix: 'idade = int(input("Digite sua idade: "))\n\nif idade >= 18:\n    print("Maior de idade")' },
    { id: 'm4-b2', lvl: 2, bug: true, k: 'mc', t: 'O if sem dois-pontos', q: '<p>O Python recusa este código. Por quê?</p>', code: 'nota = 8\nif nota >= 7\n    print("Aprovado")', o: ['Falta o <b>dois-pontos</b> <code>:</code> no fim da linha do <code>if</code>', 'A nota deveria ser texto', 'O print está com recuo demais', 'Falta um <code>else</code>'], a: 0, h: ['O que fecha a linha de um if?'], x: '<p>Toda linha com <code>if</code>, <code>elif</code>, <code>else</code>, <code>while</code>, <code>for</code> ou <code>def</code> termina com <code>:</code>. Sem ele: <i>SyntaxError: expected \':\'</i>.</p>', fix: 'nota = 8\nif nota >= 7:\n    print("Aprovado")' },
    { id: 'm4-b3', lvl: 2, bug: true, k: 'mc', t: 'O recuo que sumiu', q: '<p>Qual é o problema deste código?</p>', code: 'idade = 20\nif idade >= 18:\nprint("Maior de idade")', o: ['O <code>print</code> precisa ter <b>recuo</b> (4 espaços) para pertencer ao if', 'Falta o <code>else</code>', 'A idade deveria ser texto', 'O <code>if</code> não termina com dois-pontos'], a: 0, h: ['O que indica que uma linha está “dentro” do if?'], x: '<p>Depois do <code>if ...:</code> o Python exige um bloco recuado: <i>IndentationError: expected an indented block after \'if\' statement</i>.</p>', fix: 'idade = 20\nif idade >= 18:\n    print("Maior de idade")' },
    { id: 'm4-b4', lvl: 2, bug: true, k: 'mc', t: 'Um igual só', q: '<p>Este código não roda. Qual é o problema?</p>', code: 'senha = input("Senha: ")\nif senha = "1234":\n    print("Acesso liberado")', i: ['1234'], o: ['Em <code>if</code>, comparar exige <code>==</code> (dois iguais); um <code>=</code> só guarda valor', 'Faltam aspas em <code>senha</code>', 'O <code>input</code> está errado', 'O texto "1234" deveria ser número'], a: 0, h: ['Qual operador pergunta “é igual?”'], x: '<p>Um <code>=</code> é para guardar valores. Para comparar, usamos <code>==</code>. O Python até avisa: <i>Maybe you meant \'==\' or \':=\' instead of \'=\'?</i>.</p>', fix: 'senha = input("Senha: ")\nif senha == "1234":\n    print("Acesso liberado")' },
    { id: 'm4-b5', lvl: 3, bug: true, k: 'mc', t: 'O or que sempre diz sim', q: '<p>Em uma segunda-feira o programa diz “Fim de semana!”. Por quê?</p>', code: 'dia = "segunda"\nif dia == "sábado" or "domingo":\n    print("Fim de semana!")\nelse:\n    print("Dia útil")', o: ['<code>"domingo"</code> sozinho é um texto não vazio, que vale como <b>True</b>: falta comparar com <code>dia ==</code>', 'O <code>or</code> deveria ser <code>and</code> ', 'Faltou converter <code>dia</code> com <code>int()</code>', 'O <code>else</code> está errado'], a: 0, h: ['Cada lado do <code>or</code> precisa ser uma pergunta completa.'], x: '<p>O Python lê como <code>(dia == "sábado") or ("domingo")</code>. O segundo lado é apenas um texto, considerado verdadeiro. Por isso o <code>if</code> sempre entra. O correto: <code>dia == "sábado" or dia == "domingo"</code>.</p>', fix: 'dia = "segunda"\nif dia == "sábado" or dia == "domingo":\n    print("Fim de semana!")\nelse:\n    print("Dia útil")' },
    { id: 'm4-b6', lvl: 3, bug: true, k: 'mc', t: 'Elif na ordem errada', q: '<p>Uma nota 9 deveria dar “Aprovado”, mas mostra “Recuperação”. Por quê?</p>', code: 'nota = 9\nif nota >= 5:\n    print("Recuperação")\nelif nota >= 7:\n    print("Aprovado")\nelse:\n    print("Reprovado")', o: ['Falta um <code>else</code>', 'O Python para no <b>primeiro True</b>: 9 ≥ 5 já é verdadeiro, então o teste ≥ 7 nunca é feito', 'A nota deveria ser texto', 'O <code>elif</code> deveria ser <code>if</code>'], a: 1, h: ['Quais condições são verdadeiras para 9? Qual vem primeiro?'], x: '<p>Testes com <code>elif</code> vão de cima para baixo e param no primeiro verdadeiro. Como 9 ≥ 5, entra no primeiro bloco. Comece sempre pela condição <b>mais restrita</b> (≥ 7).</p>', fix: 'nota = 9\nif nota >= 7:\n    print("Aprovado")\nelif nota >= 5:\n    print("Recuperação")\nelse:\n    print("Reprovado")' },
    { id: 'm4-b7', lvl: 3, bug: true, k: 'mc', t: 'Else com condição', q: '<p>O que há de errado?</p>', code: 'idade = 15\nif idade >= 18:\n    print("Maior")\nelse idade < 18:\n    print("Menor")', o: ['O <code>else</code> <b>não recebe condição</b>: é só <code>else:</code>', 'O <code>print</code> precisa de f-string', 'O <code>if</code> deveria ser <code>elif</code>', 'A idade deveria ser texto'], a: 0, h: ['O else é “senão”: ele pega tudo o que sobrou.'], x: '<p>O <code>else</code> executa quando nenhuma condição anterior foi verdadeira, por isso não tem pergunta própria. Se quiser uma condição, use <code>elif</code>.</p>', fix: 'idade = 15\nif idade >= 18:\n    print("Maior")\nelse:\n    print("Menor")' },
    { id: 'm4-b8', lvl: 3, bug: true, k: 'mc', t: 'and com meia pergunta', q: '<p>Este código quebra. Qual é o problema?</p>', code: 'idade = 30\nif idade >= 18 and <= 65:\n    print("Faixa de trabalho")', o: ['Faltou o <code>else</code>', 'Depois do <code>and</code> precisa vir uma comparação <b>completa</b>: <code>idade &lt;= 65</code>', '<code>and</code> deveria ser <code>or</code>', 'O 65 precisa de aspas'], a: 1, h: ['Em português dizemos “maior que 18 e menor que 65”; o Python quer a variável repetida.'], x: '<p>Cada lado do <code>and</code> precisa ser uma pergunta inteira, com variável, operador e valor: <code>idade &gt;= 18 and idade &lt;= 65</code>.</p>', fix: 'idade = 30\nif idade >= 18 and idade <= 65:\n    print("Faixa de trabalho")' },
  ],
  projTitle: '🎯 Projetos práticos', projSub: 'Cinco pequenos sistemas que combinam entrada de dados, conversões, operadores e decisões. Leia o roteiro antes de digitar qualquer código!',
  quiz: [
    { q: 'O que o código mostra quando <code>idade = 18</code>?', code: 'if idade >= 18:\n    print("Maior de idade")\nelse:\n    print("Menor de idade")', o: ['Menor de idade', 'Maior de idade', 'Nada', 'Erro'], a: 1, x: '<code>&gt;=</code> inclui o 18, então a condição é True.' },
    { q: 'Qual palavra usamos para “senão, se” em Python?', o: ['<code>elseif</code>', '<code>elif</code>', '<code>else if</code>', '<code>otherwise</code>'], a: 1, x: '<code>elif</code> é a junção de else + if.' },
    { q: 'Em um <code>if / elif / else</code>, quantos blocos podem executar?', o: ['Todos', 'Apenas um', 'Sempre dois', 'Nenhum'], a: 1, x: 'O Python executa o bloco da <b>primeira</b> condição verdadeira e ignora o resto (o <code>else</code> só roda se nenhuma foi verdadeira).' },
    { q: 'Quando <code>A and B</code> é verdadeiro?', o: ['Quando A ou B é verdadeiro', 'Somente quando A e B são verdadeiros', 'Quando A é falso', 'Nunca'], a: 1, x: '<code>and</code> exige as duas. <code>or</code> exige pelo menos uma.' },
    { q: 'Qual é a forma correta?', o: ['<code>if dia == "sábado" or "domingo":</code>', '<code>if dia == "sábado" or dia == "domingo":</code>', '<code>if dia = "sábado" or dia = "domingo":</code>', '<code>if dia == ("sábado" or "domingo"):</code>'], a: 1, x: 'Cada lado do <code>or</code> precisa ser uma comparação completa, e comparar usa <code>==</code>.' },
    { q: 'Para que serve o recuo (4 espaços) depois de um <code>if</code>?', o: ['Só estética', 'Mostra quais linhas pertencem ao bloco do if', 'Faz o código rodar mais rápido', 'Evita erros de digitação'], a: 1, x: 'No Python, o recuo define o que está “dentro” do bloco. Sem ele, o Python dá erro.' },
  ],
});;

   Módulo 5: Funções

MODS.push({
  id: 'm5', icon: '⚙️', title: 'Funções', sub: 'def, parâmetros e return',
  lead: 'Uma função é uma pequena máquina: recebe informações, faz alguma coisa e pode devolver um resultado. Com ela você escreve uma vez e usa quantas vezes quiser.',
  blocks: [
    H2('Por que funções existem?'),
    CODE('Imagine que este cabeçalho precisa aparecer em vários pontos do programa:', 'print("=== Bem-vindo ===")\nprint("Loja do Python")\nprint("=================")\n\n# ... mais adiante no programa ...\n\nprint("=== Bem-vindo ===")\nprint("Loja do Python")\nprint("=================")', {
      lines: [[[1, 3], 'O cabeçalho, escrito uma vez.'], [5, 'Um comentário: “muitas linhas depois…”.'], [[7, 9], 'O <b>mesmo</b> cabeçalho copiado e colado.']],
      why: 'Copiar e colar funciona… até você querer mudar o texto. Aí precisa achar todas as cópias e alterar uma a uma — e é fácil esquecer alguma. Programadores têm um lema: <b>não se repita</b>.',
    }),
    TIP('Analogia: o liquidificador', ['Você coloca as frutas (<b>entrada</b>), aperta o botão (<b>chamada</b>) e sai o suco (<b>resultado</b>). Você não reinventa o liquidificador a cada suco.', '<b>Função = uma pequena máquina que recebe informações, faz alguma coisa e pode devolver um resultado.</b>']),
    H2('Sua primeira função: def'),
    CODE('Primeiro <b>definimos</b> a função (escrevemos a “receita”); depois <b>chamamos</b> (“cozinhamos”):', 'def mostrar_cabecalho():\n    print("=== Bem-vindo ===")\n    print("Loja do Python")\n    print("=================")\n\nmostrar_cabecalho()\nprint("... resto do programa ...")\nmostrar_cabecalho()', {
      lines: [[1, '<code>def</code> = “defina”. Depois vem o <b>nome</b> da função, parênteses (vazios por enquanto) e <code>:</code>. Nomes seguem as regras de variáveis.'], [[2, 4], 'O <b>corpo</b> da função: linhas com 4 espaços de recuo. <b>Nada disto roda ainda</b>: só está sendo ensinado ao Python.'], [6, '<b>Chamada</b>: o nome + parênteses. Só agora as linhas 2–4 executam.'], [7, 'O programa segue normalmente.'], [8, 'Chamamos de novo: o cabeçalho aparece outra vez, sem copiar o código.']],
      why: '<b>Definir</b> é escrever a receita; <b>chamar</b> é cozinhar. Uma receita escrita não faz bolo sozinha: a função só executa quando é chamada.',
      wi: [['Apagar as linhas 6 e 8 (as chamadas)', 'Nada aparece! A função foi definida, mas nunca usada.'], ['Mudar um texto dentro da função', 'Muda em <b>todas</b> as chamadas de uma vez — esse é o poder da função.'], ['Colocar uma chamada <b>antes</b> do <code>def</code>', 'Erro <i>NameError</i>: o Python lê de cima para baixo e ainda não conhecia a função.']],
    }),
    H2('Parâmetros: informações de entrada'),
    CODE('Uma função pode receber informações para trabalhar:', 'def saudacao(nome):\n    print(f"Olá, {nome}!")\n\nsaudacao("Maria")\nsaudacao("João")', {
      lines: [[1, '<code>nome</code>, entre os parênteses, é um <b>parâmetro</b>: uma caixa vazia que a função cria e que será preenchida a cada chamada.'], [2, 'O corpo usa o parâmetro como se fosse uma variável comum.'], [4, 'Chamada: <code>"Maria"</code> (o <b>argumento</b>) entra na caixa <code>nome</code>. Mostra “Olá, Maria!”.'], [5, 'Outra chamada, outro valor: “Olá, João!”.']],
      why: 'O parâmetro deixa a função <b>flexível</b>: a mesma máquina serve para qualquer nome. É como o suco: a máquina é a mesma, mas as frutas mudam.',
    }),
    TBL(['Palavra', 'Onde aparece', 'Exemplo'], [['<b>Parâmetro</b>', 'na <b>definição</b> (a caixa vazia)', '<code>def saudacao(<b>nome</b>):</code>'], ['<b>Argumento</b>', 'na <b>chamada</b> (o valor que entra)', '<code>saudacao(<b>"Maria"</b>)</code>']]),
    CODE('Com mais de um parâmetro, a <b>ordem</b> importa:', 'def apresentar(nome, idade):\n    print(f"{nome} tem {idade} anos.")\n\napresentar("Ana", 20)\napresentar("Bruno", 31)', {
      lines: [[1, 'Dois parâmetros, separados por vírgula.'], [4, 'O 1º argumento (“Ana”) vai para o 1º parâmetro (<code>nome</code>); o 2º (20) vai para <code>idade</code>.'], [5, 'Idem, com outros valores.']],
      why: 'Os valores são encaixados <b>por posição</b>.',
      wi: [['Trocar por <code>apresentar(20, "Ana")</code>', 'Mostra “20 tem Ana anos.” — a ordem trocou os papéis!'], ['Chamar só <code>apresentar("Ana")</code>', 'Erro: <i>missing 1 required positional argument: \'idade\'</i> (faltou um argumento).']],
    }),
    H2('return: devolvendo um resultado'),
    P('O <code>print</code> só <b>mostra</b> algo na tela. Muitas vezes queremos que a função <b>devolva</b> um valor para o resto do programa usar. É o trabalho do <code>return</code>.'),
    CODE('A função calcula e devolve; quem chamou decide o que fazer com o valor:', 'def somar(a, b):\n    return a + b\n\nresultado = somar(5, 3)\nprint(resultado)', {
      lines: [[1, 'Função com dois parâmetros, <code>a</code> e <code>b</code>.'], [2, '<code>return</code> = “devolva este valor e encerre a função”. Aqui devolve <code>a + b</code>.'], [4, 'Chama <code>somar(5, 3)</code> e guarda o valor devolvido na variável <code>resultado</code>.'], [5, 'Mostra 8.']],
      why: 'Como a função <b>devolve</b> o resultado, podemos guardá-lo, somá-lo com outra coisa ou passá-lo para outra função. Se ela apenas mostrasse com print, o valor ficaria preso na tela.',
      wi: [['Trocar por <code>somar(10, 20)</code>', 'Devolve 30.'], ['Trocar o <code>return</code> por <code>print</code>', 'Mostra 8, mas <code>resultado</code> passa a valer <code>None</code> (nada).']],
    }),
    P('O que acontece <b>passo a passo</b> na linha <code>resultado = somar(5, 3)</code>:'),
    STEPS(['O Python encontra a chamada <code>somar(5, 3)</code> e “pausa” a linha 4 para resolvê-la primeiro.', 'Entra na função: o parâmetro <code>a</code> recebe <b>5</b> e <code>b</code> recebe <b>3</b>.', 'Executa <code>return a + b</code>: calcula 5 + 3 = <b>8</b>.', 'A função termina e a chamada <code>somar(5, 3)</code> “vira” o valor 8 — como se o código fosse <code>resultado = 8</code>.', 'O 8 é guardado na variável <code>resultado</code>.']),
    W('machine'),
    H3('print x return'),
    CODE('Mesma ideia, dois efeitos bem diferentes:', 'def dobro_com_print(n):\n    print(n * 2)\n\ndef dobro_com_return(n):\n    return n * 2\n\nx = dobro_com_print(5)\ny = dobro_com_return(5)\nprint(x)\nprint(y)', {
      lines: [[[1, 2], 'Esta função só <b>mostra</b> o dobro.'], [[4, 5], 'Esta <b>devolve</b> o dobro.'], [7, 'Chama a primeira: o 10 aparece na tela <b>durante a chamada</b>. Como a função não devolve nada, <code>x</code> recebe <code>None</code> (“nada”).'], [8, '<code>y</code> recebe o valor 10, sem mostrar nada.'], [9, 'Mostra <code>None</code>.'], [10, 'Mostra 10.']],
      why: 'Regra de bolso: se você vai <b>usar o resultado depois</b> (guardar, somar, comparar), use <code>return</code>. Se só quer <b>mostrar</b>, use <code>print</code>.',
    }),
    WARN('return encerra a função', 'Ao chegar num <code>return</code>, a função termina na hora. Linhas escritas depois dele (no mesmo caminho) nunca executam.'),
    H2('Funções que decidem'),
    CODE('Dentro de uma função você pode usar tudo o que já aprendeu:', 'def classificar(nota):\n    if nota >= 7:\n        return "Aprovado"\n    elif nota >= 5:\n        return "Recuperação"\n    else:\n        return "Reprovado"\n\nprint(classificar(8))\nprint(classificar(6))\nprint(classificar(2))', {
      lines: [[1, 'Recebe uma nota.'], [[2, 7], 'Um <code>if / elif / else</code>. Cada caminho tem seu <code>return</code>: quando um deles é executado, a função termina.'], [[9, 11], 'Três chamadas com notas diferentes. Cada chamada devolve um texto, que o <code>print</code> mostra.']],
      why: 'Isso é o que você fez no módulo 4, mas <b>empacotado</b>: agora “classificar uma nota” virou um comando reutilizável.',
    }),
    H2('Valor padrão e escopo'),
    CODE('Um parâmetro pode ter um valor padrão, usado quando você não informa nada:', 'def saudacao(nome="visitante"):\n    print(f"Olá, {nome}!")\n\nsaudacao()\nsaudacao("Ana")', {
      lines: [[1, '<code>nome="visitante"</code>: se ninguém passar nome, vale “visitante”.'], [4, 'Sem argumento: usa o padrão.'], [5, 'Com argumento: o valor informado ganha.']],
      why: 'Valores padrão tornam funções mais amigáveis: as opções mais comuns já vêm prontas.',
    }),
    CODE('Variáveis criadas <b>dentro</b> da função só existem lá dentro (escopo). Rode e veja:', 'def calcular():\n    resultado = 10 * 2\n    return resultado\n\ncalcular()\nprint(resultado)', {
      lines: [[2, '<code>resultado</code> nasce <b>dentro</b> da função e morre quando ela termina.'], [5, 'Chama a função, mas <b>ignora</b> o valor devolvido.'], [6, 'Tenta usar <code>resultado</code> fora da função: ela não existe aqui!']],
      why: 'O que acontece na cozinha fica na cozinha. Para levar o valor para fora, use <code>return</code> e <b>guarde</b>: <code>resultado = calcular()</code>.',
      wi: [['Trocar a linha 5 por <code>resultado = calcular()</code>', 'Agora funciona e mostra 20.']],
    }),
    H2('Funções chamando funções'),
    CODE('Funções pequenas podem ser combinadas como peças de Lego:', 'def somar(a, b):\n    return a + b\n\ndef media(a, b):\n    return somar(a, b) / 2\n\nprint(media(6, 8))', {
      lines: [[[1, 2], 'A primeira peça: soma dois números.'], [[4, 5], 'A segunda peça usa a primeira: soma e divide por 2.'], [7, 'Resultado: (6 + 8) / 2 = <b>7.0</b>.']],
      why: 'Cada função faz <b>uma coisa bem feita</b>. Combinadas, resolvem problemas grandes.',
    }),
    NOTE('Boas práticas', ['Nome de função = verbo ou ação (<code>calcular_media</code>, <code>eh_par</code>).', 'Cada função faz uma coisa só.', 'Prefira <code>return</code> a <code>print</code> dentro de funções de cálculo: assim você pode reutilizar o resultado.']),
  ],
  ex: [
    { id: 'm5-1', lvl: 1, t: 'Minha primeira função', q: '<p>Crie uma função chamada <code>dizer_ola</code> que mostre <code>Olá, mundo!</code> e, depois de defini-la, <b>chame-a</b>.</p>', start: 'def dizer_ola():\n    # escreva aqui\n    pass\n\n# chame a função aqui\n', h: ['O corpo da função tem 4 espaços de recuo.', 'A chamada fica <b>fora</b> da função, sem recuo: <code>dizer_ola()</code>.'], s: 'def dizer_ola():\n    print("Olá, mundo!")\n\ndizer_ola()', sl: [[1, 'Define a função.'], [2, 'Corpo: mostra a mensagem.'], [4, 'Chama a função — só agora a mensagem aparece.']], x: '<p>Definir não executa. A linha 4 chama a função, fazendo o corpo rodar.</p>' },
    { id: 'm5-2', lvl: 1, k: 'pr', t: 'Quando a função roda?', q: '<p>O que aparece na tela? (4 linhas)</p>', code: 'def mostrar():\n    print("A")\n    print("B")\n\nprint("Início")\nmostrar()\nprint("Fim")', h: ['A definição não mostra nada. Comece a executar a partir da linha 5.'], x: '<p>As linhas 1–3 só ensinam a função. Linha 5: <b>Início</b>. Linha 6: chama <code>mostrar()</code> → <b>A</b>, <b>B</b>. Linha 7: <b>Fim</b>.</p>' },
    { id: 'm5-3', lvl: 1, k: 'mc', t: 'Para que serve o return?', q: '<p>O que faz a palavra <code>return</code> dentro de uma função?</p>', o: ['Mostra o valor na tela', '<b>Devolve</b> um valor para quem chamou a função e encerra a função', 'Cria uma variável', 'Repete a função'], a: 1, h: ['Lembre da analogia: a máquina de suco entrega o resultado.'], x: '<p><code>return</code> devolve o valor ao ponto onde a função foi chamada e termina a função. Quem mostra na tela é o <code>print</code>.</p>' },
    { id: 'm5-4', lvl: 2, t: 'Função com parâmetro', q: '<p>Crie a função <code>saudacao(nome)</code> que <b>mostra</b> <code>Olá, NOME!</code>. Os testes chamam a função por você (ex.: <code>saudacao("Ana")</code> deve mostrar <code>Olá, Ana!</code>).</p>', start: FSTART('def saudacao(nome):', 'mostre Olá, nome!'), h: ['Use uma f-string: <code>f"Olá, {nome}!"</code>.'], s: 'def saudacao(nome):\n    print(f"Olá, {nome}!")', tests: [{ c: 'saudacao("Ana")' }, { c: 'saudacao("João")' }], x: '<p>O parâmetro <code>nome</code> recebe o valor de cada chamada e é usado dentro da f-string.</p>' },
    { id: 'm5-5', lvl: 2, t: 'O dobro', q: '<p>Crie <code>dobro(n)</code> que <b>devolve</b> (com <code>return</code>) o dobro do número. Ex.: <code>dobro(4)</code> devolve 8.</p>', start: FSTART('def dobro(n):', 'devolva o dobro de n'), h: ['<code>return n * 2</code>'], s: 'def dobro(n):\n    return n * 2', tests: [{ c: 'print(dobro(4))' }, { c: 'print(dobro(0))' }, { c: 'print(dobro(-3))' }, { c: 'print(dobro(2.5))' }], x: '<p>A função <b>devolve</b> o resultado; o <code>print</code> de fora (colocado pelo teste) é que o mostra. Funciona até com decimais.</p>' },
    { id: 'm5-6', lvl: 2, t: 'Somar dois números', q: '<p>Crie <code>somar(a, b)</code> que devolve a soma dos dois. Depois de definir, você pode testar: <code>resultado = somar(5, 3)</code> e <code>print(resultado)</code>.</p>', start: FSTART('def somar(a, b):', 'devolva a + b'), h: ['<code>return a + b</code>'], s: 'def somar(a, b):\n    return a + b', tests: [{ c: 'print(somar(5, 3))' }, { c: 'print(somar(-2, 2))' }, { c: 'print(somar(1.5, 2))' }], x: '<p>Passo a passo de <code>somar(5, 3)</code>: <code>a</code> recebe 5, <code>b</code> recebe 3, o return devolve 8 e a chamada “vira” 8.</p>' },
    { id: 'm5-7', lvl: 3, t: 'É par?', q: '<p>Crie <code>eh_par(n)</code> que devolve <code>True</code> se o número for par e <code>False</code> se for ímpar.</p>', start: FSTART('def eh_par(n):', 'devolva True ou False'), h: ['Um número é par quando <code>n % 2 == 0</code>.', 'A própria comparação já é <code>True</code> ou <code>False</code>: <code>return n % 2 == 0</code>.'], s: 'def eh_par(n):\n    return n % 2 == 0', tests: [{ c: 'print(eh_par(4))' }, { c: 'print(eh_par(7))' }, { c: 'print(eh_par(0))' }], x: '<p>Uma comparação resulta num bool; então podemos devolvê-la diretamente, sem if.</p>' },
    { id: 'm5-8', lvl: 3, t: 'O maior de dois', q: '<p>Crie <code>maior(a, b)</code> que devolve o maior dos dois números.</p>', start: FSTART('def maior(a, b):', 'devolva o maior'), h: ['Use um <code>if a &gt; b:</code> com um <code>return</code> em cada caminho.'], s: 'def maior(a, b):\n    if a > b:\n        return a\n    else:\n        return b', tests: [{ c: 'print(maior(3, 9))' }, { c: 'print(maior(9, 3))' }, { c: 'print(maior(5, 5))' }], x: '<p>Se <code>a</code> é maior, devolve <code>a</code>; senão devolve <code>b</code> (que cobre também o empate).</p>' },
    { id: 'm5-9', lvl: 3, t: 'Área do retângulo', q: '<p>Crie <code>area_retangulo(base, altura)</code> que devolve a área (base × altura).</p>', start: FSTART('def area_retangulo(base, altura):', 'devolva a área'), h: ['<code>return base * altura</code>'], s: 'def area_retangulo(base, altura):\n    return base * altura', tests: [{ c: 'print(area_retangulo(5, 3))' }, { c: 'print(area_retangulo(2.5, 4))' }], x: '<p>Dois parâmetros, um cálculo, um <code>return</code>. Simples e reutilizável para qualquer retângulo.</p>' },
    { id: 'm5-10', lvl: 3, t: 'Classificar a nota', q: '<p>Crie <code>classificar(nota)</code> que <b>devolve</b> <code>"Aprovado"</code> (nota ≥ 7), <code>"Recuperação"</code> (≥ 5) ou <code>"Reprovado"</code>.</p>', start: FSTART('def classificar(nota):', 'devolva o texto certo'), h: ['<code>if / elif / else</code>, cada caminho com <code>return</code>.'], s: 'def classificar(nota):\n    if nota >= 7:\n        return "Aprovado"\n    elif nota >= 5:\n        return "Recuperação"\n    else:\n        return "Reprovado"', tests: [{ c: 'print(classificar(8))' }, { c: 'print(classificar(7))' }, { c: 'print(classificar(6))' }, { c: 'print(classificar(5))' }, { c: 'print(classificar(4.9))' }], x: '<p>É o exercício do módulo 4, agora empacotado em função: os <code>return</code> devolvem o texto e encerram a função na hora.</p>' },
    { id: 'm5-11', lvl: 3, t: 'Aplicar desconto', q: '<p>Crie <code>desconto(valor, percentual)</code> que devolve o valor <b>já com o desconto</b>. Ex.: <code>desconto(200, 10)</code> devolve <code>180.0</code>.</p>', start: FSTART('def desconto(valor, percentual):', 'devolva o valor com desconto'), h: ['O desconto é <code>valor * percentual / 100</code>.', 'Devolva <code>valor - o_desconto</code>.'], s: 'def desconto(valor, percentual):\n    return valor - valor * percentual / 100', tests: [{ c: 'print(desconto(200, 10))' }, { c: 'print(desconto(50, 0))' }, { c: 'print(desconto(80, 25))' }], x: '<p>Primeiro calculamos o valor do desconto (<code>valor * percentual / 100</code>), depois subtraímos do valor original. A divisão faz o resultado ser decimal (180.0).</p>' },
    { id: 'm5-12', lvl: 3, t: 'Média de três', q: '<p>Crie <code>media(a, b, c)</code> que devolve a média dos três números.</p>', start: FSTART('def media(a, b, c):', 'devolva a média'), h: ['Cuidado com os parênteses: <code>(a + b + c) / 3</code>.'], s: 'def media(a, b, c):\n    return (a + b + c) / 3', tests: [{ c: 'print(media(6, 6, 6))' }, { c: 'print(media(7, 8, 9))' }, { c: 'print(media(10, 5, 0))' }], x: '<p>Sem parênteses, só o <code>c</code> seria dividido por 3. Os parênteses garantem que a soma vem primeiro.</p>' },
    { id: 'm5-13', lvl: 4, t: 'Desafio: ano bissexto em função', q: '<p>Crie <code>eh_bissexto(ano)</code> que devolve <code>True</code> ou <code>False</code>. Lembre: divisível por 4 e não por 100, <b>ou</b> divisível por 400.</p>', start: FSTART('def eh_bissexto(ano):', 'devolva True ou False'), h: ['Você já resolveu isso com if no módulo 4.', '<code>return (ano % 4 == 0 and ano % 100 != 0) or ano % 400 == 0</code>'], s: 'def eh_bissexto(ano):\n    return (ano % 4 == 0 and ano % 100 != 0) or ano % 400 == 0', tests: [{ c: 'print(eh_bissexto(2024))' }, { c: 'print(eh_bissexto(1900))' }, { c: 'print(eh_bissexto(2000))' }, { c: 'print(eh_bissexto(2023))' }], x: '<p>Combinação de <code>and</code>, <code>or</code> e parênteses devolvida diretamente: a expressão inteira já resulta em True ou False.</p>' },
    { id: 'm5-14', lvl: 4, t: 'Desafio: Celsius para Fahrenheit', q: '<p>Crie <code>celsius_para_fahrenheit(c)</code> que devolve a temperatura em Fahrenheit. Fórmula: <code>c * 9 / 5 + 32</code>.</p>', start: FSTART('def celsius_para_fahrenheit(c):', 'devolva a conversão'), h: ['A fórmula já está no enunciado: coloque-a no <code>return</code>.'], s: 'def celsius_para_fahrenheit(c):\n    return c * 9 / 5 + 32', tests: [{ c: 'print(celsius_para_fahrenheit(0))' }, { c: 'print(celsius_para_fahrenheit(100))' }, { c: 'print(celsius_para_fahrenheit(-40))' }], x: '<p>Água congela a 0 °C (32 °F) e ferve a 100 °C (212 °F). E -40 é o único ponto em que as duas escalas coincidem!</p>' },
    { id: 'm5-p6', lvl: 4, proj: true, t: 'Projeto 6 — Caixa de ferramentas', q: '<p>Crie <b>quatro funções</b> que devolvem valores (não mostram):</p><ul><li><code>somar(a, b)</code> → a soma</li><li><code>media(a, b, c)</code> → a média dos três</li><li><code>aplicar_desconto(valor, percentual)</code> → valor com desconto</li><li><code>classificar_aluno(media)</code> → <code>"Aprovado"</code> (≥ 7), <code>"Recuperação"</code> (≥ 5) ou <code>"Reprovado"</code></li></ul>', plan: ['Que informações cada função recebe? (parâmetros)', 'O que cada uma devolve? (<code>return</code>)', 'Alguma precisa decidir? (a última — <code>if / elif / else</code>)'], start: 'def somar(a, b):\n    pass\n\ndef media(a, b, c):\n    pass\n\ndef aplicar_desconto(valor, percentual):\n    pass\n\ndef classificar_aluno(media):\n    pass\n', h: ['Cada função tem uma linha só de <code>return</code>, exceto <code>classificar_aluno</code>.', '<code>aplicar_desconto</code>: <code>valor - valor * percentual / 100</code>.'], s: 'def somar(a, b):\n    return a + b\n\ndef media(a, b, c):\n    return (a + b + c) / 3\n\ndef aplicar_desconto(valor, percentual):\n    return valor - valor * percentual / 100\n\ndef classificar_aluno(media):\n    if media >= 7:\n        return "Aprovado"\n    elif media >= 5:\n        return "Recuperação"\n    else:\n        return "Reprovado"', tests: [{ c: 'print(somar(2, 3))' }, { c: 'print(media(6, 7, 8))' }, { c: 'print(aplicar_desconto(200, 10))' }, { c: 'print(classificar_aluno(7.5))' }, { c: 'print(classificar_aluno(5.0))' }, { c: 'print(classificar_aluno(3))' }], x: '<p>Uma “caixa de ferramentas”: quatro funções pequenas, cada uma com uma responsabilidade. Note que o parâmetro <code>media</code> de <code>classificar_aluno</code> tem o mesmo nome da função <code>media</code>, mas são coisas diferentes (parâmetro é local).</p>' },
    { id: 'm5-p7', lvl: 4, proj: true, t: 'Projeto 7 — Boletim com funções', q: `<p>Use funções para montar um boletim. Crie <code>calcular_media(n1, n2, n3)</code> e <code>situacao(media)</code> (devolve <code>"Aprovado"</code>, <code>"Recuperação"</code> ou <code>"Reprovado"</code>). No programa principal, peça as 3 notas (decimais) e mostre:</p>${BOXPRE('Média: 7.0\nSituação: Aprovado')}`, plan: ['Escreva primeiro as duas funções (definição).', 'Depois o programa principal: entradas → chamadas → saída.', 'A média mostrada tem 1 casa decimal.'], start: 'def calcular_media(n1, n2, n3):\n    pass\n\ndef situacao(media):\n    pass\n\n# programa principal\n', h: ['No principal: <code>media = calcular_media(n1, n2, n3)</code> e <code>print(f"Situação: {situacao(media)}")</code>.', 'Não esqueça <code>float(input(...))</code> nas três notas.'], s: 'def calcular_media(n1, n2, n3):\n    return (n1 + n2 + n3) / 3\n\ndef situacao(media):\n    if media >= 7:\n        return "Aprovado"\n    elif media >= 5:\n        return "Recuperação"\n    else:\n        return "Reprovado"\n\nn1 = float(input("Nota 1: "))\nn2 = float(input("Nota 2: "))\nn3 = float(input("Nota 3: "))\nmedia = calcular_media(n1, n2, n3)\nprint(f"Média: {media:.1f}")\nprint(f"Situação: {situacao(media)}")', tests: [{ i: ['8', '7', '6'] }, { i: ['5', '5', '5.5'] }, { i: ['2', '3', '4'] }], x: '<p>O programa principal fica curtinho: lê, chama as funções e mostra. A lógica pesada mora nas funções, que você poderia reaproveitar em outros programas.</p>' },
    { id: 'm5-b1', lvl: 2, bug: true, k: 'mc', t: 'A soma que virou None', q: '<p>O programa mostra <code>None</code> em vez de 5. Por quê?</p>', code: 'def somar(a, b):\n    resultado = a + b\n\ntotal = somar(2, 3)\nprint(total)', o: ['Falta o <code>return</code>: a função calcula mas <b>não devolve</b> nada', 'Os parâmetros estão errados', 'O <code>print</code> deveria estar dentro da função', 'Falta o <code>else</code>'], a: 0, h: ['O que uma função devolve quando não há <code>return</code>?'], x: '<p>Sem <code>return</code>, a função devolve <code>None</code> (nada). O cálculo ficou preso dentro dela. Corrija com <code>return a + b</code>.</p>', fix: 'def somar(a, b):\n    return a + b\n\ntotal = somar(2, 3)\nprint(total)' },
    { id: 'm5-b2', lvl: 2, bug: true, k: 'mc', t: 'Função sem recuo', q: '<p>O Python recusa este código. Por quê?</p>', code: 'def saudacao(nome):\nprint("Olá,", nome)\n\nsaudacao("Ana")', o: ['O corpo da função precisa de <b>recuo</b> (4 espaços)', 'Faltam aspas em <code>nome</code>', 'Falta <code>return</code>', 'O nome da função é inválido'], a: 0, h: ['Compare com o <code>if</code>: o que vem depois do dois-pontos?'], x: '<p>Depois do <code>def ...:</code> o corpo precisa estar recuado. Sem isso: <i>IndentationError: expected an indented block after function definition</i>.</p>', fix: 'def saudacao(nome):\n    print("Olá,", nome)\n\nsaudacao("Ana")' },
    { id: 'm5-b3', lvl: 2, bug: true, k: 'mc', t: 'Chamada sem argumento', q: '<p>O que há de errado na chamada?</p>', code: 'def dobro(n):\n    return n * 2\n\nprint(dobro())', o: ['A função precisa de um argumento: <code>dobro(5)</code>', '<code>dobro</code> é palavra reservada', 'Falta o <code>def</code>', 'O <code>print</code> não pode receber função'], a: 0, h: ['Quantos parâmetros a função tem? Quantos argumentos foram passados?'], x: '<p>A função declara 1 parâmetro (<code>n</code>) mas a chamada não passou nenhum valor: <i>missing 1 required positional argument: \'n\'</i>.</p>', fix: 'def dobro(n):\n    return n * 2\n\nprint(dobro(5))' },
    { id: 'm5-b4', lvl: 2, bug: true, k: 'mc', t: 'A função que nunca roda', q: '<p>O programa não mostra nada e não dá erro. Por quê?</p>', code: 'def mostrar_boas_vindas():\n    print("Bem-vindo!")\n\nmostrar_boas_vindas', o: ['Faltam os <b>parênteses</b> na chamada: <code>mostrar_boas_vindas()</code>', 'Faltam aspas em Bem-vindo', 'A função precisa de parâmetro', 'Falta <code>return</code>'], a: 0, h: ['Sem parênteses, o Python só “olha” para a função, não a executa.'], x: '<p>O nome sozinho apenas faz referência à função. Os parênteses são o “botão de ligar”: <code>mostrar_boas_vindas()</code>.</p>', fix: 'def mostrar_boas_vindas():\n    print("Bem-vindo!")\n\nmostrar_boas_vindas()' },
    { id: 'm5-b5', lvl: 3, bug: true, k: 'mc', t: 'Variável presa na função', q: '<p>Por que <code>print(total)</code> dá erro?</p>', code: 'def calcular():\n    total = 10 * 2\n    return total\n\ncalcular()\nprint(total)', o: ['<code>total</code> foi criada <b>dentro</b> da função e não existe fora dela; o valor devolvido não foi guardado', 'Falta parâmetro', 'Não pode haver duas linhas com <code>total</code>', 'O <code>return</code> deveria vir depois do print'], a: 0, h: ['Onde nasce e onde morre a variável <code>total</code>?'], x: '<p>Variáveis de dentro da função são <b>locais</b>. Para usar o valor fora, guarde o que a função devolve: <code>total = calcular()</code>.</p>', fix: 'def calcular():\n    total = 10 * 2\n    return total\n\ntotal = calcular()\nprint(total)' },
    { id: 'm5-b6', lvl: 2, bug: true, k: 'mc', t: 'Def sem dois-pontos', q: '<p>Qual é o problema?</p>', code: 'def somar(a, b)\n    return a + b', o: ['Falta o <b>dois-pontos</b> no fim da linha do <code>def</code>', 'Falta um <code>print</code>', 'Os parâmetros deveriam ser texto', 'O <code>return</code> não pode somar'], a: 0, h: ['Todo cabeçalho de bloco termina do mesmo jeito.'], x: '<p>O <code>def</code> também termina com <code>:</code>, como if, else, while e for.</p>', fix: 'def somar(a, b):\n    return a + b' },
    { id: 'm5-b7', lvl: 3, bug: true, k: 'mc', t: 'Argumentos demais', q: '<p>Por que o Python reclama da chamada?</p>', code: 'def somar(a, b):\n    return a + b\n\nprint(somar(1, 2, 3))', o: ['A função recebe 2 parâmetros, mas a chamada passou <b>3 argumentos</b>', 'Falta <code>return</code>', 'Os números precisam de aspas', 'A soma só aceita números pares'], a: 0, h: ['Conte parâmetros e argumentos.'], x: '<p>Mensagem: <i>somar() takes 2 positional arguments but 3 were given</i>. A quantidade de argumentos deve bater com a de parâmetros (a menos que haja valor padrão).</p>', fix: 'def somar(a, b):\n    return a + b\n\nprint(somar(1, 2))' },
  ],
  projTitle: '🎯 Projetos com funções', projSub: 'Agora que você sabe empacotar código, monte programas mais organizados.',
  quiz: [
    { q: 'Qual é a diferença entre <b>parâmetro</b> e <b>argumento</b>?', o: ['Nenhuma', 'Parâmetro fica na <b>definição</b>; argumento é o valor passado na <b>chamada</b>', 'Parâmetro é para texto; argumento para número', 'Argumento fica na definição'], a: 1, x: 'Em <code>def f(x)</code>, <code>x</code> é o parâmetro. Em <code>f(5)</code>, o 5 é o argumento.' },
    { q: 'O que aparece?', code: 'def dobro(n):\n    return n * 2\n\nprint(dobro(dobro(3)))', o: ['6', '12', '9', 'Erro'], a: 1, x: '<code>dobro(3)</code> devolve 6; depois <code>dobro(6)</code> devolve 12.' },
    { q: 'O que uma função devolve quando <b>não tem</b> <code>return</code>?', o: ['0', 'Um texto vazio', '<code>None</code>', 'Dá erro'], a: 2, x: 'Sem return, o resultado é <code>None</code> — “nada”.' },
    { q: 'Qual linha <b>chama</b> a função <code>somar</code>?', o: ['<code>def somar(2, 3):</code>', '<code>resultado = somar(2, 3)</code>', '<code>somar = 2 + 3</code>', '<code>return somar</code>'], a: 1, x: 'Chamar é usar o nome com parênteses e argumentos. O <code>def</code> só define.' },
    { q: 'O que acontece com uma variável criada dentro de uma função?', o: ['Existe em todo o programa', 'Só existe dentro da função (escopo local)', 'Vira parâmetro', 'É apagada antes de ser criada'], a: 1, x: 'Variáveis locais nascem e morrem com a função. Para levar um valor para fora, use <code>return</code>.' },
    { q: 'Qual a diferença entre <code>print</code> e <code>return</code> dentro de uma função?', o: ['Nenhuma', '<code>print</code> mostra na tela; <code>return</code> devolve o valor para o resto do programa', '<code>return</code> mostra e <code>print</code> devolve', 'Só <code>print</code> encerra a função'], a: 1, x: 'Para reaproveitar o resultado (guardar, somar, comparar), use <code>return</code>.' },
