    CODE('Com <code>as</code>, você guarda o erro numa variável e pode mostrar a mensagem original:', 'try:\n    numero = int("abc")\nexcept ValueError as erro:\n    print("Deu problema:", erro)', {
      lines: [[3, '<code>as erro</code> = “chame o erro capturado de <code>erro</code>”. É uma variável comum.'], [4, 'Mostrar o erro exibe a mensagem que o Python daria: <code>invalid literal for int() with base 10: \'abc\'</code>.']],
      why: 'Útil para registrar o que aconteceu (um log) ou mostrar detalhes durante o desenvolvimento.',
    }),
    H2('else e finally'),
    CODE('Mais duas peças opcionais:', 'try:\n    numero = int(input("Número: "))\nexcept ValueError:\n    print("Valor inválido")\nelse:\n    print(f"O dobro é {numero * 2}")\nfinally:\n    print("Fim da leitura")', {
      lines: [[[3, 4], 'Se deu erro: mensagem.'], [[5, 6], '<code>else</code>: roda <b>só se não houve nenhum erro</b> no try. Ótimo para o que depende de o try ter dado certo.'], [[7, 8], '<code>finally</code>: roda <b>sempre</b>, com ou sem erro. Usado para “limpar” ou fechar coisas.']],
      why: 'Coloque no <code>try</code> apenas a linha que pode falhar. O restante vai no <code>else</code>: assim o except não “engole” erros de outros lugares.',
    }),
    H2('Pedir de novo até dar certo'),
    CODE('Combinando <code>while True</code>, <code>try</code> e <code>break</code>, o programa insiste até receber um valor válido:', 'while True:\n    try:\n        idade = int(input("Idade: "))\n        break\n    except ValueError:\n        print("Valor inválido, tente de novo.")\nprint(f"Você tem {idade} anos")', {
      lines: [[1, 'Laço infinito: só sai com <code>break</code>.'], [3, 'Tenta converter.'], [4, 'Se a conversão deu certo, <code>break</code> encerra o laço. Se deu erro, esta linha nunca chega a executar.'], [[5, 6], 'Se deu erro: avisa e o laço <b>volta ao início</b>, pedindo de novo.'], [7, 'Só chega aqui com um número válido em <code>idade</code>.']],
      why: 'Este é o padrão mais usado para entradas do usuário: “pergunte até a pessoa acertar”.',
    }),
    H2('raise: criando um erro de propósito'),
    CODE('Você também pode <b>disparar</b> um erro quando algo não faz sentido para o seu programa:', 'def dividir(a, b):\n    if b == 0:\n        raise ValueError("O divisor não pode ser zero")\n    return a / b\n\ntry:\n    print(dividir(10, 2))\n    print(dividir(5, 0))\nexcept ValueError as e:\n    print("Erro:", e)', {
      lines: [[[1, 4], 'Uma função que se recusa a trabalhar com dados inválidos.'], [3, '<code>raise</code> = “dispare este erro”, com uma mensagem clara.'], [[6, 7], 'A primeira chamada funciona (5.0).'], [8, 'A segunda dispara o erro dentro da função; o resto do try é abandonado.'], [[9, 10], 'O except captura o erro e mostra a mensagem que <b>nós</b> escrevemos.']],
      why: 'Quem usa a sua função descobre <b>na hora</b> que passou um dado inválido, em vez de receber um resultado errado.',
    }),
    H2('Com dicionários: o KeyError'),
    CODE('O erro de chave inexistente pode ser tratado do mesmo jeito:', 'precos = {"arroz": 5.5, "café": 12.0}\nproduto = input("Produto: ")\ntry:\n    print(f"Preço: R$ {precos[produto]:.2f}")\nexcept KeyError:\n    print("Produto não encontrado")', {
      lines: [[4, 'Se <code>produto</code> não for uma chave, o <code>precos[produto]</code> dispara <i>KeyError</i>.'], [[5, 6], 'Tratamos com uma mensagem amigável.']],
      why: 'Aqui há duas formas corretas: <code>.get()</code> / <code>in</code> (verificar antes) ou <code>try/except</code> (agir depois). Use a que deixar o código mais claro.',
    }),
    TBL(['Quando…', 'Prefira'], [
      ['você pode <b>prever</b> o problema com uma pergunta simples (“b é zero?”)', '<code>if</code>'],
      ['o problema vem do <b>mundo de fora</b> e é difícil prever (texto digitado, arquivo, conversão)', '<code>try / except</code>'],
    ]),
    WARN('Cuidados', ['<b>Evite o <code>except:</code> vazio</b>. Ele captura tudo, até seus próprios bugs, e esconde o que está errado. Sempre nomeie o erro esperado.', 'Coloque no <code>try</code> só as linhas que realmente podem falhar.', 'Erros de <b>sintaxe</b> (falta de <code>:</code>, aspas abertas…) não podem ser tratados: o programa nem começa a rodar.']),
    NOTE('Para ignorar um erro de propósito', 'Use <code>pass</code> (“não faça nada”) dentro do <code>except</code>. Mas só quando for realmente o que você quer.'),
  ],
  ex: [
    { id: 'm10-1', lvl: 1, k: 'pr', t: 'Quando dá tudo certo', q: '<p>O que aparece na tela?</p>', code: 'try:\n    x = int("12")\n    print("ok")\nexcept ValueError:\n    print("erro")\nprint("fim")', h: ['<code>int("12")</code> funciona?'], x: '<p>“12” é um número válido, então o <code>try</code> termina sem erro (mostra <b>ok</b>) e o <code>except</code> é ignorado. A última linha mostra <b>fim</b>.</p>' },
    { id: 'm10-2', lvl: 1, k: 'pr', t: 'Quando dá erro', q: '<p>O que aparece na tela? (2 linhas)</p>', code: 'try:\n    x = int("abc")\n    print("ok")\nexcept ValueError:\n    print("erro")\nprint("fim")', h: ['O que acontece com o <code>print("ok")</code> quando a linha 2 falha?'], x: '<p><code>int("abc")</code> dispara <i>ValueError</i> na linha 2. O Python <b>pula</b> o <code>print("ok")</code> e executa o <code>except</code>: <b>erro</b>. Depois o programa continua: <b>fim</b>.</p>' },
    { id: 'm10-3', lvl: 1, k: 'mc', t: 'Qual erro é esse?', q: '<p>Qual erro o Python dispara ao executar <code>int("abc")</code>?</p>', o: ['<code>ValueError</code>', '<code>TypeError</code>', '<code>NameError</code>', '<code>ZeroDivisionError</code>'], a: 0, h: ['O tipo (texto) é aceito pelo <code>int()</code>, mas o <b>conteúdo</b> não serve.'], x: '<p>É <code>ValueError</code>: o <code>int()</code> aceita texto (tipo certo), mas “abc” não é um valor válido para virar número.</p>' },
    { id: 'm10-4', lvl: 2, t: 'Leitura segura de inteiro', q: '<p>Peça um número inteiro. Se for válido, mostre <code>O dobro é 42</code> (para 21). Se não for, mostre <code>Valor inválido</code>. Use <code>try/except</code>.</p>', h: ['Coloque o <code>int(input(...))</code> dentro do <code>try</code>.', 'O erro esperado é <code>ValueError</code>.'], s: 'try:\n    numero = int(input("Número: "))\n    print(f"O dobro é {numero * 2}")\nexcept ValueError:\n    print("Valor inválido")', sl: [[1, 'Começa a parte arriscada.'], [2, 'Converte: falha se não for inteiro.'], [3, 'Só executa se a linha 2 der certo.'], [4, 'Rede de proteção para <code>ValueError</code>.'], [5, 'Mensagem amigável.']], tests: [{ i: ['21'] }, { i: ['abc'] }, { i: ['2.5'] }], x: '<p>Se o <code>int()</code> falha, a linha do print é pulada e o <code>except</code> assume. Note que <code>2.5</code> também é inválido para <code>int()</code>.</p>' },
    { id: 'm10-5', lvl: 2, t: 'Divisão segura', q: '<p>Peça dois números inteiros e mostre a divisão no formato <code>Resultado: 2.5</code>. Trate dois erros:</p><ul><li>texto que não é número → <code>Digite apenas números inteiros.</code></li><li>divisão por zero → <code>Não é possível dividir por zero.</code></li></ul>', h: ['Um <code>try</code> com dois <code>except</code>: <code>ValueError</code> e <code>ZeroDivisionError</code>.'], s: 'try:\n    a = int(input("Numerador: "))\n    b = int(input("Denominador: "))\n    print(f"Resultado: {a / b}")\nexcept ValueError:\n    print("Digite apenas números inteiros.")\nexcept ZeroDivisionError:\n    print("Não é possível dividir por zero.")', tests: [{ i: ['10', '4'] }, { i: ['10', '0'] }, { i: ['dez', '2'] }], x: '<p>O Python usa o <code>except</code> que combina com o tipo do erro que aconteceu. Assim cada problema recebe sua própria mensagem.</p>' },
    { id: 'm10-6', lvl: 2, k: 'pr', t: 'else e finally', q: '<p>O que aparece na tela? (2 linhas)</p>', code: 'try:\n    n = int("5")\nexcept ValueError:\n    print("A")\nelse:\n    print("B")\nfinally:\n    print("C")', h: ['O <code>else</code> só roda se <b>não</b> houve erro. O <code>finally</code> roda sempre.'], x: '<p>“5” converte sem erro: o <code>except</code> é ignorado, o <code>else</code> roda (<b>B</b>) e o <code>finally</code> roda sempre (<b>C</b>).</p>' },
    { id: 'm10-7', lvl: 2, t: 'Idade válida', q: '<p>Peça a idade. Se não for um inteiro, mostre <code>Idade inválida</code>. Se for negativa, <code>Idade não pode ser negativa</code>. Caso contrário, <code>Idade ok</code>.</p>', h: ['O <code>ValueError</code> trata o “não é inteiro”.', 'A checagem do negativo é uma decisão comum (<code>if</code>) — pode ficar no <code>else</code> do try.'], s: 'try:\n    idade = int(input("Idade: "))\nexcept ValueError:\n    print("Idade inválida")\nelse:\n    if idade < 0:\n        print("Idade não pode ser negativa")\n    else:\n        print("Idade ok")', tests: [{ i: ['20'] }, { i: ['-5'] }, { i: ['abc'] }], x: '<p>Combinamos os dois mundos: <code>try/except</code> para a conversão (imprevisível) e <code>if</code> para a regra de negócio (previsível). O <code>else</code> do try só roda quando a conversão deu certo.</p>' },
    { id: 'm10-8', lvl: 3, t: 'Conversor que não quebra', q: '<p>Crie a função <code>converter_inteiro(texto)</code>. Ela <b>devolve</b> o número inteiro se o texto for válido; senão, devolve <code>None</code>. Ex.: <code>"42"</code> → 42 e <code>"abc"</code> → None.</p>', start: 'def converter_inteiro(texto):\n    # tente converter; se não der, devolva None\n    pass\n', h: ['Dentro do <code>try</code>: <code>return int(texto)</code>.', 'No <code>except ValueError</code>: <code>return None</code>.'], s: 'def converter_inteiro(texto):\n    try:\n        return int(texto)\n    except ValueError:\n        return None', tests: [{ c: 'print(converter_inteiro("42"))' }, { c: 'print(converter_inteiro("abc"))' }, { c: 'print(converter_inteiro(""))' }, { c: 'print(converter_inteiro(" 7 "))' }], x: '<p>O <code>return</code> dentro do <code>try</code> devolve o número quando a conversão funciona; se falhar, o <code>except</code> devolve <code>None</code>. Uma função “à prova de erro” reaproveitável em qualquer programa.</p>' },
    { id: 'm10-9', lvl: 3, t: 'Insista até acertar', q: '<p>Peça um número inteiro. Enquanto a pessoa digitar algo inválido, mostre <code>Valor inválido</code> e pergunte de novo. Quando acertar, mostre <code>Você digitou: 42</code>.</p>', h: ['Use <code>while True:</code> com <code>try</code> dentro.', 'Depois do <code>int(...)</code> dar certo, use <code>break</code>.'], s: 'while True:\n    try:\n        numero = int(input("Digite um número inteiro: "))\n        break\n    except ValueError:\n        print("Valor inválido")\nprint(f"Você digitou: {numero}")', tests: [{ i: ['abc', 'x', '42'] }, { i: ['7'] }], x: '<p>O <code>break</code> só é alcançado se o <code>int()</code> tiver dado certo. Com erro, o except mostra o aviso e o laço recomeça.</p>' },
    { id: 'm10-10', lvl: 3, t: 'Disparando um erro', q: '<p>Crie <code>dividir(a, b)</code>: se <code>b</code> for zero, dispare <code>ValueError</code> com a mensagem <code>"Divisão por zero"</code>; senão, devolva <code>a / b</code>.</p>', start: 'def dividir(a, b):\n    pass\n', h: ['<code>if b == 0:</code> e dentro dele <code>raise ValueError("Divisão por zero")</code>.'], s: 'def dividir(a, b):\n    if b == 0:\n        raise ValueError("Divisão por zero")\n    return a / b', tests: [{ c: 'try:\n    print(dividir(10, 2))\n    print(dividir(1, 0))\nexcept ValueError as e:\n    print("Erro:", e)' }], x: '<p>O <code>raise</code> interrompe a função e entrega o erro a quem a chamou. O teste chama a função dentro de um <code>try/except</code> que mostra a mensagem que você escreveu.</p>' },
    { id: 'm10-11', lvl: 3, t: 'Estoque com KeyError', q: '<p>Peça um produto. Use <code>try/except KeyError</code>: se existir, mostre <code>arroz: 10 unidades</code>; senão, <code>Produto não encontrado</code>.</p>', start: 'estoque = {"arroz": 10, "feijão": 5}\nproduto = input("Produto: ")\n', h: ['Dentro do try: <code>print(f"{produto}: {estoque[produto]} unidades")</code>.'], s: 'estoque = {"arroz": 10, "feijão": 5}\nproduto = input("Produto: ")\n\ntry:\n    print(f"{produto}: {estoque[produto]} unidades")\nexcept KeyError:\n    print("Produto não encontrado")', tests: [{ i: ['arroz'] }, { i: ['feijão'] }, { i: ['suco'] }], x: '<p>Pedir uma chave que não existe dispara <i>KeyError</i>, capturado pelo <code>except</code>. Seria possível resolver com <code>in</code> ou <code>.get()</code> — ambos os caminhos estão corretos.</p>' },
    { id: 'm10-12', lvl: 3, t: 'Somando só o que vale', q: '<p>Peça <b>3 valores</b> (um por vez). Some apenas os que forem inteiros válidos e <b>ignore</b> os inválidos (sem mostrar nada). No final, mostre <code>Soma: 15</code> (por exemplo).</p>', h: ['Um <code>for</code> com <code>range(3)</code> e um <code>try</code> dentro dele.', 'No <code>except ValueError:</code>, use <code>pass</code> (não fazer nada).'], s: 'soma = 0\nfor i in range(3):\n    texto = input("Valor: ")\n    try:\n        soma = soma + int(texto)\n    except ValueError:\n        pass\nprint(f"Soma: {soma}")', tests: [{ i: ['10', 'abc', '5'] }, { i: ['x', 'y', 'z'] }, { i: ['1', '2', '3'] }], x: '<p>O <code>pass</code> diz “ignorar de propósito”. Aqui é exatamente o comportamento desejado. O <code>try</code> fica <b>dentro</b> do laço, para um valor ruim não interromper os outros.</p>' },
    { id: 'm10-13', lvl: 3, t: 'Um único except para dois erros', q: '<p>Crie <code>somar_textos(a, b)</code>: tenta converter <code>a</code> e <code>b</code> para inteiro e somar. Se dor <b>qualquer</b> erro na conversão (texto inválido, ou algo que nem é texto), devolva <code>None</code> — use um único <code>except</code> com uma <b>tupla</b> de dois tipos de erro: <code>ValueError</code> e <code>TypeError</code>.</p>', start: 'def somar_textos(a, b):\n    pass\n', h: ['<code>except (ValueError, TypeError):</code> pega os dois tipos de erro numa linha só.', 'Dentro do <code>try</code>: <code>return int(a) + int(b)</code>.'], s: 'def somar_textos(a, b):\n    try:\n        return int(a) + int(b)\n    except (ValueError, TypeError):\n        return None', tests: [{ c: 'print(somar_textos("3", "4"))' }, { c: 'print(somar_textos("abc", "4"))' }, { c: 'print(somar_textos(None, "4"))' }], x: '<p>Como os dois tipos de erro levam à <b>mesma</b> resposta (devolver <code>None</code>), agrupá-los numa tupla evita repetir o mesmo <code>return None</code> em dois blocos <code>except</code> separados.</p>' },
    { id: 'm10-p1', lvl: 4, proj: true, t: 'Projeto 1 — Calculadora à prova de erros', q: '<p>Peça <b>dois números</b> (decimais) e a <b>operação</b> (<code>+</code>, <code>-</code>, <code>*</code> ou <code>/</code>). Mostre <code>Resultado: 14.0</code> (para 10 + 4). Trate:</p><ul><li>número inválido → <code>Número inválido</code></li><li>divisão por zero → <code>Não é possível dividir por zero</code></li><li>outra operação → <code>Operação inválida</code></li></ul>', plan: ['Quais linhas podem falhar? (as conversões com <code>float</code>)', 'A divisão por zero acontece na conta: também fica no <code>try</code>.', 'Qual erro cada <code>except</code> pega? (<code>ValueError</code> e <code>ZeroDivisionError</code>)'], h: ['Coloque as leituras <b>e</b> as contas dentro do mesmo <code>try</code>; decida a operação com <code>if / elif / else</code>.', 'Dois <code>except</code>: <code>ValueError</code> e <code>ZeroDivisionError</code>.'], s: 'try:\n    n1 = float(input("Primeiro número: "))\n    n2 = float(input("Segundo número: "))\n    op = input("Operação (+, -, *, /): ")\n    if op == "+":\n        print(f"Resultado: {n1 + n2}")\n    elif op == "-":\n        print(f"Resultado: {n1 - n2}")\n    elif op == "*":\n        print(f"Resultado: {n1 * n2}")\n    elif op == "/":\n        print(f"Resultado: {n1 / n2}")\n    else:\n        print("Operação inválida")\nexcept ValueError:\n    print("Número inválido")\nexcept ZeroDivisionError:\n    print("Não é possível dividir por zero")', tests: [{ i: ['10', '4', '+'] }, { i: ['10', '4', '/'] }, { i: ['10', '0', '/'] }, { i: ['abc', '4', '+'] }, { i: ['10', '4', 'x'] }], x: '<p>Comparando com a calculadora do módulo 4: lá usamos um <code>if n2 == 0</code> para prever a divisão por zero; aqui deixamos o Python avisar e tratamos o erro. Ambos funcionam — o <code>try/except</code> também protege contra o texto inválido, que o <code>if</code> não pegaria.</p>' },
    { id: 'm10-p2', lvl: 4, proj: true, t: 'Projeto 2 — Cadastro à prova de erros', q: '<p>Peça o <b>nome</b>. Depois peça a <b>idade</b> até receber um inteiro entre <b>0 e 120</b>. Para qualquer entrada inválida (letras ou fora do intervalo), mostre <code>Idade inválida</code> e pergunte de novo. No fim: <code>Bia tem 30 anos</code>.</p>', plan: ['Um laço que só termina com idade válida.', 'Duas causas de erro: não é número (<code>ValueError</code>) e fora do intervalo (um <code>if</code>).', 'Quando a idade for válida, saia do laço.'], h: ['<code>while True:</code> com <code>try</code>: converta e, se estiver fora do intervalo, mostre o aviso; senão <code>break</code>.', 'O <code>except ValueError</code> mostra o mesmo aviso.'], s: 'nome = input("Nome: ")\nwhile True:\n    try:\n        idade = int(input("Idade: "))\n        if idade < 0 or idade > 120:\n            print("Idade inválida")\n        else:\n            break\n    except ValueError:\n        print("Idade inválida")\nprint(f"{nome} tem {idade} anos")', tests: [{ i: ['Ana', '25'] }, { i: ['Bia', 'abc', '-3', '200', '30'] }], x: '<p>Juntamos <code>while</code>, <code>try/except</code>, <code>if</code> com <code>or</code> e <code>break</code>. O programa só avança quando a entrada estiver 100% válida — é assim que formulários de verdade se comportam.</p>' },
    { id: 'm10-p3', lvl: 4, proj: true, t: 'Projeto 3 — Média segura', q: '<p>Crie <code>media_segura(valores)</code>. Ela recebe uma <b>lista de textos</b> (como <code>["8", "abc", "6"]</code>), converte cada um para <code>float</code>, <b>ignora</b> os inválidos e devolve a média dos válidos. Se nenhum for válido, devolve <code>0</code>.</p>', plan: ['Uma lista vazia para guardar os números válidos.', 'Percorra os textos; tente converter cada um (<code>try</code> dentro do <code>for</code>).', 'Se a lista ficou vazia, devolva 0; senão, a média.'], start: 'def media_segura(valores):\n    pass\n', h: ['<code>numeros = []</code>; no try: <code>numeros.append(float(v))</code>; no except: <code>pass</code>.', 'Depois: <code>if len(numeros) == 0: return 0</code> e <code>return sum(numeros) / len(numeros)</code>.'], s: 'def media_segura(valores):\n    numeros = []\n    for v in valores:\n        try:\n            numeros.append(float(v))\n        except ValueError:\n            pass\n    if len(numeros) == 0:\n        return 0\n    return sum(numeros) / len(numeros)', tests: [{ c: 'print(media_segura(["8", "abc", "6"]))' }, { c: 'print(media_segura(["x"]))' }, { c: 'print(media_segura(["10", "10"]))' }, { c: 'print(media_segura([]))' }], x: '<p>Listas, laços, funções e <code>try/except</code> juntos. A checagem do “lista vazia” evita uma divisão por zero — um erro que a gente previne com <code>if</code> porque dá para prever.</p>' },
    { id: 'm10-b1', lvl: 2, bug: true, k: 'mc', t: 'Except sem dois-pontos', q: '<p>O Python recusa o código. Por quê?</p>', code: 'try:\n    n = int("5")\nexcept ValueError\n    print("erro")', o: ['Falta o <b>dois-pontos</b> no fim da linha do <code>except</code>', 'O <code>int</code> está errado', 'Falta o <code>else</code>', 'O <code>print</code> precisa de f-string'], a: 0, h: ['Todo cabeçalho de bloco termina do mesmo jeito.'], x: '<p>O <code>except</code> é um cabeçalho de bloco, como <code>if</code> e <code>def</code>: precisa terminar com <code>:</code>.</p>', fix: 'try:\n    n = int("5")\nexcept ValueError:\n    print("erro")' },
    { id: 'm10-b2', lvl: 2, bug: true, k: 'mc', t: 'Try sem except', q: '<p>Qual é o problema deste código?</p>', code: 'try:\n    numero = int(input("Número: "))\nprint("Fim")', i: ['5'], o: ['Todo <code>try</code> precisa de um <code>except</code> (ou <code>finally</code>) logo depois', 'O <code>input</code> não pode ficar dentro do try', 'Falta <code>return</code>', 'O <code>print</code> deveria estar recuado'], a: 0, h: ['O try é a rede — mas cadê a rede?'], x: '<p><i>SyntaxError: expected \'except\' or \'finally\' block</i>. O <code>try</code> sozinho não faz sentido: ele precisa dizer o que fazer se der erro.</p>', fix: 'try:\n    numero = int(input("Número: "))\nexcept ValueError:\n    print("Valor inválido")\nprint("Fim")', fi: ['5'] },
    { id: 'm10-b3', lvl: 3, bug: true, k: 'mc', t: 'O except que não pega', q: '<p>Mesmo com try/except, o programa quebra quando a pessoa digita <code>abc</code>. Por quê?</p>', code: 'try:\n    n = int(input("Número: "))\nexcept ZeroDivisionError:\n    print("Divisão por zero")', i: ['abc'], o: ['O erro gerado é <code>ValueError</code>, mas o <code>except</code> só captura <code>ZeroDivisionError</code>', 'O <code>try</code> não pode conter <code>input</code>', 'Falta o <code>else</code>', 'A mensagem está errada'], a: 0, h: ['Qual erro o <code>int("abc")</code> dispara? E qual o <code>except</code> espera?'], x: '<p>O <code>except</code> só entra em ação para o tipo de erro que nomeia. Como o erro é <i>ValueError</i>, ele passa direto e o programa quebra.</p>', fix: 'try:\n    n = int(input("Número: "))\nexcept ValueError:\n    print("Valor inválido")', fi: ['abc'] },
    { id: 'm10-b4', lvl: 3, bug: true, k: 'mc', t: 'O except vazio que esconde tudo', q: '<p>O programa mostra “Deu erro”, mas você não sabe por quê. Qual é a causa real e o que está atrapalhando?</p>', code: 'try:\n    print(idade)\nexcept:\n    print("Deu erro")', o: ['A variável <code>idade</code> nunca foi criada, e o <code>except</code> vazio captura <b>qualquer</b> erro e esconde o problema', 'O <code>print</code> não funciona dentro de try', 'O except deveria estar antes do try', 'Falta um <code>finally</code>'], a: 0, h: ['Tire o try/except e veja qual erro aparece.'], x: '<p>O <code>except:</code> sem tipo captura tudo — inclusive <i>NameError</i> por um bug seu. O programa “não quebra”, mas você nunca descobre o defeito. Nomeie sempre o erro esperado.</p>', fix: 'idade = 20\ntry:\n    print(idade)\nexcept ValueError:\n    print("Valor inválido")' },
    { id: 'm10-b5', lvl: 3, bug: true, k: 'mc', t: 'A linha arriscada fora do try', q: '<p>Existe um try/except, mas o programa quebra com ZeroDivisionError. Por quê?</p>', code: 'a = 10\nb = 0\ntry:\n    print("Dividindo...")\nexcept ZeroDivisionError:\n    print("Erro")\nprint(a / b)', o: ['A divisão <b>está fora</b> do <code>try</code>: só o que fica dentro dele é protegido', 'O except está no lugar errado', 'Faltou um else', 'O tipo do erro está errado'], a: 0, h: ['Em qual linha a divisão acontece? Ela está dentro do try?'], x: '<p>A rede só protege o que está dentro do <code>try</code>. A divisão ficou na última linha, sem proteção. Mova <code>print(a / b)</code> para dentro do <code>try</code>.</p>', fix: 'a = 10\nb = 0\ntry:\n    print(a / b)\nexcept ZeroDivisionError:\n    print("Erro")' },
    { id: 'm10-b6', lvl: 3, bug: true, k: 'mc', t: 'O nome do erro trocado', q: '<p>Dentro do <code>except</code> aparece um <i>NameError</i>. Por quê?</p>', code: 'try:\n    n = int("abc")\nexcept ValueError as e:\n    print("Erro:", erro)', o: ['Foi criada a variável <code>e</code> (<code>as e</code>) mas o print usa <code>erro</code>', 'O <code>as</code> não pode ser usado com ValueError', 'O texto “abc” é válido', 'O print precisa de f-string'], a: 0, h: ['Compare o nome depois do <code>as</code> com o nome usado no print.'], x: '<p>O nome depois do <code>as</code> é o nome da variável do erro. Usar outro nome dá <i>NameError</i>. (Repare: o próprio erro aconteceu dentro do <code>except</code>, e ninguém o captura.)</p>', fix: 'try:\n    n = int("abc")\nexcept ValueError as e:\n    print("Erro:", e)' },
  ],
  projTitle: '🎯 Projetos à prova de erros', projSub: 'Programas de verdade nunca quebram por causa do que o usuário digita. Vamos construir alguns assim.',
  quiz: [
    { q: 'Para que serve o <code>try / except</code>?', o: ['Para deixar o programa mais rápido', 'Para capturar um erro e decidir o que fazer, sem o programa quebrar', 'Para criar variáveis', 'Para repetir código'], a: 1, x: 'O <code>try</code> tenta executar o código arriscado e o <code>except</code> trata o erro se ele acontecer.' },
    { q: 'O que acontece com as linhas restantes do <code>try</code> depois que um erro ocorre?', o: ['Continuam executando', 'São <b>puladas</b>; o Python vai para o except', 'São executadas duas vezes', 'O programa termina sempre'], a: 1, x: 'Assim que um erro acontece, o Python abandona o resto do bloco do try e procura o except correspondente.' },
    { q: 'Qual erro é gerado por <code>10 / 0</code>?', o: ['<code>ValueError</code>', '<code>TypeError</code>', '<code>ZeroDivisionError</code>', '<code>KeyError</code>'], a: 2, x: 'Dividir por zero gera <code>ZeroDivisionError</code>.' },
    { q: 'Quando o bloco <code>finally</code> é executado?', o: ['Só quando há erro', 'Só quando não há erro', 'Sempre', 'Nunca'], a: 2, x: 'O <code>finally</code> roda sempre, com ou sem erro. O <code>else</code> é que roda só se não houve erro.' },
    { q: 'Qual é a melhor prática?', o: ['<code>except:</code> sem tipo, para pegar tudo', '<code>except ValueError:</code>, nomeando o erro esperado', 'Nunca usar try', 'Colocar o programa inteiro dentro do try'], a: 1, x: 'Nomear o erro esperado evita esconder bugs inesperados. E o try deve conter só as linhas que podem falhar.' },
    { q: 'O que faz <code>raise ValueError("dado inválido")</code>?', o: ['Captura um erro', 'Dispara um erro de propósito, com essa mensagem', 'Ignora um erro', 'Cria uma variável'], a: 1, x: '<code>raise</code> é o contrário do except: em vez de tratar um erro, ele o <b>cria</b>.' },
    { q: 'Qual erro <b>não</b> pode ser tratado com try/except?', o: ['<code>ValueError</code>', '<code>KeyError</code>', 'Erro de sintaxe (ex.: faltou <code>:</code>)', '<code>ZeroDivisionError</code>'], a: 2, x: 'Erros de sintaxe são detectados antes de o programa começar a rodar; por isso o try/except nem chega a existir.' },
    { q: 'O que faz <code>except (ValueError, TypeError):</code>?', o: ['Só funciona se os dois erros acontecerem ao mesmo tempo', 'Captura <b>qualquer um</b> dos dois tipos de erro listados, com o mesmo tratamento', 'É um erro de sintaxe: except só aceita um tipo', 'Cria uma nova exceção chamada ValueError-TypeError'], a: 1, x: 'Colocar os tipos entre parênteses cria uma tupla; o except captura o erro se ele for de <b>qualquer um</b> dos tipos listados.' },
  ],
});;

/* ===================================================================
   Módulo 11: Recursão

MODS.push({
  id: 'm11', icon: '🪆', title: 'Recursão', sub: 'Funções que chamam a si mesmas',
  lead: 'Até agora, uma função resolvia um problema chamando outras funções ou usando laços. Recursão é uma terceira ferramenta: uma função que resolve um problema chamando <b>a si mesma</b>, numa versão menor do mesmo problema — até chegar a um caso simples o bastante para responder direto.',
  blocks: [
    H2('A analogia da boneca russa'),
    TIP('Matryoshka', ['Uma boneca russa (matryoshka) tem uma boneca menor dentro, que tem outra boneca menor dentro, e assim por diante — <b>até chegar numa boneca sólida</b>, que não abre mais. Essa última é o que faz a sequência <b>parar</b>.', 'Uma função recursiva funciona igual: ela chama uma versão “menor” de si mesma, até chegar num caso simples o bastante para responder sem chamar ninguém — o <b>caso base</b>.']),
    H2('O caso base: o que faz a recursão parar'),
    P('Toda função recursiva precisa de duas partes: o <b>caso base</b> (a versão mais simples do problema, que a função sabe responder direto, sem se chamar de novo) e o <b>caso recursivo</b> (a função se chama com uma versão menor do problema, mais perto do caso base).'),
    CODE('O clássico exemplo do fatorial: <code>5! = 5 × 4 × 3 × 2 × 1</code>', 'def fatorial(n):\n    if n <= 1:\n        return 1          # caso base\n    return n * fatorial(n - 1)  # caso recursivo\n\nprint(fatorial(5))', {
      lines: [[2, 'Caso base: fatorial de 0 ou 1 é 1, e a função sabe disso <b>sem</b> chamar a si mesma.'], [3, 'Caso recursivo: <code>fatorial(5)</code> é <code>5 × fatorial(4)</code>, que é <code>5 × 4 × fatorial(3)</code>, e por aí vai, até chegar em <code>fatorial(1)</code>.']],
      why: 'Cada chamada empilha uma "espera": <code>fatorial(5)</code> fica esperando o resultado de <code>fatorial(4)</code>, que espera <code>fatorial(3)</code>… Quando o caso base responde, as respostas voltam multiplicando, uma por uma, até chegar na primeira chamada.',
      wi: [['Chamar <code>fatorial(0)</code>', 'Cai direto no caso base: devolve 1.'], ['Trocar <code>n &lt;= 1</code> por <code>n == 0</code>', 'Ainda funciona para números positivos — mas é mais frágil: um <code>n</code> negativo nunca bateria exatamente em 0.']],
    }),
    WARN('Sem caso base, é um laço infinito disfarçado', 'Se a função sempre se chama de novo e nunca "bate" no caso base, ela nunca para — só que em vez de travar o programa como um <code>while True</code> sem <code>break</code>, o Python literalmente fica sem espaço de memória para lembrar de todas as chamadas pendentes, e dispara <i>RecursionError: maximum recursion depth exceeded</i>.'),
    H2('Recursão com listas'),
    CODE('A mesma ideia funciona pra percorrer uma lista, sem usar <code>for</code>:', 'def soma_lista(lista):\n    if len(lista) == 0:\n        return 0                          # caso base: lista vazia soma 0\n    return lista[0] + soma_lista(lista[1:])  # primeiro item + soma do resto', {
      lines: [[2, 'Caso base: uma lista vazia não tem nada para somar.'], [3, 'Caso recursivo: soma o primeiro item com a soma de "todo o resto" — uma lista uma posição menor.']],
      why: '<code>lista[1:]</code> é uma <b>fatia</b> (slice): todos os itens a partir da posição 1. Cada chamada recebe uma lista cada vez menor, até sobrar uma lista vazia — o caso base.',
    }),
    H2('Recursão ou laço: quando usar qual'),
    TBL(['Situação', 'Prefira'], [
      ['O problema tem naturalmente uma versão "menor de si mesmo" (uma árvore de pastas, uma boneca russa, dividir ao meio)', 'Recursão'],
      ['Repetir uma ação um número conhecido de vezes, ou até uma condição simples mudar', '<code>for</code> / <code>while</code>'],
      ['Performance é crítica e o problema é simples', '<code>for</code> / <code>while</code> (recursão gasta mais memória, uma "espera" empilhada por chamada)'],
    ]),
    NOTE('Nem sempre é a ferramenta certa', 'Tudo que dá para fazer com recursão também dá para fazer com um laço (e vice-versa). Recursão brilha quando o próprio problema já é "recursivo" por natureza — forçar recursão em tudo deixa o código mais difícil de ler, não mais elegante.'),
  ],
  ex: [
    { id: 'm11-1', lvl: 1, k: 'pr', t: 'Contagem regressiva recursiva', q: '<p>O que aparece na tela?</p>', code: 'def regressiva(n):\n    if n == 0:\n        print("Lançar!")\n        return\n    print(n)\n    regressiva(n - 1)\n\nregressiva(3)', h: ['Siga uma chamada de cada vez: <code>regressiva(3)</code> imprime 3 e chama <code>regressiva(2)</code>...', 'Só imprime "Lançar!" quando <code>n</code> chegar a exatamente 0.'], x: '<p><code>regressiva(3)</code> mostra 3 e chama <code>regressiva(2)</code>, que mostra 2 e chama <code>regressiva(1)</code>, que mostra 1 e chama <code>regressiva(0)</code> — o caso base, que mostra "Lançar!" e <b>não</b> chama a si mesma de novo (o <code>return</code> encerra ali).</p>' },
    { id: 'm11-2', lvl: 1, k: 'mc', t: 'Pra que serve o caso base?', q: '<p>Qual é o papel do caso base numa função recursiva?</p>', o: ['Deixar a função mais rápida', 'Dar à função uma forma de responder <b>sem</b> chamar a si mesma de novo, fazendo a recursão parar', 'Guardar o resultado em uma variável global', 'Evitar que a função receba argumentos'], a: 1, h: ['Pense na boneca sólida, a última da matryoshka.'], x: '<p>O caso base é a condição simples o bastante para a função responder direto. Sem ele — ou se ele nunca for alcançado — a função se chamaria para sempre, até estourar com <i>RecursionError</i>.</p>' },
    { id: 'm11-3', lvl: 2, t: 'Potência recursiva', q: '<p>Crie <code>potencia(base, expoente)</code> que calcula <code>base</code> elevado a <code>expoente</code> (um inteiro ≥ 0) <b>usando recursão</b> (não use o operador <code>**</code>). Ex.: <code>potencia(2, 3)</code> devolve 8.</p>', start: 'def potencia(base, expoente):\n    # caso base: expoente 0 -> resultado 1\n    # caso recursivo: base vezes potencia(base, expoente - 1)\n    pass\n', h: ['Caso base: <code>if expoente == 0: return 1</code>.', 'Caso recursivo: <code>return base * potencia(base, expoente - 1)</code>.'], s: 'def potencia(base, expoente):\n    if expoente == 0:\n        return 1\n    return base * potencia(base, expoente - 1)', tests: [{ c: 'print(potencia(2, 3))' }, { c: 'print(potencia(5, 0))' }, { c: 'print(potencia(3, 4))' }], x: '<p>Elevar <code>base</code> a <code>expoente</code> é multiplicar <code>base</code> por ela mesma <code>expoente</code> vezes. A cada chamada, o expoente diminui 1, até chegar em 0 — o caso base, onde qualquer número elevado a 0 é 1.</p>' },
    { id: 'm11-4', lvl: 2, t: 'Soma de 1 até N, recursiva', q: '<p>Crie <code>soma_ate(n)</code> que devolve a soma de todos os inteiros de 1 até <code>n</code>, usando recursão (sem <code>for</code>/<code>while</code>). Ex.: <code>soma_ate(5)</code> devolve 15.</p>', start: 'def soma_ate(n):\n    pass\n', h: ['Caso base: <code>soma_ate(1)</code> (ou <code>0</code>) é o próprio número.', 'Caso recursivo: <code>n + soma_ate(n - 1)</code>.'], s: 'def soma_ate(n):\n    if n <= 1:\n        return n\n    return n + soma_ate(n - 1)', tests: [{ c: 'print(soma_ate(5))' }, { c: 'print(soma_ate(1))' }, { c: 'print(soma_ate(10))' }], x: '<p><code>soma_ate(5)</code> é <code>5 + soma_ate(4)</code>, que é <code>5 + 4 + soma_ate(3)</code>… até <code>soma_ate(1)</code>, que devolve 1 direto. As somas "voltam" empilhadas: 1, depois +2, +3, +4, +5.</p>' },
    { id: 'm11-5', lvl: 3, t: 'Somando uma lista sem for', q: '<p>Crie <code>soma_lista(lista)</code> que devolve a soma de todos os números de uma lista, usando recursão (sem <code>for</code>/<code>while</code>/<code>sum</code>). Ex.: <code>soma_lista([1, 2, 3, 4, 5])</code> devolve 15.</p>', start: 'def soma_lista(lista):\n    pass\n', h: ['Caso base: lista vazia (<code>len(lista) == 0</code>) soma 0.', 'Caso recursivo: <code>lista[0] + soma_lista(lista[1:])</code> — o primeiro item mais a soma do resto.'], s: 'def soma_lista(lista):\n    if len(lista) == 0:\n        return 0\n    return lista[0] + soma_lista(lista[1:])', tests: [{ c: 'print(soma_lista([1, 2, 3, 4, 5]))' }, { c: 'print(soma_lista([]))' }, { c: 'print(soma_lista([10]))' }, { c: 'print(soma_lista([2, 2, 2]))' }], x: '<p><code>lista[1:]</code> é uma fatia com todos os itens menos o primeiro — uma lista uma posição menor a cada chamada, até sobrar uma lista vazia, o caso base.</p>' },
    { id: 'm11-6', lvl: 3, k: 'pr', t: 'Fibonacci recursivo', q: '<p>A sequência de Fibonacci: cada número é a soma dos dois anteriores (começando em 0 e 1). O que aparece na tela? (8 linhas)</p>', code: 'def fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nfor i in range(8):\n    print(fib(i))', h: ['<code>fib(0)</code> é 0 e <code>fib(1)</code> é 1 — os dois casos base.', 'A partir daí, cada <code>fib(n)</code> é a soma dos dois fibonaccis anteriores: 0, 1, 1, 2, 3, 5, 8, 13.'], x: '<p>A sequência é 0, 1, 1, 2, 3, 5, 8, 13. Repare que <code>fib</code> tem <b>dois</b> casos base (<code>n == 0</code> e <code>n == 1</code>) e faz <b>duas</b> chamadas recursivas — por isso fica lento para números grandes: o mesmo <code>fib(n)</code> pequeno acaba sendo recalculado várias vezes.</p>' },
    { id: 'm11-7', lvl: 4, proj: true, t: 'Desafio: busca binária recursiva', q: '<p>Você já usa recursão pra percorrer listas — agora use pra <b>buscar</b> nelas. Crie <code>busca_binaria(lista, alvo, baixo, alto)</code> numa lista <b>ordenada</b>: devolve a posição de <code>alvo</code>, ou <code>-1</code> se não existir. <code>baixo</code> e <code>alto</code> são os limites da busca (comece com <code>0</code> e <code>len(lista) - 1</code>).</p>', plan: ['Caso base 1: se <code>baixo &gt; alto</code>, a faixa de busca "fechou" sem achar — devolva -1.', 'Ache o meio: <code>meio = (baixo + alto) // 2</code>.', 'Se <code>lista[meio]</code> é o alvo, achou. Senão, chame a função de novo só na metade certa (esquerda ou direita).'], start: 'def busca_binaria(lista, alvo, baixo, alto):\n    pass\n', h: ['<code>if baixo &gt; alto: return -1</code> é o caso base "não achou".', 'Se <code>lista[meio] &lt; alvo</code>, o alvo está à direita: chame de novo com <code>baixo = meio + 1</code>. Senão, à esquerda: <code>alto = meio - 1</code>.'], s: 'def busca_binaria(lista, alvo, baixo, alto):\n    if baixo > alto:\n        return -1\n    meio = (baixo + alto) // 2\n    if lista[meio] == alvo:\n        return meio\n    elif lista[meio] < alvo:\n        return busca_binaria(lista, alvo, meio + 1, alto)\n    else:\n        return busca_binaria(lista, alvo, baixo, meio - 1)', tests: [{ c: 'ordenada = [1, 3, 5, 7, 9, 11, 13]\nprint(busca_binaria(ordenada, 7, 0, len(ordenada) - 1))' }, { c: 'ordenada = [1, 3, 5, 7, 9, 11, 13]\nprint(busca_binaria(ordenada, 4, 0, len(ordenada) - 1))' }, { c: 'ordenada = [10]\nprint(busca_binaria(ordenada, 10, 0, 0))' }], x: '<p>A cada chamada, a faixa de busca (<code>baixo</code> a <code>alto</code>) fica <b>pela metade</b> — por isso "busca binária". Se a faixa fechar (<code>baixo &gt; alto</code>) sem bater no alvo, ele não está na lista.</p>' },
    { id: 'm11-b1', lvl: 3, bug: true, k: 'mc', norun: true, t: 'A recursão que nunca para', q: '<p>Este código deveria contar de 1 em diante mas trava o navegador e dispara <i>RecursionError</i>. Por quê?</p>', code: 'def contar(n):\n    print(n)\n    contar(n + 1)\n\ncontar(1)', o: ['Falta um <b>caso base</b>: nenhuma condição faz a função parar de chamar a si mesma', 'O <code>print</code> deveria vir depois do <code>contar(n + 1)</code>', 'Falta <code>return</code> na primeira linha', 'O nome da função não pode ser <code>contar</code>'], a: 0, h: ['Compare com o exemplo do fatorial: o que ele tem que este código não tem?'], x: '<p>Toda função recursiva precisa de uma condição que a faça parar de se chamar. Aqui, <code>contar</code> sempre se chama de novo, para sempre — até o Python não aguentar mais empilhar chamadas e avisar com <i>RecursionError: maximum recursion depth exceeded</i>. (Não rodamos este código aqui: ele imprimiria centenas de linhas antes de travar!)</p>', fix: 'def contar(n, limite):\n    if n > limite:\n        return\n    print(n)\n    contar(n + 1, limite)\n\ncontar(1, 5)' },
    { id: 'm11-b2', lvl: 3, bug: true, k: 'mc', norun: true, t: 'O caso base que nunca é alcançado', q: '<p>Esta função <b>tem</b> um caso base (<code>n &gt; 5</code>), mas ainda assim dispara <i>RecursionError</i>. Por quê?</p>', code: 'def contar(n):\n    if n > 5:\n        return\n    print(n)\n    contar(n)\n\ncontar(1)', o: ['A chamada recursiva é <code>contar(n)</code>, sempre com o <b>mesmo</b> <code>n</code> — ele nunca cresce, então nunca passa de 5', 'O <code>if</code> deveria vir depois do <code>print</code>', 'Falta um <code>else</code>', 'O caso base deveria ser <code>n == 5</code>'], a: 0, h: ['Ter um caso base não basta: a chamada recursiva também precisa <b>caminhar em direção</b> a ele.'], x: '<p>Ter um caso base não é suficiente — a chamada recursiva precisa se aproximar dele a cada vez. Aqui, <code>contar(n)</code> chama a si mesma sempre com o <b>mesmo</b> valor de <code>n</code> (esqueceram o <code>+ 1</code>), então <code>n</code> nunca ultrapassa 5 e o caso base nunca é alcançado.</p>', fix: 'def contar(n):\n    if n > 5:\n        return\n    print(n)\n    contar(n + 1)\n\ncontar(1)' },

  quiz: [

/* Embaralha a posição da alternativa correta de forma DETERMINÍSTICA (mesma ordem sempre;
   assim o progresso salvo continua valendo e a resposta certa não fica sempre na mesma letra). */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function placeCorrect(o, a, seed) {
  const pos = hashStr(seed) % o.length, right = o[a], rest = o.filter((_, i) => i !== a);
  rest.splice(pos, 0, right); return { o: rest, a: pos };
}
MODS.forEach(m => {
  m.ex.forEach(e => { if (e.k === 'mc') { const r = placeCorrect(e.o, e.a, e.id); e.o = r.o; e.a = r.a; } });
  m.quiz.forEach((q, i) => { const r = placeCorrect(q.o, q.a, m.id + ':' + i); q.o = r.o; q.a = r.a; });
});

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const STORE_KEY = 'python-do-zero-v1';

}

/* ---------- Pontuação, níveis e estatísticas ---------- */
const PTS = { 1: 10, 2: 15, 3: 20, 4: 30 };
const QPTS = 5;
const LVL_EMOJI = { 1: '🟢', 2: '🟡', 3: '🟠', 4: '🔴' };
const LVL_NAME = { 1: 'Nível 1 — Muito fácil', 2: 'Nível 2 — Fácil', 3: 'Nível 3 — Intermediário', 4: 'Desafio' };
const LEVELS = [
  { n: 'Semente', e: '🌱', p: 0 }, { n: 'Curioso(a)', e: '🐣', p: .04 }, { n: 'Aprendiz', e: '🐍', p: .12 },
  { n: 'Programador(a) Júnior', e: '💻', p: .28 }, { n: 'Lógica Afiada', e: '🧠', p: .5 },
  { n: 'Pythonista', e: '🚀', p: .75 }, { n: 'Mestre do Código', e: '🏆', p: .92 },
];
const exState = id => S.ex[id] || (S.ex[id] = { s: 'new', h: 0, a: 0, w: 0, sv: false, pts: 0, code: null });
const isDone = id => { const s = S.ex[id]; return !!s && (s.s === 'ok' || s.s === 'seen'); };
function award(key, pts) { if (S.aw[key] === undefined) { S.aw[key] = pts; return pts; } return 0; }
function exPoints(ex) {
  const s = exState(ex.id);
  if (s.sv) return 0;
  const base = PTS[ex.lvl];
  let p = base - 2 * s.h;
  if (ex.k === 'mc' && s.w > 0) p = Math.round(p / 2);
  return Math.max(Math.round(base / 2), p);
}
function modStats(m) {
  let total = m.ex.length + m.quiz.length, done = 0, ok = 0;
  m.ex.forEach(e => { const s = S.ex[e.id]; if (s && (s.s === 'ok' || s.s === 'seen')) done++; if (s && s.s === 'ok') ok++; });
  const q = S.qz[m.id] || {}; let qc = 0;
  Object.keys(q).forEach(i => { done++; if (q[i] === m.quiz[i].a) { qc++; } });
  return { total, done, ok, qc, qa: Object.keys(q).length, pct: total ? Math.round(done / total * 100) : 0 };
}
function stats() {
  const t = { total: 0, done: 0, correct: 0, exTotal: 0, exDone: 0, points: 0, max: 0 };
  MODS.forEach(m => {
    const s = modStats(m);
    t.total += s.total; t.done += s.done; t.correct += s.ok + s.qc; t.exTotal += m.ex.length; t.exDone += m.ex.filter(e => isDone(e.id)).length;
    m.ex.forEach(e => { t.max += PTS[e.lvl]; }); t.max += m.quiz.length * QPTS;
  });
  t.points = Object.values(S.aw).reduce((a, b) => a + b, 0);
  t.pct = t.total ? Math.round(t.done / t.total * 100) : 0;
  return t;
}
function levelInfo(st) {
  let cur = 0;
  LEVELS.forEach((l, i) => { if (st.points >= Math.round(l.p * st.max)) cur = i; });
  const nx = LEVELS[cur + 1];
  const from = Math.round(LEVELS[cur].p * st.max), to = nx ? Math.round(nx.p * st.max) : from;
  return { cur: LEVELS[cur], next: nx, pct: nx ? Math.min(100, Math.round((st.points - from) / (to - from) * 100)) : 100, need: nx ? to - st.points : 0 };
}
const modOf = id => MODS.find(m => m.id === id);
const modDone = id => { const m = modOf(id); return modStats(m).done === modStats(m).total; };
const BADGES = [
  { id: 'first', e: '🚀', n: 'Primeiro passo', d: 'Concluiu o primeiro exercício.', f: () => stats().exDone >= 1 },
  { id: 'bugs', e: '🐛', n: 'Caçador de bugs', d: 'Acertou 5 exercícios “Encontre o erro”.', f: () => MODS.flatMap(m => m.ex).filter(e => e.bug && (S.ex[e.id] || {}).s === 'ok').length >= 5 },
  { id: 'nohint', e: '💡', n: 'Sem colinha', d: 'Resolveu 5 exercícios sem usar dicas.', f: () => Object.values(S.ex).filter(s => s.s === 'ok' && s.h === 0 && !s.sv).length >= 5 },

/* ---------- Realce de sintaxe (cores do código Python) ---------- */
const KWS = new Set('and as break continue def del elif else except finally for if in is not or pass raise return try while True False None'.split(' '));
const BIS = new Set('print input int float str bool len range type round abs min max sum sorted list dict repr Exception ValueError TypeError ZeroDivisionError KeyError IndexError NameError'.split(' '));
function hlLine(line) {
  const re = /(#.*$)|([fF]?"(?:\\.|[^"\\])*"?|[fF]?'(?:\\.|[^'\\])*'?)|(\b\d+(?:\.\d+)?\b)|([\p{L}_][\p{L}\p{N}_]*)/gu;
  let out = '', last = 0, m, prev = '';
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) {
      let s = esc(m[2]);
      if (/^[fF]/.test(m[2])) s = s.replace(/\{[^}]*\}/g, x => `<span class="br">${x}</span>`);
      out += `<span class="s">${s}</span>`;
    } else if (m[3]) out += `<span class="n">${m[3]}</span>`;
    else {
      const w = m[4], call = line.slice(last).trimStart()[0] === '(';
      const cls = KWS.has(w) ? 'k' : prev === 'def' ? 'f' : BIS.has(w) ? 'bi' : call ? 'f' : '';
      out += cls ? `<span class="${cls}">${esc(w)}</span>` : esc(w);
      prev = w; continue;
    }
    prev = '';
  }
  return out + esc(line.slice(last));
}
function preCode(code) {
  const pre = document.createElement('pre'); pre.className = 'code';
  pre.innerHTML = code.replace(/\n+$/, '').split('\n').map(l => `<span class="ln">${hlLine(l) || ' '}</span>`).join('');
  return pre;
}
function bindEditor(ta) { // Tab = 4 espaços; Enter mantém o recuo
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    else if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
      const pos = ta.selectionStart, before = ta.value.slice(0, pos), ls = before.lastIndexOf('\n') + 1, line = before.slice(ls);
      const ind = (line.match(/^ */) || [''])[0], extra = /:\s*$/.test(line) ? '    ' : '';
      e.preventDefault(); ta.setRangeText('\n' + ind + extra, pos, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input'));
    }
  });
  ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocorrect', 'off'); ta.spellcheck = false;
}
function autoRows(ta, min = 5) { ta.rows = Math.max(min, ta.value.split('\n').length + 1); }

/* ---------- Mensagens de erro em português ---------- */
function explainError(e) {
  const m = e.msg || '', t = e.type;
  const P = (title, txt) => `<b>${title}</b> ${txt}`;
  if (t === 'Timeout') return P('Laço infinito?', 'O programa rodou por tempo demais. Em um <code>while</code>, algo dentro do laço precisa mudar a condição até ela virar False (por exemplo, somar 1 ao contador).');
  if (t === 'EOFError') return P('Faltou resposta.', 'Seu programa pediu mais <code>input()</code> do que o teste forneceu. Confira se você não chamou <code>input()</code> a mais.');
  if (t === 'RecursoNaoSuportado') return P('Recurso fora do mini-Python.', 'Este laboratório simplificado ainda não entende isso. Nos exercícios do curso você não precisa disso.');
  if (t === 'IndentationError') {
    if (/expected an indented block/.test(m)) return P('Faltou o recuo (indentação).', 'Depois de uma linha que termina com <code>:</code> (if, else, def, while, for), a linha seguinte precisa ter <b>4 espaços</b> a mais. É isso que diz “estas linhas pertencem ao bloco”.');
    if (/unexpected indent/.test(m)) return P('Espaços a mais.', 'Esta linha começa mais para a direita do que deveria. Só use recuo depois de uma linha que termina com <code>:</code>.');
    return P('Recuo inconsistente.', 'As linhas do mesmo bloco precisam ter exatamente o mesmo recuo.');
  }
  if (t === 'SyntaxError') {
    if (/expected ':'/.test(m)) return P('Falta o dois-pontos.', 'Linhas com <code>if</code>, <code>elif</code>, <code>else</code>, <code>while</code>, <code>for</code> e <code>def</code> precisam terminar com <code>:</code>. E <code>else</code> não leva condição.');
    if (/unterminated string/.test(m)) return P('Aspas abertas e não fechadas.', 'Todo texto começa e termina com aspas: <code>"assim"</code>.');
    if (/forgot a comma/.test(m)) return P('Faltou uma vírgula.', 'Em listas e dicionários, cada item é separado por vírgula: <code>{"a": 1, "b": 2}</code>.');
    if (/expected .except. or .finally./.test(m)) return P('try sem except.', 'Todo <code>try:</code> precisa de pelo menos um <code>except</code> (ou <code>finally</code>) logo depois.');
    if (/never closed/.test(m)) return P('Parêntese aberto e não fechado.', 'Para cada <code>(</code> precisa existir um <code>)</code>.');
    if (/Maybe you meant '=='/.test(m)) return P('Um só = guarda; dois == comparam.', 'Para perguntar “é igual?” dentro de um <code>if</code>, use <code>==</code>.');
    if (/invalid decimal literal/.test(m)) return P('Nome de variável começando com número.', 'Nomes não podem começar com número nem ter espaços. Use letras e <code>_</code>.');
    if (/Missing parentheses/.test(m)) return P('No Python 3, print usa parênteses.', 'Escreva <code>print("texto")</code>.');
    if (/invalid character/.test(m)) return P('Caractere estranho.', 'Provavelmente aspas “curvas” copiadas de outro lugar. Use aspas retas: <code>"</code> ou <code>\'</code>.');
    return P('O Python não entendeu a escrita.', 'Confira: aspas fechadas, parênteses fechados, dois-pontos (<code>:</code>) e operadores escritos corretamente (<code>&gt;=</code>, não <code>=&gt;</code>).');
  }
  if (t === 'NameError') return P('Nome desconhecido.', 'O Python não conhece esse nome. Causas comuns: erro de digitação, maiúscula/minúscula diferente (<code>Nome</code> ≠ <code>nome</code>), variável que ainda não foi criada, ou <b>texto sem aspas</b>.');
  if (t === 'UnboundLocalError') return P('Variável usada antes de existir na função.', 'Dentro de uma função, uma variável criada lá dentro é “local”. Passe valores pelos parâmetros e devolva com <code>return</code>.');
  if (t === 'TypeError') {
    if (/can only concatenate|unsupported operand/.test(m)) return P('Tipos que não combinam.', 'Você tentou somar/juntar texto (<code>str</code>) com número. Converta com <code>int()</code>, <code>float()</code> ou <code>str()</code>, ou use uma f-string.');
    if (/not supported between/.test(m)) return P('Comparação entre tipos diferentes.', 'Você comparou texto com número. Lembre: <code>input()</code> devolve <b>texto</b>; converta com <code>int()</code> ou <code>float()</code> antes de comparar.');
    if (/missing .* required positional/.test(m)) return P('Faltou informar um argumento.', 'A função precisa de mais valores dentro dos parênteses na hora de chamar.');
    if (/takes .* positional argument/.test(m)) return P('Argumentos demais.', 'Você passou mais valores do que a função tem parâmetros.');
    return P('Tipo inadequado.', 'A operação não funciona com esse tipo de dado. Confira se os valores são texto ou número.');
  }
  if (t === 'ValueError') {
    if (/invalid literal for int/.test(m)) return P('Não deu para virar número inteiro.', '<code>int()</code> só aceita texto que seja um número inteiro, sem vírgula, sem ponto e sem letras.');
    if (/could not convert string to float/.test(m)) return P('Não deu para virar número decimal.', 'Em Python o separador decimal é o <b>ponto</b> (<code>1.75</code>), não a vírgula.');
    if (/too many values to unpack|not enough values/.test(m)) return P('Desempacotamento errado.', 'Você tentou separar um valor em mais (ou menos) variáveis do que ele tem. Num dicionário, use <code>for chave, valor in dicionario.items():</code>.');
    return P('Valor inadequado.', 'O tipo está certo, mas o conteúdo não serve para essa operação.');
  }
  if (t === 'ZeroDivisionError') return P('Divisão por zero.', 'Não existe divisão por zero. Em programas reais, verificamos com um <code>if</code> antes de dividir.');
  if (t === 'KeyError') return P('Chave que não existe no dicionário.', 'Você pediu uma chave que não foi cadastrada (ou escreveu com maiúscula/aspas diferentes). Confira com <code>if chave in dicionario</code>, use <code>dicionario.get(chave)</code> ou trate o erro com <code>try/except KeyError</code>.');
  if (t === 'Exception' || t === 'RuntimeError' || t === 'ArithmeticError' || t === 'LookupError') return P('Erro levantado pelo programa.', 'Este erro foi criado de propósito com <code>raise</code>. Leia a mensagem: ela diz o que deu errado. Você pode capturá-lo com <code>try/except</code>.');
  if (t === 'IndexError') return P('Posição que não existe.', 'A contagem começa em 0 e o último índice é <code>len(lista) - 1</code>.');
  if (t === 'AttributeError') return P('Esse tipo não tem essa ação.', 'Confira o tipo do valor e o nome do método.');
  if (t === 'RecursionError') return P('Função chamando a si mesma sem parar.', 'Toda função recursiva precisa de uma condição de parada.');
  return P('Erro.', 'Leia a última linha da mensagem: ela diz o tipo do erro e o motivo.');
}
function errorBox(err, code) {
  const src = (code.split('\n')[(err.line || 0) - 1] || '').trim();
  const syn = ['SyntaxError', 'IndentationError', 'RecursoNaoSuportado'].includes(err.type);
  const head = syn ? '' : '<b>Traceback (most recent call last):</b>\n';
  const at = err.line ? `  File "programa.py", line ${err.line}\n${src ? '    ' + esc(src) + '\n' : ''}` : '';
  const shown = err.type === 'Timeout' ? 'TimeoutError' : err.type;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="errbox">${head}${at}<b>${esc(shown)}:</b> ${esc(err.msg)}</div><div class="pt">🐛 ${explainError(err)}</div>`;
  return wrap;
}

/* ---------- Terminal interativo (input() de verdade) ---------- */
// Truque: quando o programa pede input() e ainda não há resposta, o programa para,
// mostramos uma caixinha; ao dar Enter, rodamos tudo de novo com a nova resposta.
function makeTerm() {
  const box = el('<div class="term" hidden><div class="term-h"><span>Saída do programa</span><button class="btn sm" data-x style="padding:2px 8px;background:transparent;color:inherit;border-color:#2d4569">Fechar</button></div><pre></pre><div class="extra"></div></div>');
  const pre = $('pre', box), extra = $('.extra', box);
  let code = '', inputs = [];
  function render() {
    const r = Py.run(code, { inputs, echo: true });
    const ol = r.out.split('\n'); pre.textContent = ol.length > 40 ? ol.slice(0, 40).join('\n') + '\n… (saída cortada: muitas linhas)' : r.out;
    extra.innerHTML = '';
    if (r.needInput) {
      const inp = el('<input class="inp" aria-label="Digite sua resposta e pressione Enter" autocomplete="off" spellcheck="false">');
      pre.append(inp);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inputs.push(inp.value); render(); } });
      extra.innerHTML = '<div class="hint-in">O programa está esperando você digitar. Escreva a resposta e pressione Enter.</div>';
      setTimeout(() => inp.focus(), 0);
    } else if (!r.error && !r.out) extra.innerHTML = '<div class="hint-in">O programa rodou, mas não mostrou nada na tela (falta um print?).</div>';
    else if (!r.error) extra.innerHTML = '<div class="hint-in">Fim do programa ✔</div>';
    if (r.error) extra.append(errorBox(r.error, code));
    box.hidden = false;
  }
  $('[data-x]', box).onclick = () => { box.hidden = true; };
  return { el: box, run(c, pre_inputs = []) { code = c; inputs = pre_inputs.map(String); render(); } };
}

/* ---------- Bloco de código com "anatomia" ---------- */
function demo(b) {
  const root = el('<figure class="demo"></figure>');
  if (b.what) root.append(el(`<p class="demo-what">${b.what}</p>`));
  const cb = el(`<div class="cb"><div class="cb-bar"><span class="dots"><i></i><i></i><i></i></span><span>${esc(b.file || 'programa.py')}</span><span class="grow"></span>${b.norun ? '' : '<button class="btn sm" data-edit>✏️ Experimentar</button><button class="btn sm run" data-run>▶ Rodar</button>'}</div><div class="cb-body"></div></div>`);
  const body = $('.cb-body', cb); let editing = false, ta = null;
  const showStatic = () => { body.innerHTML = ''; body.append(preCode(b.code)); };
  showStatic(); root.append(cb);
  const term = makeTerm(); root.append(term.el);
  if (!b.norun) {
    $('[data-run]', cb).onclick = () => term.run(editing ? ta.value : b.code, b.i || []);
    const eb = $('[data-edit]', cb);
    eb.onclick = () => {
      editing = !editing;
      if (editing) {
        ta = el('<textarea class="editor" aria-label="Edite o código"></textarea>'); ta.value = b.code; autoRows(ta, 3); bindEditor(ta);
        ta.addEventListener('input', () => autoRows(ta, 3)); body.innerHTML = ''; body.append(ta);
        eb.textContent = '↺ Voltar ao original'; ta.focus();
      } else { showStatic(); eb.textContent = '✏️ Experimentar'; }
    };
  }
  // Abas: linha por linha / por que / e se mudarmos
  const tabs = [];
  if (b.lines) {
    const ul = el('<ul></ul>');
    b.lines.forEach(([ls, txt]) => {
      const arr = [].concat(ls), label = arr.length > 1 ? `Linhas ${arr[0]}–${arr[arr.length - 1]}` : `Linha ${arr[0]}`;
      const li = el(`<li><button class="lx" type="button"><span class="lnb">${label}</span><span>${txt}</span></button></li>`);
      const set = on => $$('.ln', body).forEach((n, i) => n.classList.toggle('on', on && arr.includes(i + 1)));
      const btn = $('button', li);
      ['mouseenter', 'focus'].forEach(ev => btn.addEventListener(ev, () => { set(true); btn.classList.add('act'); }));
      ['mouseleave', 'blur'].forEach(ev => btn.addEventListener(ev, () => { set(false); btn.classList.remove('act'); }));
      ul.append(li);
    });
    tabs.push(['Linha por linha', ul]);
  }
  if (b.why) tabs.push(['Por que assim?', el(`<div>${b.why}</div>`)]);
  if (b.wi) {
    const d = el('<div></div>');
    b.wi.forEach(([a, r]) => d.append(el(`<div class="chg"><div class="a">${a}</div><div class="b">${r}</div></div>`)));
    tabs.push(['E se mudarmos?', d]);
  }
  if (tabs.length) {
    const an = el('<div class="anat"><div class="tabs" role="tablist"></div><div class="tabp"></div></div>');
    const tb = $('.tabs', an), pn = $('.tabp', an);
    const sel = i => { $$('button', tb).forEach((x, j) => x.setAttribute('aria-selected', j === i)); pn.innerHTML = ''; pn.append(tabs[i][1]); };
    tabs.forEach(([name], i) => { const bt = el(`<button role="tab" type="button">${name}</button>`); bt.onclick = () => sel(i); tb.append(bt); });
    sel(0); root.append(an);
  }
  return root;
}

/* ---------- Blocos de aula ---------- */
function renderBlock(b) {
  switch (b.t) {
    case 'h2': return el(`<h2>${b.x}</h2>`);
    case 'h3': return el(`<h3>${b.x}</h3>`);
    case 'p': return el(`<p>${b.x}</p>`);
    case 'ul': return el(`<ul>${b.x.map(i => `<li>${i}</li>`).join('')}</ul>`);
    case 'steps': return el(`<ol class="steps">${b.x.map(i => `<li><div>${i}</div></li>`).join('')}</ol>`);
    case 'tip': return el(`<div class="call tip"><div class="ic">💡</div><div>${b.title ? `<div class="ttl">${b.title}</div>` : ''}${[].concat(b.x).map(p => `<p>${p}</p>`).join('')}</div></div>`);
    case 'warn': return el(`<div class="call warn"><div class="ic">⚠️</div><div>${b.title ? `<div class="ttl">${b.title}</div>` : ''}${[].concat(b.x).map(p => `<p>${p}</p>`).join('')}</div></div>`);
    case 'note': return el(`<div class="call note"><div class="ic">📌</div><div>${b.title ? `<div class="ttl">${b.title}</div>` : ''}${[].concat(b.x).map(p => `<p>${p}</p>`).join('')}</div></div>`);
    case 'bug': return el(`<div class="call bug"><div class="ic">🐛</div><div>${b.title ? `<div class="ttl">${b.title}</div>` : ''}${[].concat(b.x).map(p => `<p>${p}</p>`).join('')}</div></div>`);
    case 'table': return el(`<div class="tbl-wrap"><table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    case 'code': return demo(b);
    case 'widget': { const w = el('<div class="widget"></div>'); WIDGETS[b.id](w); return w; }
  }
  return el('<div></div>');
}

/* ---------- Correção automática ---------- */
const norm = s => String(s).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '');
// Roda um programa para um teste. Se o teste tem "c" (chamada), a saída do próprio
// código do aluno é descontada — assim ele pode testar a função no arquivo sem atrapalhar a correção.
function evalProgram(code, t) {
  const opts = { inputs: (t.i || []).map(String), echo: false };
  if (t.c) {
    const pre = Py.run(code, opts);
    if (pre.error) return { out: pre.out, error: pre.error };
    const full = Py.run(code + '\n' + t.c, opts);
    let out = full.out; if (!full.error && out.startsWith(pre.out)) out = out.slice(pre.out.length);
    return { out, error: full.error };
  }
  const r = Py.run(code, opts); return { out: r.out, error: r.error };
}
function testLabel(t) { return t.c ? t.c : (t.i && t.i.length ? 'Entradas: ' + t.i.join('  |  ') : 'Sem entradas'); }
function runTests(ex, code) {
  const tests = ex.tests || [{}];
  const results = tests.map(t => {
    const exp = evalProgram(ex.s, t), got = evalProgram(code, t);
    const pass = !got.error && norm(got.out) === norm(exp.out);
    const close = !pass && !got.error && norm(got.out).toLowerCase().replace(/\s+/g, ' ') === norm(exp.out).toLowerCase().replace(/\s+/g, ' ');
    return { label: testLabel(t), exp: exp.out, got: got.out, err: got.error, pass, close };
  });
  return { results, ok: results.every(r => r.pass) };
}
function resultsHTML(r, code) {
  const pass = r.results.filter(x => x.pass).length;
  const box = el('<div></div>');
  box.append(el(`<div class="fb ${r.ok ? 'ok' : 'no'}">${r.ok ? '✅ Correto! Todos os testes passaram.' : `❌ Ainda não: ${pass} de ${r.results.length} testes passaram.`}${!r.ok ? '<small>Veja abaixo o que era esperado e o que o seu programa mostrou.</small>' : ''}</div>`));
  const list = el('<div class="tests"></div>');
  r.results.forEach((x, i) => {
    const d = el(`<div class="tst ${x.pass ? 'pass' : 'fail'}"><div class="th">${x.pass ? '✅' : '❌'} Teste ${i + 1}: <code style="white-space:normal">${esc(x.label)}</code></div></div>`);
    if (!x.pass) {
      d.append(el(`<div class="cols"><div><span>Esperado</span><pre>${esc(x.exp) || '(nada)'}</pre></div><div><span>Seu programa mostrou</span><pre>${x.err ? '(erro)' : esc(x.got) || '(nada)'}</pre></div></div>`));
      if (x.close) d.append(el('<div style="margin-top:6px">👀 Quase! Só diferem em maiúsculas/minúsculas ou espaços. Confira cada letra e espaço.</div>'));
      if (x.err) d.append(errorBox(x.err, code));
    }
    list.append(d);
  });
  box.append(list); return box;
}
function staticCode(code, file) {
  const cb = el(`<div class="cb"><div class="cb-bar"><span class="dots"><i></i><i></i><i></i></span><span>${file || 'programa.py'}</span></div><div class="cb-body"></div></div>`);

}

/* ---------- 🗺️ Mapa mental: SVG radial gerado a partir dos próprios blocks ---------- */
const MM_ENT = { amp: '&', lt: '<', gt: '>', quot: '"', 39: "'", nbsp: ' ' };
function mmDecode(s) { return s.replace(/&(#?\w+);/g, (m0, k) => { const v = MM_ENT[k.replace('#', '')]; return v !== undefined ? v : m0; }); }
function mmText(s, n) {
  s = mmDecode(String(s == null ? '' : s).replace(/<[^>]+>/g, '')).replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
}
function mmEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function mmEdge(cx, cy, halfW, halfH, angle) {
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const tx = dx !== 0 ? halfW / Math.abs(dx) : Infinity, ty = dy !== 0 ? halfH / Math.abs(dy) : Infinity;
  const t = Math.min(tx, ty);
  return [cx + dx * t, cy + dy * t];
}
function mmTopics(m) {
  const topics = [];
  let cur = null;
  m.blocks.forEach(b => {
    if (b.t === 'h2') { cur = { title: mmText(b.x, 22), items: [] }; topics.push(cur); }
    else if (cur) {
      if (b.t === 'table' && b.rows) b.rows.slice(0, 3).forEach(r => cur.items.push(mmText(r[0], 15)));
      else if ((b.t === 'tip' || b.t === 'note' || b.t === 'warn') && b.title) cur.items.push(mmText(b.title, 15));
    }
  });
  return topics.filter(t => t.title).slice(0, 7);
}
const MM_COLORS = ['var(--lv1)', 'var(--warn)', 'var(--lv3)', 'var(--blue-2)', 'var(--bad)', 'var(--ok)', 'var(--lv4)'];
function buildMindMap(m) {
  const topics = mmTopics(m);
  if (topics.length < 2) return null; // conteúdo pequeno demais pra virar um mapa útil
  const W = 1040, H = 1040, cx = W / 2, cy = H / 2, branchR = 290, n = topics.length;
  const rot = n % 2 === 0 ? Math.PI / n : 0;
  const ctitle = `${m.icon} ${mmText(m.title, 20)}`, cw = 60 + ctitle.length * 10.2, ch = 52;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa mental do módulo ${mmEsc(mmText(m.title, 60))}" style="width:100%;height:auto;display:block">`;
  topics.forEach((topic, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2 + rot;
    const color = MM_COLORS[i % MM_COLORS.length];
    const bx = cx + branchR * Math.cos(angle), by = cy + branchR * Math.sin(angle);
    const labelW = 30 + topic.title.length * 9.3, labelH = 36;
    const [sx, sy] = mmEdge(cx, cy, cw / 2 + 4, ch / 2 + 4, angle);
    const [ex, ey] = mmEdge(bx, by, labelW / 2 + 4, labelH / 2 + 4, angle + Math.PI);
    const bend = 26 * (i % 2 ? 1 : -1);
    const midx = (sx + ex) / 2 + bend * Math.cos(angle + Math.PI / 2), midy = (sy + ey) / 2 + bend * Math.sin(angle + Math.PI / 2);
    svg += `<path d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${midx.toFixed(1)},${midy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" stroke="${color}" stroke-width="2.5" fill="none"/>`;
    svg += `<rect x="${(bx - labelW / 2).toFixed(1)}" y="${(by - labelH / 2).toFixed(1)}" width="${labelW.toFixed(1)}" height="${labelH}" rx="8" fill="var(--panel)" stroke="${color}" stroke-width="2"/>`;
    svg += `<text x="${bx.toFixed(1)}" y="${(by + 5).toFixed(1)}" text-anchor="middle" style="font:700 14.5px var(--mono);fill:var(--ink)">${mmEsc(topic.title)}</text>`;
    const leafR = branchR + 175, cnt = Math.min(3, topic.items.length), spread = cnt > 1 ? 0.62 : 0;
    topic.items.slice(0, 3).forEach((leaf, j) => {
      const k = cnt > 1 ? (j / (cnt - 1) - 0.5) : 0, langle = angle + k * spread;
      const lx = cx + leafR * Math.cos(langle), ly = cy + leafR * Math.sin(langle);
      const lw = 22 + leaf.length * 7.6, lh = 26;
      const [lsx, lsy] = mmEdge(bx, by, labelW / 2 + 3, labelH / 2 + 3, langle);
      const [lex, ley] = mmEdge(lx, ly, lw / 2 + 3, lh / 2 + 3, langle + Math.PI);
      const lmidx = (lsx + lex) / 2, lmidy = (lsy + ley) / 2;
      svg += `<path d="M${lsx.toFixed(1)},${lsy.toFixed(1)} Q${lmidx.toFixed(1)},${lmidy.toFixed(1)} ${lex.toFixed(1)},${ley.toFixed(1)}" stroke="${color}" stroke-width="1.4" fill="none" opacity=".55"/>`;
      svg += `<rect x="${(lx - lw / 2).toFixed(1)}" y="${(ly - lh / 2).toFixed(1)}" width="${lw.toFixed(1)}" height="${lh}" rx="13" fill="var(--panel-2)" stroke="var(--line)"/>`;
      svg += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" style="font:12px var(--ui);fill:var(--muted)">${mmEsc(leaf)}</text>`;
    });
  });
  svg += `<rect x="${(cx - cw / 2).toFixed(1)}" y="${(cy - ch / 2).toFixed(1)}" width="${cw.toFixed(1)}" height="${ch}" rx="10" fill="var(--blue)"/>`;
  svg += `<text x="${cx.toFixed(1)}" y="${(cy + 6).toFixed(1)}" text-anchor="middle" style="font:700 16px var(--mono);fill:var(--on-blue)">${mmEsc(ctitle)}</text>`;
  svg += `</svg>`;
  const wrap = el('<div class="mindmap"></div>');
  wrap.innerHTML = svg;
  return wrap;
}

    const msec = el('<section class="sec" id="sec-mapa"><h2>🗺️ Mapa mental</h2><p class="sub">Os assuntos deste módulo, em forma de mapa. Cada galho é um tema da lição; as bolhas penduradas nele são exemplos ou avisos ligados a ele.</p></section>');
    msec.append(mapaContent);
    w.append(msec);
  }
  const group = (id, title, sub, list, byLevel) => {
    if (!list.length) return;
    const sec = el(`<section class="sec" id="sec-${id}"><h2>${title}</h2><p class="sub">${sub}</p></section>`);
    if (byLevel) [1, 2, 3, 4].forEach(l => { const xs = list.filter(e => e.lvl === l); if (!xs.length) return; sec.append(el(`<div class="lvl-h"><span>${LVL_EMOJI[l]}</span> ${LVL_NAME[l]} <small>· ${PTS[l]} pts cada</small></div>`)); xs.forEach(e => sec.append(exCard(e, m))); });
    else list.forEach(e => sec.append(exCard(e, m)));
    w.append(sec);
  };
  group('exercicios', 'Exercícios', 'Abra um exercício, tente sozinho(a) e só depois use a dica. Errar faz parte — o corretor mostra o que faltou.', regular, true);
  group('bugs', '🐛 Encontre o erro', 'Programadores passam boa parte do tempo caçando bugs. Leia o código, ache o problema e veja o que o Python realmente responde.', bugs, false);
  group('projetos', m.projTitle || '🎯 Projetos práticos', m.projSub || 'Pequenos programas de verdade. Leia o roteiro, planeje no papel e depois escreva o código.', projs, false);
  if (m.quiz.length) { const sec = el('<section class="sec" id="sec-quiz"><h2>🧩 Quiz do módulo</h2><p class="sub">Responda e leia sempre a explicação — ela vale mais do que o acerto.</p></section>'); sec.append(quizBlock(m)); w.append(sec); }
  const i = MODS.indexOf(m), prev = MODS[i - 1], next = MODS[i + 1];
  w.append(el(`<div class="pager">${prev ? `<button class="btn" data-go="${prev.id}">Anterior: ${prev.title}</button>` : '<span></span>'}${next ? `<button class="btn pri" data-go="${next.id}">Próximo módulo: ${next.title}</button>` : '<button class="btn yel" data-go="home">Ver minhas conquistas</button>'}</div>`));
}

/* ---------- Início ---------- */
function init() {
  loadState(); applyTheme();
  document.body.insertAdjacentHTML('afterbegin', `<div class="app"><aside class="side" id="side" aria-label="Menu do curso"></aside><div><header class="topbar"><button class="btn sm" data-act="menu" aria-label="Abrir menu">☰ Menu</button><div class="grow"><b>Python do Zero</b><div class="bar"><i id="top-bar"></i></div></div><b id="top-pct">0%</b><button class="btn sm" data-act="theme" aria-label="Alternar tema">🌓</button></header><main class="main" id="main"></main></div></div><div id="scrim"></div><div class="toasts" id="toasts" aria-live="polite"></div>`);
  $('#scrim').className = 'scrim';
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
