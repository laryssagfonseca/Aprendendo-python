<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python do Zero — curso interativo para iniciantes</title>
<meta name="description" content="Curso interativo e offline de introdução à programação com Python: variáveis, condições, funções, exercícios corrigidos automaticamente, quizzes e desafios.">
<style>
/* =====================================================================
   PYTHON DO ZERO — estilos
   Identidade: azul e amarelo do Python, blocos de código escuros,
   trilha de módulos na lateral. Sem fontes externas (funciona offline).
   ===================================================================== */
:root {
  --bg: #f1f5fa; --panel: #ffffff; --panel-2: #f7f9fc; --ink: #142036; --muted: #55637c; --line: #d9e2ee;
  --blue: #2c63a0; --blue-2: #3b7bc0; --blue-soft: #e5eefa; --on-blue: #ffffff;
  --yellow: #ffd43b; --yellow-soft: #fff5c9; --yellow-ink: #5a4500;
  --ok: #17803f; --ok-soft: #e0f5e8; --bad: #c73434; --bad-soft: #fde7e7; --warn: #a25f00; --warn-soft: #fff0d2;
  --code-bg: #0e1a2c; --code-bar: #16263d; --code-ink: #e4ecf7; --code-mute: #6f819d; --code-hl: #22385a;
  --t-kw: #ffd43b; --t-bi: #86c5ff; --t-str: #9ce29e; --t-num: #ffb47a; --t-com: #7c8da8; --t-fn: #c9adff; --t-br: #ff92b5;
  --term-bg: #08111f; --term-ink: #d5f5df;
  --lv1: #22a55b; --lv2: #e0b400; --lv3: #ee8a1c; --lv4: #dc4141;
  --sh: 0 1px 2px rgba(20, 32, 54, .06), 0 6px 20px rgba(20, 32, 54, .05);
  --r: 7px; --r-lg: 12px;
  --ui: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
[data-theme="dark"] {
  --bg: #0b1220; --panel: #131d2f; --panel-2: #172338; --ink: #e6ecf7; --muted: #9aa9c3; --line: #25334d;
  --blue: #79b6f2; --blue-2: #5fa2e6; --blue-soft: #172a45; --on-blue: #0b1220;
  --yellow-soft: #3b3412; --yellow-ink: #ffe27e;
  --ok: #4fd087; --ok-soft: #12301f; --bad: #ff7a7a; --bad-soft: #3a1919; --warn: #ffb44d; --warn-soft: #3a2a0c;
  --code-bg: #08111f; --code-bar: #0f1c31; --code-hl: #1a3050; --term-bg: #050b15;
  --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
[hidden] { display: none !important; }
code, kbd { font-family: var(--mono); font-size: .9em; background: var(--blue-soft); color: var(--blue); padding: .1em .38em; border-radius: 6px; white-space: nowrap; }
mark { background: var(--yellow-soft); color: var(--yellow-ink); padding: 0 .25em; border-radius: 4px; }
b, strong { font-weight: 700; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; }
.brand svg { flex: none; }
.brand strong { display: block; font-size: 1.15rem; letter-spacing: -.01em; line-height: 1.15; }
.brand small { color: var(--muted); font-size: .8rem; }
.mini-stats { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.mini-stats .row { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
.mini-stats .big { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.mini-stats .big span:first-child { font-size: 1.5rem; letter-spacing: -.02em; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue-2), var(--yellow)); transition: width .5s ease; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { border-color: var(--blue-2); background: var(--blue-soft); }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.pri:hover { background: var(--blue-2); border-color: var(--blue-2); }
.btn.yel { background: var(--yellow); border-color: var(--yellow); color: #3b2f00; }
.btn.yel:hover { filter: brightness(.96); background: var(--yellow); }
.btn.sm { padding: 5px 10px; font-size: .84rem; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; justify-content: center; }
.nav-h { margin: 4px 0 -6px; font-size: .82rem; color: var(--muted); font-weight: 600; }
.trail { list-style: none; margin: 0; padding: 0; position: relative; }
.trail li { position: relative; }
.trail li::before { content: ""; position: absolute; left: 17px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.trail li:first-child::before { top: 50%; }
.trail li:last-child::before { bottom: 50%; }
.trail li.done::before { background: var(--blue-2); }
.trail button { position: relative; width: 100%; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 10px; }
.trail button:hover { background: var(--panel-2); }
.trail .node { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; background: var(--panel); border: 2px solid var(--line); z-index: 1; }
.trail .done .node { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.trail .cur button { background: var(--blue-soft); }
.trail .cur .node { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-soft); }
.trail .t { font-weight: 650; line-height: 1.25; font-size: .95rem; }
.trail .s { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .78rem; margin-top: 2px; }
.trail .s .bar { flex: 1; margin: 0; height: 5px; }
.side-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.topbar { display: none; position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; align-items: center; gap: 12px; padding-top: max(8px, env(safe-area-inset-top)); }
.topbar .grow { flex: 1; min-width: 0; }
.topbar .bar { margin-top: 4px; height: 6px; }
.scrim { display: none; }
.main { min-width: 0; padding: 32px clamp(16px, 4vw, 48px) 80px; }
.wrap { max-width: 860px; margin: 0 auto; }

/* ---------- Cabeçalhos e texto ---------- */
.page-h { margin: 0 0 6px; font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.15; letter-spacing: -.01em; font-weight: 700; font-family: var(--mono); }
.page-h::before { content: ">>> "; color: var(--blue-2); font-weight: 500; }
.lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 20px; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 28px; position: sticky; top: 0; z-index: 5; padding: 10px 0; background: linear-gradient(var(--bg) 75%, transparent); }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 14px; font-size: .88rem; font-weight: 600; text-decoration: none; color: var(--ink); }
.chip:hover { border-color: var(--blue-2); background: var(--blue-soft); }
.sec { margin: 44px 0 14px; scroll-margin-top: 70px; }
.sec h2, .lesson h2 { font-size: 1.4rem; letter-spacing: -.005em; line-height: 1.25; margin: 40px 0 10px; font-family: var(--mono); font-weight: 700; }
.sec h2::before, .lesson h2::before { content: "# "; color: var(--muted); font-weight: 400; }
.lesson h3 { font-size: 1.1rem; margin: 26px 0 6px; font-family: var(--mono); font-weight: 700; }
.lesson p, .lesson li { max-width: 70ch; }
.lesson ul, .lesson ol { padding-left: 1.3em; }
.lesson li { margin: .3em 0; }
.sec h2 { margin: 0 0 4px; font-size: 1.5rem; }
.sec .sub { color: var(--muted); margin: 0 0 14px; }
.lvl-h { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; font-size: 1.02rem; font-weight: 700; }
.lvl-h small { font-weight: 500; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; }

.call { display: grid; grid-template-columns: 34px 1fr; gap: 12px; border-radius: var(--r); padding: 14px 16px; margin: 18px 0; border: 1px solid transparent; }
.call .ic { font-size: 1.4rem; line-height: 1.3; }
.call .ttl { font-weight: 700; margin-bottom: 2px; }
.call p { margin: 0 0 .5em; } .call p:last-child { margin-bottom: 0; }
.call.tip { background: var(--yellow-soft); border-color: color-mix(in srgb, var(--yellow) 60%, transparent); color: var(--ink); }
.call.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.call.note { background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue-2) 30%, transparent); }
.call.bug { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.tbl-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--panel-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }
ol.steps { list-style: none; padding: 0; counter-reset: st; margin: 16px 0; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 8px 0; max-width: 70ch; }
ol.steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: var(--on-blue); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }

/* ---------- Bloco de código ---------- */
.demo { margin: 20px 0 26px; }
.demo-what { margin: 0 0 8px; font-weight: 600; }
.cb { background: var(--code-bg); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh); border: 1px solid var(--code-hl); }
.cb-bar { display: flex; align-items: center; gap: 8px; background: var(--code-bar); padding: 6px 10px 6px 14px; color: var(--code-mute); font-size: .8rem; font-family: var(--mono); }
.cb-bar .dots { display: flex; gap: 6px; margin-right: 4px; } .cb-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a4c69; }
.cb-bar .grow { flex: 1; }
.cb-bar .btn { background: #223652; border-color: #2d4569; color: #e4ecf7; font-family: var(--ui); }
.cb-bar .btn:hover { background: #2c4668; }
.cb-bar .btn.run { background: var(--yellow); border-color: var(--yellow); color: #3b2f00; }
pre.code { margin: 0; padding: 14px 0; overflow-x: auto; color: var(--code-ink); font: 14.5px/1.7 var(--mono); tab-size: 4; counter-reset: ln; }
pre.code .ln { display: block; padding: 0 16px 0 0; min-height: 1.7em; white-space: pre; counter-increment: ln; border-left: 3px solid transparent; }
pre.code .ln::before { content: counter(ln); display: inline-block; width: 2.6em; margin-right: 1em; text-align: right; color: var(--code-mute); opacity: .7; user-select: none; }
pre.code .ln.on { background: var(--code-hl); border-left-color: var(--yellow); }
.k { color: var(--t-kw); font-weight: 600; } .bi { color: var(--t-bi); } .s { color: var(--t-str); } .n { color: var(--t-num); } .c { color: var(--t-com); font-style: italic; } .f { color: var(--t-fn); } .br { color: var(--t-br); }
textarea.editor { display: block; width: 100%; background: var(--code-bg); color: var(--code-ink); border: 0; padding: 14px 16px; font: 14.5px/1.7 var(--mono); tab-size: 4; resize: vertical; min-height: 120px; white-space: pre; overflow: auto; }
textarea.editor:focus { outline: 2px solid var(--blue-2); outline-offset: -2px; }
.term { background: var(--term-bg); color: var(--term-ink); border-radius: var(--r); margin-top: 10px; border: 1px solid var(--code-hl); overflow: hidden; }
.term-h { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; background: var(--code-bar); font: 12px var(--mono); color: var(--code-mute); }
.term pre { margin: 0; padding: 12px 14px; font: 14px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; min-height: 2.5em; }
.term .inp { background: transparent; border: 0; border-bottom: 2px solid var(--yellow); color: #fff; font: inherit; width: 14ch; outline: none; padding: 0 2px; caret-color: var(--yellow); }
.term .hint-in { color: var(--code-mute); font-size: .8rem; font-family: var(--ui); padding: 0 14px 10px; }
.term .errbox { border-top: 1px solid #402328; background: #1e0f14; color: #ffb3b3; padding: 10px 14px; font: 13.5px/1.55 var(--mono); white-space: pre-wrap; }
.term .errbox b { color: #ff8a8a; }
.term .pt { border-top: 1px solid var(--code-hl); background: #0d1c2f; color: #e8dfae; padding: 10px 14px; font: 14px/1.55 var(--ui); }
.term .pt b { color: var(--yellow); }
.term.ok-out pre { color: var(--term-ink); }

/* ---------- Anatomia do código ---------- */
.anat { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabs { display: flex; background: var(--panel-2); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 16px; font-weight: 650; font-size: .92rem; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--yellow); background: var(--panel); }
.tabp { padding: 14px 18px; }
.tabp ul { margin: 0; padding: 0; list-style: none; }
.tabp li { margin: 0; }
.lx { display: grid; grid-template-columns: 74px 1fr; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 8px; border-radius: 8px; align-items: baseline; }
.lx:hover, .lx:focus-visible, .lx.act { background: var(--blue-soft); }
.lx .lnb { font: 600 .8rem var(--mono); color: var(--blue); background: var(--blue-soft); border-radius: 6px; padding: 2px 7px; justify-self: start; }
.lx.act .lnb, .lx:hover .lnb { background: var(--yellow); color: #3b2f00; }
.chg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 16px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.chg:last-child { border-bottom: 0; }
.chg .a { font-weight: 600; } .chg .b { color: var(--muted); }
.tabp p { margin: 0 0 .6em; } .tabp p:last-child { margin: 0; }

/* ---------- Exercícios ---------- */
.ex { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--lc, var(--lv1)); border-radius: var(--r); margin: 12px 0; overflow: hidden; }
.ex[data-lvl="1"] { --lc: var(--lv1); } .ex[data-lvl="2"] { --lc: var(--lv2); } .ex[data-lvl="3"] { --lc: var(--lv3); } .ex[data-lvl="4"] { --lc: var(--lv4); }
.ex-h { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; padding: 14px 18px; }
.ex-h:hover { background: var(--panel-2); }
.ex-h .tt { flex: 1; font-weight: 700; line-height: 1.3; }
.ex-h .tt small { display: block; font-weight: 500; color: var(--muted); font-size: .82rem; }
.ex-h .car { transition: transform .2s; color: var(--muted); }
.ex.open .car { transform: rotate(90deg); }
.pill { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.seen { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bug { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.proj { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.ex-b { padding: 4px 20px 20px; border-top: 1px solid var(--line); }
.ex-q { margin: 14px 0 10px; } .ex-q p { margin: 0 0 .6em; }
.plan { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 16px; margin: 10px 0; }
.plan b { display: block; margin-bottom: 4px; }
.plan ol { margin: 0; padding-left: 1.3em; }
.ex-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.hint { background: var(--yellow-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; margin: 8px 0; border-left: 4px solid var(--yellow); }
.hint b { margin-right: 4px; }
.fb { border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-weight: 600; }
.fb.ok { background: var(--ok-soft); color: var(--ok); } .fb.no { background: var(--bad-soft); color: var(--bad); } .fb.info { background: var(--blue-soft); color: var(--blue); }
.fb small { display: block; font-weight: 400; color: var(--ink); margin-top: 3px; }
.tests { display: grid; gap: 8px; margin: 8px 0; }
.tst { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: .9rem; background: var(--panel-2); }
.tst.pass { border-color: color-mix(in srgb, var(--ok) 50%, transparent); } .tst.fail { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.tst .th { font-weight: 700; margin-bottom: 4px; }
.tst pre { margin: 2px 0 0; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 6px 10px; font: 13px/1.5 var(--mono); white-space: pre-wrap; }
.tst .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tst .cols span { font-size: .78rem; color: var(--muted); }
.sol { border: 2px solid var(--blue-2); border-radius: var(--r); padding: 12px 16px 16px; margin: 14px 0 4px; background: var(--panel); }
.sol > .ttl { font-weight: 800; margin-bottom: 8px; }
.sol .demo { margin: 8px 0; }
.opts { display: grid; gap: 8px; margin: 10px 0; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--blue-2); background: var(--blue-soft); }
.opt .l { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); font-weight: 700; font-size: .85rem; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); } .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.answer { width: 100%; min-height: 84px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14.5px/1.6 var(--mono); resize: vertical; }
.qz { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; margin: 12px 0; }
.qz .qq { font-weight: 700; margin: 0 0 8px; }
.qz .why { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel-2); }
.qz-sum { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- Widgets ---------- */
.widget { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin: 20px 0; }
.mindmap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin: 12px 0; overflow-x: auto; }
.mindmap svg { min-width: 480px; }
.mindmap-preview { max-width: 420px; margin: 4px 0 26px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 10px 6px; }
.mindmap-preview-h { font-family: var(--mono); font-weight: 700; font-size: .88rem; color: var(--muted); padding: 2px 4px 8px; }
.mindmap-preview .mindmap { border: 0; padding: 0; margin: 0; overflow: hidden; }
.mindmap-preview .mindmap svg { min-width: 0; }
.mindmap-preview-more { display: block; text-align: right; font-size: .82rem; font-weight: 600; color: var(--blue-2); text-decoration: none; padding: 6px 6px 4px; }
.mindmap-preview-more:hover { text-decoration: underline; }
.widget > .wt { font-weight: 800; margin-bottom: 2px; } .widget > .ws { color: var(--muted); font-size: .92rem; margin-bottom: 12px; }

    }

/* ---------- Ponto de entrada ---------- */
function run(code, opts = {}) {
  const it = new Interp(opts);
  let error = null, needInput = false;
  try {
    const ast = new Parser(tokenize(code)).parseProgram();
    it.run(ast);
  } catch (e) {
    if (e instanceof NeedInput) needInput = true;
    else if (e instanceof PyError) error = { type: e.pyType, msg: e.pyMsg, line: e.line };
    else if (e instanceof RangeError) error = { type: 'RecursionError', msg: 'maximum recursion depth exceeded', line: null };
    else error = { type: 'ErroInterno', msg: String(e && e.message || e), line: null };
  }
  return { out: it.out.join(''), error, needInput };
}

return { run };

  ex: [
    { id: 'm2-1', lvl: 1, t: 'Duas caixas, um print', q: `<p>Crie <code>cor</code> guardando <code>"azul"</code> e <code>numero</code> guardando <code>7</code>. Mostre as duas com <b>um único</b> print, assim:</p>${BOXPRE('azul 7')}`, h: ['O print aceita vários itens separados por vírgula.'], s: 'cor = "azul"\nnumero = 7\nprint(cor, numero)', x: '<p>A vírgula dentro do print coloca um espaço entre os itens. <code>cor</code> é texto (com aspas) e <code>numero</code> é inteiro (sem aspas).</p>' },
    { id: 'm2-2', lvl: 1, k: 'pr', t: 'Somando variáveis', q: '<p>O que vai aparecer na tela?</p>', code: 'a = 3\nb = 4\nprint(a + b)', h: ['Os dois são números.'], x: '<p><code>a</code> vale 3 e <code>b</code> vale 4. Como são números, <code>+</code> soma: <b>7</b>.</p>' },
    { id: 'm2-3', lvl: 1, k: 'mc', t: 'Qual é o tipo?', q: '<p>Qual é o tipo do valor <code>3.14</code>?</p>', o: ['<code>int</code>', '<code>float</code>', '<code>str</code>', '<code>bool</code>'], a: 1, h: ['Tem ponto decimal e não tem aspas.'], x: '<p>Números com ponto decimal são <code>float</code>. <code>int</code> seria 3, <code>str</code> seria "3.14".</p>' },
    { id: 'm2-4', lvl: 2, t: 'Altura e peso', q: `<p>Crie <code>altura = 1.75</code> e <code>peso = 70</code> e mostre:</p>${BOXPRE('Altura: 1.75\nPeso: 70')}<p>Use f-strings.</p>`, h: ['<code>print(f"Altura: {altura}")</code>'], s: 'altura = 1.75\npeso = 70\nprint(f"Altura: {altura}")\nprint(f"Peso: {peso}")', x: '<p>Guardamos um decimal e um inteiro. As f-strings colocam o conteúdo das caixas dentro do texto.</p>' },
    { id: 'm2-5', lvl: 2, k: 'pr', t: 'Texto ou número?', q: '<p>Escreva as 4 linhas que vão aparecer:</p>', code: 'x = "10"\ny = 10\nprint(x)\nprint(y)\nprint(type(x))\nprint(type(y))', h: ['<code>print(x)</code> e <code>print(y)</code> parecem iguais; o que muda é o tipo.', 'O <code>type()</code> mostra <code>&lt;class \'nome\'&gt;</code>.'], x: '<p>Nas duas primeiras linhas aparece <code>10</code> (texto e número parecem iguais). Nas duas últimas o <code>type</code> revela: <code>&lt;class \'str\'&gt;</code> para <code>x</code> e <code>&lt;class \'int\'&gt;</code> para <code>y</code>.</p>' },
    { id: 'm2-6', lvl: 2, k: 'mc', t: 'Nome de variável válido', q: '<p>Qual destes é um <b>nome de variável válido</b> em Python?</p>', o: ['<code>meu nome</code>', '<code>2nota</code>', '<code>nota_final</code>', '<code>if</code>'], a: 2, h: ['Sem espaço, sem começar por número e sem palavra reservada.'], x: '<p><code>meu nome</code> tem espaço, <code>2nota</code> começa com número, <code>if</code> é palavra reservada. Só <code>nota_final</code> é válido.</p>' },
    { id: 'm2-7', lvl: 3, t: 'Ano que vem', q: '<p>Pergunte o <b>nome</b> e a <b>idade</b> e mostre:</p><p><code>Maria tem 20 anos e ano que vem terá 21.</code></p>', h: ['A idade precisa virar número com <code>int()</code>.', 'Na f-string, calcule <code>{idade + 1}</code>.'], s: 'nome = input("Nome: ")\nidade = int(input("Idade: "))\nprint(f"{nome} tem {idade} anos e ano que vem terá {idade + 1}.")', tests: [{ i: ['Maria', '20'] }, { i: ['Pedro', '31'] }], x: '<p>Nome fica texto; idade é convertida para <code>int</code> para podermos somar 1 dentro da f-string.</p>' },
    { id: 'm2-8', lvl: 3, k: 'pr', t: 'Reatribuindo', q: '<p>O que aparece na tela?</p>', code: 'pontos = 10\npontos = pontos + 5\npontos = pontos * 2\nprint(pontos)', h: ['Acompanhe o valor da caixa linha a linha: 10 → ? → ?'], x: '<p>Começa em 10. Depois 10 + 5 = 15. Depois 15 × 2 = <b>30</b>. Só o último valor é mostrado.</p>' },
    { id: 'm2-9', lvl: 3, t: 'Troca de caixas', q: '<p>As variáveis <code>a</code> e <code>b</code> começam com <code>"esquerda"</code> e <code>"direita"</code>. <b>Troque o conteúdo</b> das duas caixas para que o programa mostre <code>direita</code> e depois <code>esquerda</code>.</p><p>Escreva a troca no espaço indicado. (Dica de vida real: para trocar o conteúdo de dois copos, você precisa de um terceiro.)</p>', start: 'a = "esquerda"\nb = "direita"\n\n# faça a troca aqui\n\nprint(a)\nprint(b)', h: ['Se você fizer <code>a = b</code> direto, o valor antigo de <code>a</code> se perde.', 'Guarde um deles numa caixa temporária: <code>temp = a</code>.'], s: 'a = "esquerda"\nb = "direita"\n\ntemp = a\na = b\nb = temp\n\nprint(a)\nprint(b)', sl: [[4, 'Guarda o valor de <code>a</code> numa caixa extra para não perdê-lo.'], [5, '<code>a</code> recebe o conteúdo de <code>b</code>.'], [6, '<code>b</code> recebe o valor guardado em <code>temp</code>.']], x: '<p>A caixa temporária segura o valor de <code>a</code> enquanto <code>a</code> recebe <code>b</code>. Depois entregamos o valor guardado a <code>b</code>. (Python também permite <code>a, b = b, a</code>, mas o método do copo extra ensina o raciocínio.)</p>' },
    { id: 'm2-10', lvl: 3, t: 'Média de duas notas', q: `<p>Peça duas notas (decimais) e mostre a média com <b>uma casa decimal</b>:</p>${BOXPRE('Média: 8.0')}<p>(para as notas 7 e 9)</p>`, h: ['Converta as notas com <code>float()</code>.', 'Média = (nota1 + nota2) / 2 — use parênteses. Formate com <code>:.1f</code>.'], s: 'n1 = float(input("Nota 1: "))\nn2 = float(input("Nota 2: "))\nmedia = (n1 + n2) / 2\nprint(f"Média: {media:.1f}")', tests: [{ i: ['7', '9'] }, { i: ['5', '6'] }], x: '<p>Os parênteses garantem que a soma acontece antes da divisão. <code>:.1f</code> mostra uma casa decimal.</p>' },
    { id: 'm2-11', lvl: 4, proj: true, t: 'Projeto: conversor de moeda', q: `<p>Peça um valor em <b>reais</b> e a <b>cotação do dólar</b> (quantos reais vale 1 dólar). Mostre o valor em dólares com duas casas:</p>${BOXPRE('R$ 100.00 = US$ 20.00')}<p>(para 100 reais e cotação 5)</p>`, plan: ['Quais dados entram? (reais e cotação, ambos decimais)', 'Qual é a conta? (reais ÷ cotação)', 'Como mostro os dois valores com 2 casas?'], h: ['<code>float(input(...))</code> duas vezes.', 'dolares = reais / cotacao; mostre os dois com <code>:.2f</code>.'], s: 'reais = float(input("Valor em reais: "))\ncotacao = float(input("Cotação do dólar: "))\ndolares = reais / cotacao\nprint(f"R$ {reais:.2f} = US$ {dolares:.2f}")', tests: [{ i: ['100', '5'] }, { i: ['250', '4'] }], x: '<p>Se 1 dólar custa 5 reais, então 100 reais compram 100 ÷ 5 = 20 dólares. Usamos <code>float</code> porque valores em dinheiro têm casas decimais.</p>' },
    { id: 'm2-12', lvl: 4, proj: true, t: 'Projeto: ficha com os 4 tipos', q: `<p>Pergunte <b>nome</b> (texto), <b>idade</b> (int) e <b>altura</b> (float). Crie uma variável <code>ativo = True</code> (bool) e mostre a ficha:</p>${BOXPRE('Nome: Ana\nIdade: 20\nAltura: 1.65\nAtivo: True\nAno que vem: 21')}`, plan: ['Que tipo cada dado precisa ter?', 'Qual variável eu crio “de graça” sem input? (ativo)', 'Que conta faço para “Ano que vem”?'], h: ['Só a idade e a altura precisam de conversão.', 'Ano que vem = idade + 1 (por isso a idade precisa ser <code>int</code>).'], s: 'nome = input("Nome: ")\nidade = int(input("Idade: "))\naltura = float(input("Altura: "))\nativo = True\nprint(f"Nome: {nome}")\nprint(f"Idade: {idade}")\nprint(f"Altura: {altura}")\nprint(f"Ativo: {ativo}")\nprint(f"Ano que vem: {idade + 1}")', tests: [{ i: ['Ana', '20', '1.65'] }, { i: ['Leo', '33', '1.8'] }], x: '<p>Usamos os quatro tipos: <code>str</code> (nome), <code>int</code> (idade), <code>float</code> (altura) e <code>bool</code> (ativo). O <code>int</code> na idade permite calcular o ano que vem.</p>' },
    { id: 'm2-b1', lvl: 2, bug: true, k: 'mc', t: 'Variável que começa com número', q: '<p>Este código nem começa a rodar. Por quê?</p>', code: '1nome = "Ana"\nprint(1nome)', o: ['As aspas de “Ana” estão erradas', 'Nome de variável <b>não pode começar com número</b>', 'Falta um parêntese', '<code>print</code> deve vir antes'], a: 1, h: ['Releia a tabela de regras para nomes.'], x: '<p>Nomes de variáveis não podem começar com número. O Python responde <i>SyntaxError: invalid decimal literal</i> (ele achou que <code>1nome</code> era um número mal escrito). Use <code>nome1</code> ou apenas <code>nome</code>.</p>', fix: 'nome = "Ana"\nprint(nome)' },
    { id: 'm2-b2', lvl: 2, bug: true, k: 'mc', t: 'Idade entre aspas', q: '<p>Por que o programa dá erro na linha 2?</p>', code: 'idade = "20"\nproximo = idade + 1\nprint(proximo)', o: ['<code>"20"</code> está entre aspas: é <b>texto</b>, e texto + número dá erro', '<code>proximo</code> é nome inválido', 'Falta um <code>input</code>', 'O 1 precisa de aspas'], a: 0, h: ['Repare nas aspas em volta do 20.'], x: '<p>Com aspas, <code>"20"</code> é texto. Não dá para somar texto com o número 1 (<i>TypeError</i>). Sem aspas (<code>idade = 20</code>) funcionaria.</p>', fix: 'idade = 20\nproximo = idade + 1\nprint(proximo)' },
    { id: 'm2-b3', lvl: 2, bug: true, k: 'mc', t: 'Nome com letra maiúscula', q: '<p>O programa deveria mostrar Ana, mas dá erro.</p>', code: 'nome = "Ana"\nprint(Nome)', o: ['Falta aspas em <code>Nome</code>', '<code>Nome</code> e <code>nome</code> são etiquetas <b>diferentes</b>: a variável <code>Nome</code> não existe', '<code>print</code> não mostra variáveis', 'Falta um <code>return</code>'], a: 1, h: ['Compare a etiqueta criada com a etiqueta usada.'], x: '<p>Python diferencia maiúsculas de minúsculas. A caixa criada se chama <code>nome</code>; procurar por <code>Nome</code> gera <i>NameError</i> (e o Python ainda sugere: “Did you mean: nome?”).</p>', fix: 'nome = "Ana"\nprint(nome)' },
    { id: 'm2-b4', lvl: 3, bug: true, k: 'mc', t: 'Altura com vírgula', q: '<p>Uma pessoa digita <code>1,75</code> e o programa quebra. Por quê?</p>', code: 'altura = float(input("Altura: "))\nprint("Sua altura é", altura)', i: ['1,75'], fi: ['1.75'], o: ['<code>float()</code> não aceita números', 'O separador decimal em Python é o <b>ponto</b>: <code>1,75</code> não é reconhecido', 'Falta parênteses no print', 'Altura deveria ser <code>int</code>'], a: 1, h: ['Como se escreve decimal em Python?'], x: '<p>Em Python (e em quase toda programação) usamos ponto como separador decimal. <code>float("1,75")</code> dá <i>ValueError</i>. Peça ao usuário para digitar 1.75.</p>', fix: 'altura = float(input("Altura: "))\nprint("Sua altura é", altura)' },
    { id: 'm2-b5', lvl: 2, bug: true, k: 'mc', t: 'true minúsculo', q: '<p>O que há de errado?</p>', code: 'aprovado = true\nprint(aprovado)', o: ['O Python só reconhece <code>True</code> e <code>False</code> com <b>inicial maiúscula</b>', 'Variáveis não guardam verdadeiro/falso', 'Falta aspas em <code>true</code>', '<code>print</code> só mostra números'], a: 0, h: ['Como se escreve o valor verdadeiro em Python?'], x: '<p><code>true</code> minúsculo não existe: o Python acha que é o nome de uma variável e dá <i>NameError</i>. O correto é <code>True</code>.</p>', fix: 'aprovado = True\nprint(aprovado)' },

  quiz: [

  ex: [
    { id: 'm3-1', lvl: 1, t: 'Primeira soma', q: '<p>Mostre na tela o resultado de <code>15 + 27</code> (faça o Python calcular).</p>', h: ['<code>print(15 + 27)</code>, sem aspas.'], s: 'print(15 + 27)', x: '<p>Sem aspas, o Python calcula e mostra <b>42</b>.</p>' },
    { id: 'm3-2', lvl: 1, k: 'pr', t: 'Três divisões', q: '<p>O que vai aparecer? (3 linhas)</p>', code: 'print(10 / 4)\nprint(10 // 4)\nprint(10 % 4)', h: ['<code>/</code> divide normalmente; <code>//</code> só conta quantas vezes cabe; <code>%</code> é o resto.'], x: '<p>10 ÷ 4 = <b>2.5</b>. Cabe <b>2</b> vezes. Sobra <b>2</b> (10 − 2×4).</p>' },
    { id: 'm3-3', lvl: 1, k: 'mc', t: 'Maior ou igual', q: '<p>Qual é o resultado de <code>5 &gt;= 5</code>?</p>', o: ['<code>True</code>', '<code>False</code>', '<code>5</code>', 'Erro'], a: 0, h: ['<code>&gt;=</code> significa “maior <b>ou igual</b>”.'], x: '<p>5 não é maior que 5, mas é <b>igual</b>. Como <code>&gt;=</code> aceita os dois casos, a resposta é <code>True</code>.</p>' },
    { id: 'm3-4', lvl: 2, t: 'Multiplicação', q: `<p>Peça dois números inteiros e mostre o produto assim:</p>${BOXPRE('Resultado: 42')}<p>(para 6 e 7)</p>`, h: ['<code>int(input(...))</code> duas vezes.'], s: 'a = int(input("Primeiro: "))\nb = int(input("Segundo: "))\nprint(f"Resultado: {a * b}")', tests: [{ i: ['6', '7'] }, { i: ['9', '8'] }], x: '<p>Convertemos as entradas para inteiros e multiplicamos dentro da f-string.</p>' },
    { id: 'm3-5', lvl: 2, k: 'pr', t: 'Ordem das contas', q: '<p>O que vai aparecer? (4 linhas)</p>', code: 'print(2 + 3 * 4)\nprint((2 + 3) * 4)\nprint(2 ** 5)\nprint(17 % 5)', h: ['Multiplicação antes da soma; parênteses mandam em tudo.', '<code>2 ** 5</code> = 2×2×2×2×2.'], x: '<p>1) 3×4=12, +2 = <b>14</b>. 2) (2+3)=5, ×4 = <b>20</b>. 3) 2⁵ = <b>32</b>. 4) 17 ÷ 5 deixa resto <b>2</b>.</p>' },
    { id: 'm3-6', lvl: 2, t: 'Sou maior de idade?', q: '<p>Pergunte a idade (inteiro) e mostre <code>True</code> se for maior ou igual a 18, ou <code>False</code> caso contrário. (Só um <code>print</code> com a comparação!)</p>', h: ['<code>print(idade &gt;= 18)</code> já mostra True ou False.'], s: 'idade = int(input("Sua idade: "))\nprint(idade >= 18)', tests: [{ i: ['20'] }, { i: ['15'] }, { i: ['18'] }], x: '<p>A comparação <code>idade &gt;= 18</code> resulta em <code>True</code> ou <code>False</code>, e o <code>print</code> mostra esse resultado. Repare no 18: “maior <b>ou igual</b>” inclui 18.</p>' },
    { id: 'm3-7', lvl: 3, t: 'Par ou ímpar (True/False)', q: '<p>Peça um número inteiro e mostre <code>True</code> se ele for <b>par</b> e <code>False</code> se for ímpar.</p>', h: ['Um número é par quando o resto da divisão por 2 é zero.', '<code>print(numero % 2 == 0)</code>'], s: 'numero = int(input("Número: "))\nprint(numero % 2 == 0)', tests: [{ i: ['8'] }, { i: ['7'] }, { i: ['0'] }], x: '<p><code>numero % 2</code> dá o resto; <code>== 0</code> pergunta se é zero. O 0 também é par!</p>' },
    { id: 'm3-8', lvl: 3, t: 'Calculando o troco', q: `<p>Peça o <b>valor da compra</b> e o <b>valor pago</b> (decimais) e mostre o troco:</p>${BOXPRE('Troco: R$ 3.50')}<p>(para compra de 46.5 e pagamento de 50)</p>`, h: ['Troco = pago − compra.', 'Formate com <code>:.2f</code>.'], s: 'compra = float(input("Valor da compra: "))\npago = float(input("Valor pago: "))\ntroco = pago - compra\nprint(f"Troco: R$ {troco:.2f}")', tests: [{ i: ['46.5', '50'] }, { i: ['12', '20'] }], x: '<p>Subtraímos o valor da compra do valor pago e mostramos com duas casas decimais.</p>' },
    { id: 'm3-9', lvl: 3, t: 'Caixas de bolinhos', q: `<p>Peça o número de bolinhos (inteiro). Cada caixa comporta 5. Mostre:</p>${BOXPRE('Caixas cheias: 3\nSobram: 2')}<p>(para 17 bolinhos)</p>`, h: ['Caixas cheias: divisão inteira (<code>//</code>).', 'Sobram: resto (<code>%</code>).'], s: 'bolinhos = int(input("Bolinhos: "))\nprint(f"Caixas cheias: {bolinhos // 5}")\nprint(f"Sobram: {bolinhos % 5}")', tests: [{ i: ['17'] }, { i: ['23'] }], x: '<p><code>//</code> conta quantas vezes o 5 cabe; <code>%</code> mostra o que sobrou. É a mesma ideia da lição.</p>' },
    { id: 'm3-10', lvl: 3, t: 'Gorjeta de 10%', q: `<p>Peça o valor da conta (decimal) e mostre a gorjeta de 10% e o total:</p>${BOXPRE('Gorjeta: R$ 5.00\nTotal: R$ 55.00')}<p>(para conta de 50)</p>`, h: ['10% de um valor é o valor × 0.10.', 'Total = conta + gorjeta.'], s: 'conta = float(input("Valor da conta: "))\ngorjeta = conta * 0.10\ntotal = conta + gorjeta\nprint(f"Gorjeta: R$ {gorjeta:.2f}")\nprint(f"Total: R$ {total:.2f}")', tests: [{ i: ['50'] }, { i: ['80'] }], x: '<p>Guardamos a gorjeta numa variável para reutilizá-la no total. Ambos são mostrados com duas casas decimais.</p>' },
    { id: 'm3-11', lvl: 4, proj: true, t: 'Projeto: relógio em segundos', q: `<p>Peça uma quantidade total de <b>segundos</b> (inteiro) e mostre quantas <b>horas</b>, <b>minutos</b> e <b>segundos</b> isso representa:</p>${BOXPRE('Horas: 2\nMinutos: 5\nSegundos: 30')}<p>(para 7530 segundos)</p>`, plan: ['1 hora = 3600 segundos. Quantas horas <b>cabem</b> no total? (<code>//</code>)', 'Quantos segundos <b>sobram</b> depois das horas? (<code>%</code>)', 'Com os segundos que sobraram, repita a ideia com 60 para os minutos.'], h: ['horas = total // 3600 e resto = total % 3600.', 'minutos = resto // 60 e segundos = resto % 60.'], s: 'total = int(input("Total de segundos: "))\nhoras = total // 3600\nresto = total % 3600\nminutos = resto // 60\nsegundos = resto % 60\nprint(f"Horas: {horas}")\nprint(f"Minutos: {minutos}")\nprint(f"Segundos: {segundos}")', tests: [{ i: ['7530'] }, { i: ['3661'] }, { i: ['59'] }], x: '<p>7530 // 3600 = 2 horas, sobram 7530 % 3600 = 330 segundos. 330 // 60 = 5 minutos e 330 % 60 = 30 segundos. Usamos <code>//</code> e <code>%</code> duas vezes, em “cascata”.</p>' },
    { id: 'm3-12', lvl: 4, proj: true, t: 'Projeto: média ponderada', q: `<p>Peça 3 notas (decimais). A nota 1 tem <b>peso 2</b>, a nota 2 tem <b>peso 3</b> e a nota 3 tem <b>peso 5</b>. Mostre a média ponderada com 2 casas:</p>${BOXPRE('Média: 6.90')}<p>(para as notas 8, 6 e 7)</p>`, plan: ['Multiplico cada nota pelo seu peso.', 'Somo tudo.', 'Divido pela soma dos pesos (2 + 3 + 5 = 10).'], h: ['(n1 * 2 + n2 * 3 + n3 * 5) — cuidado com os parênteses!', 'Depois divida por 10.'], s: 'n1 = float(input("Nota 1: "))\nn2 = float(input("Nota 2: "))\nn3 = float(input("Nota 3: "))\nmedia = (n1 * 2 + n2 * 3 + n3 * 5) / 10\nprint(f"Média: {media:.2f}")', tests: [{ i: ['8', '6', '7'] }, { i: ['10', '5', '9'] }], x: '<p>Notas mais importantes contam mais. Os parênteses garantem que a divisão por 10 acontece <b>depois</b> de somar tudo.</p>' },
    { id: 'm3-b1', lvl: 2, bug: true, k: 'mc', t: 'O maior-ou-igual de trás para frente', q: '<p>Por que este código nem executa?</p>', code: 'idade = 20\nresultado = idade => 18\nprint(resultado)', o: ['O operador correto é <code>&gt;=</code>, e não <code>=&gt;</code>', 'Falta o <code>input</code>', '<code>18</code> precisa de aspas', 'A variável <code>resultado</code> é inválida'], a: 0, h: ['Como se escreve “maior ou igual” em Python?'], x: '<p>Em Python o símbolo é <code>&gt;=</code> (o sinal de maior primeiro). <code>=&gt;</code> não existe e causa <i>SyntaxError</i>.</p>', fix: 'idade = 20\nresultado = idade >= 18\nprint(resultado)' },
    { id: 'm3-b2', lvl: 3, bug: true, k: 'mc', t: 'A média que deu 11', q: '<p>Queremos a média de 7 e 8 (7.5), mas o resultado é 11.0. Por quê?</p>', code: 'media = 7 + 8 / 2\nprint("Média:", media)', o: ['O <code>print</code> está errado', 'A divisão acontece <b>antes</b> da soma: faltam parênteses', '7 e 8 deveriam ser texto', '<code>media</code> precisa ser <code>int</code>'], a: 1, h: ['Quem é calculado primeiro: a soma ou a divisão?'], x: '<p>A divisão tem prioridade: <code>8 / 2</code> = 4 e depois 7 + 4 = 11. Para somar primeiro, use parênteses: <code>(7 + 8) / 2</code> = 7.5. Este bug <b>não dá erro</b>: só resultado errado.</p>', fix: 'media = (7 + 8) / 2\nprint("Média:", media)' },
    { id: 'm3-b3', lvl: 3, bug: true, k: 'mc', t: 'Comparando texto com número', q: '<p>O programa quebra quando a pessoa digita 5. Por quê?</p>', code: 'numero = input("Digite um número: ")\nprint(numero > 10)', i: ['5'], o: ['<code>&gt;</code> só funciona com <code>float</code>', '<code>input</code> devolve <b>texto</b> e não dá para comparar texto com número', 'Faltam aspas em volta de 10', 'O print não aceita comparações'], a: 1, h: ['Qual o tipo de <code>numero</code>?'], x: '<p>O <code>input</code> devolveu o texto "5". Comparar texto com o número 10 gera <i>TypeError: \'&gt;\' not supported between instances of \'str\' and \'int\'</i>. Converta: <code>int(input(...))</code>.</p>', fix: 'numero = int(input("Digite um número: "))\nprint(numero > 10)' },
    { id: 'm3-b4', lvl: 2, bug: true, k: 'mc', t: 'Divisão impossível', q: '<p>O que acontece ao rodar este programa?</p>', code: 'total = 10\npessoas = 0\nprint(total / pessoas)', o: ['Mostra 0', 'Mostra 10', '<i>ZeroDivisionError</i>: não existe divisão por zero', 'Mostra None'], a: 2, h: ['Quanto vale dividir por zero em matemática?'], x: '<p>Dividir por zero é impossível, então o Python para com <i>ZeroDivisionError</i>. Programas reais verificam antes se o divisor é diferente de zero (você fará isso no próximo módulo).</p>', fix: 'total = 10\npessoas = 2\nprint(total / pessoas)' },
    { id: 'm3-b5', lvl: 3, bug: true, k: 'mc', t: 'Resto que não é resto', q: '<p>Queremos o <b>resto</b> de 10 ÷ 3 (que é 1), mas o programa mostra 3. Por quê?</p>', code: '# Quero o resto de 10 dividido por 3\nresto = 10 // 3\nprint("Resto:", resto)', o: ['<code>//</code> é a divisão <b>inteira</b> (quociente); o resto é <code>%</code>', 'Falta um <code>input</code>', '<code>resto</code> é palavra reservada', '10 deveria ser decimal'], a: 0, h: ['Qual operador dá “o que sobra”?'], x: '<p><code>10 // 3</code> = 3 (cabe 3 vezes). O resto é <code>10 % 3</code> = 1. Erros de operador não avisam: o programa roda, mas com a resposta errada.</p>', fix: '# Quero o resto de 10 dividido por 3\nresto = 10 % 3\nprint("Resto:", resto)' },
  ],
  quiz: [
    { q: 'O que significa <code>idade &gt;= 18</code>?', o: ['idade menor que 18', 'idade igual a 18', 'idade maior <b>ou igual</b> a 18', 'idade diferente de 18'], a: 2, x: '<code>&gt;=</code> pergunta “é maior ou igual?”. Com idade 18 a resposta é True.' },
    { q: 'Qual é o resultado de <code>17 // 5</code>?', o: ['3.4', '2', '3', '85'], a: 2, x: '<code>//</code> é a divisão inteira: o 5 cabe 3 vezes no 17 (sobram 2, que seria o <code>%</code>).' },
    { q: 'Qual operador descobre o <b>resto</b> de uma divisão?', o: ['<code>/</code>', '<code>//</code>', '<code>%</code>', '<code>**</code>'], a: 2, x: '<code>%</code> devolve o resto. Por isso <code>n % 2 == 0</code> testa se n é par.' },
    { q: 'Qual a diferença entre <code>=</code> e <code>==</code>?', o: ['Nenhuma', '<code>=</code> guarda um valor; <code>==</code> compara dois valores', '<code>=</code> compara; <code>==</code> guarda', '<code>==</code> é só para textos'], a: 1, x: 'Um <code>=</code> atribui (guarda). Dois <code>==</code> perguntam “é igual?”.' },
    { q: 'O que aparece com <code>print(2 + 3 * 4)</code>?', o: ['20', '14', '24', '9'], a: 1, x: 'Multiplicação vem antes: 3 × 4 = 12 e depois 2 + 12 = 14. Para 20, use <code>(2 + 3) * 4</code>.' },
    { q: 'O que <code>print("maria" == "Maria")</code> mostra?', o: ['True', 'False', 'Erro', 'maria'], a: 1, x: 'Maiúsculas e minúsculas são caracteres diferentes para o Python.' },

/* ===================================================================
   Módulo 4: Condições
